name: Record Phase 13 and 14 evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Update authoritative TODO and progress
        run: |
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          replacements = {
              "- [ ] Update health atomically.": "- [x] Update health atomically.",
              "- [ ] Log failures through ESP logging.": "- [x] Log failures through ESP logging.",
              "- [ ] Expose redacted health through diagnostics.":
                  "- [ ] Expose redacted health through diagnostics. (Remains open for Phase 19.)",
              "- [ ] request task stop;": "- [x] request task stop;",
              "- [ ] wait with bounded timeout;": "- [x] wait with bounded timeout;",
              "- [ ] configure outputs to a documented safe state;":
                  "- [x] configure outputs to a documented safe state;",
              "- [ ] delete semaphores after task exit;": "- [x] delete semaphores after task exit;",
              "- [ ] clear handles;": "- [x] clear handles;",
              "- [ ] return cleanup failure if any step fails.":
                  "- [x] return cleanup failure if any step fails.",
              "- [ ] semaphore give failure;": "- [x] semaphore give failure;",
              "- [ ] cancel failure;": "- [x] cancel failure;",
              "- [ ] GPIO output failure;": "- [x] GPIO output failure;",
              "- [ ] task stop timeout;": "- [x] task stop timeout;",
              "- [ ] second deinit call;": "- [x] second deinit call;",
              "- [ ] no use-after-free after deinit.": "- [x] no use-after-free after deinit.",
              "- [ ] Verify total flash size.": "- [x] Verify total flash size.",
              "- [ ] Verify application slots remain aligned.":
                  "- [x] Verify application slots remain aligned.",
              "- [ ] Add partition tests that require exactly one `nvs_keys` partition.":
                  "- [x] Add partition tests that require exactly one `nvs_keys` partition.",
              "- [ ] Document whether release uses flash-encryption-based or HMAC-based key":
                  "- [x] Document whether release uses flash-encryption-based or HMAC-based key",
              "- [ ] Do not claim physical confidentiality until the matching eFuse/flash":
                  "- [x] Do not claim physical confidentiality until the matching eFuse/flash",
              "- [ ] Add release checks that reject an unencrypted production configuration.":
                  "- [x] Add release checks that reject an unencrypted production configuration.",
              "- [ ] strict schema and bounds;": "- [x] strict schema and bounds;",
              "- [ ] NVS transaction with `nvs_commit()`;":
                  "- [x] NVS transaction with `nvs_commit()`;",
              "- [ ] readback validation;": "- [x] readback validation;",
              "- [ ] no plaintext administrator password;":
                  "- [x] no plaintext administrator password;",
              "- [ ] secure zero of temporary credential buffers;":
                  "- [x] secure zero of temporary credential buffers;",
              "- [ ] sessions remain RAM-only;": "- [x] sessions remain RAM-only;",
              "- [ ] revision conflict behavior.": "- [x] revision conflict behavior.",
              "- [ ] Remove AP and web password printing from ordinary development mode.":
                  "- [x] Remove AP and web password printing from ordinary development mode.",
              "- [ ] Add a separate manufacturing-only option if still required.":
                  "- [x] Add a separate manufacturing-only option if still required.",
              "- [ ] Make the release check fail when that option is enabled.":
                  "- [x] Make the release check fail when that option is enabled.",
              "- [ ] Add source scanning for credential log format strings.":
                  "- [x] Add source scanning for credential log format strings.",
              "- [ ] setup-state read;": "- [x] setup-state read;",
              "- [ ] setup credential submission;": "- [x] setup credential submission;",
              "- [ ] setup completion;": "- [x] setup completion;",
              "- [ ] restart.": "- [x] restart.",
              "Test interruption before and after every NVS commit/readback step.":
                  "- [x] Test interruption before and after every NVS commit/readback step.",
          }
          for old, new in replacements.items():
              if todo.count(old) != 1:
                  raise SystemExit(f"expected one TODO entry: {old!r}; found {todo.count(old)}")
              todo = todo.replace(old, new)
          todo_path.write_text(todo, encoding="utf-8")

          progress_path = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md")
          progress = progress_path.read_text(encoding="utf-8")
          section = '''

## Phase 13 — Device-controls shutdown and failure visibility

Status: **Implementation complete; diagnostics aggregation remains open for Phase 19.**

Evidence:

- implementation commit: `dbe4bcb409af751a290739a5751231419fcd787b`;
- cooperative task stop, bounded wait, safe GPIO state, cleanup accumulation, idempotent deinit,
  and atomic health updates are implemented behind the host-testable operations seam;
- host tests cover confirmation-signal failure, cancellation failure, GPIO output failure,
  stop timeout, repeated deinit, and no callback/resource use after deletion;
- the controls policy exceeded the required 90% line and 80% branch coverage thresholds;
- redacted controls-health aggregation is intentionally still unchecked and will be completed
  with the common subsystem diagnostics report in Phase 19.

## Phase 14 — Encrypted persistent provisioning

Status: **Software implementation and CI validation complete. Physical confidentiality remains
an explicit Phase 20 hardware claim.**

Evidence commit: `840544dbbe3bdd93366c4ac160cb7d658bfe1542`.

Validation evidence:

- Quality workflow run `30295745891`: authoritative `./scripts/check-all.sh` passed, including
  ESP-IDF v5.5.5 production GCC build, production and device-test clang-tidy, formatting,
  script policy, documentation, frontend checks, and host tests;
- Host Tests workflow run `30295743521`: normal host tests, ASan/UBSan, native coverage,
  frontend tests, and frontend coverage all passed;
- Device Test Build workflow run `30295743845`: device-test lint and ESP32-S3 firmware build
  passed using ESP-IDF v5.5.5.

Implemented behavior:

- the 8 MiB partition layout contains exactly one 4 KiB encrypted `nvs_keys` partition while
  retaining aligned equal-size OTA slots;
- production NVS uses HMAC-backed encryption and the production gate rejects disabled encryption,
  alternate/unprotected schemes, and manufacturing/development credential logging;
- the provisioning repository uses a canonical bounded record, revision conflicts,
  `nvs_commit()`, readback verification, factory reset verification, and secure zeroing;
- setup AP credentials and one-time setup code are domain-separated HMAC derivations bound to
  the device SoftAP MAC; the matching offline manufacturing label generator has fixed vectors;
- unprovisioned devices expose only setup routes and do not start USB, executor, repositories,
  or normal authenticated routes;
- setup JSON rejects trailing data, duplicate/unknown fields, wrong types, oversized values,
  and embedded NUL escapes; credential-bearing buffers are wiped on every exit path;
- ordinary logs contain no plaintext credentials; the only plaintext path is a permanently
  warned manufacturing-only compile option rejected by production configuration.

Not claimed by this phase:

- a physical ESP32-S3 has not yet been eFuse-provisioned and inspected for raw-flash secrecy;
- real first-run, reboot persistence, button confirmation, and interruption behavior remain in
  the Phase 20 hardware matrix.
'''
          if "## Phase 14 — Encrypted persistent provisioning" in progress:
              raise SystemExit("Phase 14 progress evidence already present")
          progress_path.write_text(progress.rstrip() + section + "\n", encoding="utf-8")
          PY
      - name: Validate documentation
        run: ./scripts/check-docs.sh
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md
          git commit -m "docs(fix1): record Phase 13 and 14 evidence"
          git push origin HEAD:master
