name: Phase 14 integration validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake ninja-build libcjson-dev git flex bison gperf \
            python3 python3-pip python3-venv ccache libffi-dev libssl-dev \
            dfu-util libusb-1.0-0
          python3 -m pip install --break-system-packages gcovr
      - name: Validate partition policy
        run: bash ./scripts/check-partitions.sh
      - name: Validate production configuration policy
        run: bash ./scripts/check-production-config.sh
      - name: Validate credential logging policy
        run: bash ./scripts/check-credential-logging.sh
      - name: Validate setup route isolation policy
        run: bash ./scripts/check-setup-route-isolation.sh
      - name: Validate host code
        run: |
          ./scripts/run-tests.sh
          ./scripts/run-tests.sh --sanitizers
          ./scripts/generate-native-coverage.sh
      - name: Validate web application
        run: ./scripts/check-webapp.sh
      - name: Install ESP-IDF v5.5.5
        run: |
          git clone --depth 1 --branch v5.5.5 --recursive \
            https://github.com/espressif/esp-idf.git "${RUNNER_TEMP}/esp-idf"
          "${RUNNER_TEMP}/esp-idf/install.sh" esp32s3
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          source "${RUNNER_TEMP}/esp-idf/export.sh"
          cd firmware
          idf.py set-target esp32s3
          idf.py build
