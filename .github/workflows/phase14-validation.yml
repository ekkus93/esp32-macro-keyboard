name: Phase 14 integration validation

on:
  push:
    paths:
      - .github/workflows/phase14-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Validate host policies and ESP-IDF build
        shell: bash
        run: |
          set +e
          validation_log="${RUNNER_TEMP}/phase14-validation.log"
          status=0
          {
            set -x
            sudo apt-get update
            sudo apt-get install --yes \
              build-essential cmake ninja-build libcjson-dev git flex bison gperf \
              python3 python3-pip python3-venv ccache libffi-dev libssl-dev \
              dfu-util libusb-1.0-0
            python3 -m pip install --break-system-packages gcovr
            ./scripts/run-tests.sh
            ./scripts/run-tests.sh --sanitizers
            ./scripts/generate-native-coverage.sh
            git clone --depth 1 --branch v5.5.5 --recursive \
              https://github.com/espressif/esp-idf.git "${RUNNER_TEMP}/esp-idf"
            "${RUNNER_TEMP}/esp-idf/install.sh" esp32s3
            source "${RUNNER_TEMP}/esp-idf/export.sh"
            cd firmware
            idf.py set-target esp32s3
            idf.py build
          } >"${validation_log}" 2>&1 || status=$?
          set -e

          if [[ "${status}" -eq 0 ]]; then
            result="PASS"
          else
            result="FAIL"
          fi
          mkdir -p docs/review-source
          {
            printf '# Phase 14 integration validation\n\n'
            printf -- '- Result: **%s**\n' "${result}"
            printf -- '- Source commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Host tests: normal, ASan/UBSan, and strict coverage\n'
            printf -- '- Firmware: ESP-IDF `v5.5.5`, target `esp32s3`\n'
            printf '\n## Validation log tail\n\n```text\n'
            tail -n 240 "${validation_log}"
            printf '\n```\n'
          } >docs/review-source/PHASE14_INTEGRATION_VALIDATION.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review-source/PHASE14_INTEGRATION_VALIDATION.md
          git commit -m "test(phase14): record integration validation"
          git push origin HEAD:master
          exit "${status}"
