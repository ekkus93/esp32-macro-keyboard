name: Phase 14 final validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0 gcovr==8.6
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install authoritative ESP-IDF toolchains
        run: ./scripts/install-esp-idf.sh
      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci
      - name: Run authoritative gate
        shell: bash
        run: |
          source "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh
      - name: Run sanitizers and coverage
        run: |
          ./scripts/run-tests.sh --sanitizers
          ./scripts/generate-native-coverage.sh
          ./scripts/generate-frontend-coverage.sh
      - name: Build device tests
        shell: bash
        run: |
          source "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/build-device-tests.sh
