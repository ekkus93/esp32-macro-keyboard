name: Phase 14 clang configuration diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF v5.5.5
        run: |
          git clone --depth 1 --branch v5.5.5 --recursive \
            https://github.com/espressif/esp-idf.git "${RUNNER_TEMP}/esp-idf"
          "${RUNNER_TEMP}/esp-idf/install.sh" esp32s3
      - name: Diagnose production clang configuration
        shell: bash
        run: |
          source "${RUNNER_TEMP}/esp-idf/export.sh"
          printf 'IDF version: '
          idf.py --version
          printf 'IDF_TOOLCHAIN before command: %s\n' "${IDF_TOOLCHAIN-<unset>}"
          set +e
          IDF_TOOLCHAIN=clang idf.py -C firmware -B firmware/build-clang \
            set-target esp32s3 >"${RUNNER_TEMP}/clang-config.log" 2>&1
          status=$?
          set -e
          tail -n 250 "${RUNNER_TEMP}/clang-config.log"
          printf 'clang configuration status: %d\n' "${status}"
          exit "${status}"
