          python3 -c 'from pathlib import Path; p=Path("webapp/src/features/shell/v2/useDeviceStatus.ts"); t=p.read_text(); old="                if (active) {\\n                  schedulePoll();\\n                }"; new="                schedulePoll();"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old, new, 1))'

      - name: Format changed frontend files
        working-directory: webapp
        run: >-
          npx prettier --write
          src/features/shell/v2/useDeviceStatus.ts
          src/AppV2.tsx
          tests/v2-use-device-status.test.tsx
          tests/v2-app-v2.test.tsx

      - name: Typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Lint
        working-directory: webapp
        run: npm run lint

      - name: Check formatting
        working-directory: webapp
        run: npm run format:check

      - name: Run focused USB freshness regressions
        working-directory: webapp
        run: >-
          npx vitest run
          tests/v2-use-device-status.test.tsx
          tests/v2-app-v2.test.tsx
          tests/v2-macros-page.test.tsx
          tests/v2-macro-preview-page.test.tsx

      - name: Build production webapp
        working-directory: webapp
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "master moved from triggering SHA $GITHUB_SHA to $remote_sha; refusing to overwrite" >&2
            exit 1
          fi
          rm -f .github/workflows/apply-h9-usb-freshness.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(webapp): expose stale USB status"
          git push origin HEAD:master
