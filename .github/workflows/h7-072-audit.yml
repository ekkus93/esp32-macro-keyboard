name: H7-072 Error Classification Validator

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/h7-072-audit.yml"

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang-format cmake libcjson-dev

      - name: Apply H7-072 mapping regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_h7_072_patch.py code
          clang-format -i tests/host/test_web_send.c tests/host/test_web_server_send_route.c
          git diff --check
          if git grep -n 'APP_ERROR_STORAGE_UNAVAILABLE' -- firmware/components/macro_executor; then
            echo 'executor component must not use storage-unavailable error classification' >&2
            exit 1
          fi

      - name: Run executor host tests
        shell: bash
        run: ./scripts/run-tests.sh executor

      - name: Run web host tests
        shell: bash
        run: ./scripts/run-tests.sh web

      - name: Run executor sanitizers
        shell: bash
        run: ./scripts/run-tests.sh --sanitizers executor

      - name: Run web sanitizers
        shell: bash
        run: ./scripts/run-tests.sh --sanitizers web

      - name: Commit validated H7-072 regressions
        shell: bash
        run: |
          set -euo pipefail
          git add tests/host/test_web_send.c tests/host/test_web_server_send_route.c
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(web): lock H7-072 executor error mapping"
          git rev-parse HEAD > "$RUNNER_TEMP/h7-072-product-sha"
          git push origin HEAD:master

      - name: Record H7-072 evidence
        shell: bash
        run: |
          set -euo pipefail
          export PRODUCT_SHA="$(cat "$RUNNER_TEMP/h7-072-product-sha")"
          python3 scripts/tmp_h7_072_patch.py docs
          git rm .github/workflows/h7-072-audit.yml scripts/tmp_h7_072_patch.py
          git add docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md docs/implementation-v2/H7_072_EXECUTOR_ERROR_CLASSIFICATION_2026-08-11.md
          git diff --cached --check
          git commit -m "docs: record H7-072 error classification"
          git push origin HEAD:master
