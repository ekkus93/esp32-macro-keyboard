---
name: Export Phase 15.2 analyzer base files

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Package exact base files
        run: |
          root="${RUNNER_TEMP}/phase15-2-analyzer-base"
          mkdir -p "${root}/firmware/components/storage" "${root}/tests/host"
          cp \
            firmware/components/storage/storage_atomic_validators.c \
            firmware/components/storage/storage_json.c \
            firmware/components/storage/storage_paths.c \
            firmware/components/storage/storage_repository_macros.c \
            firmware/components/storage/storage_repository_objects_json.c \
            firmware/components/storage/storage_repository_objects_json.h \
            firmware/components/storage/storage_repository_order.c \
            firmware/components/storage/storage_repository_order.h \
            firmware/components/storage/storage_repository_procedures.c \
            "${root}/firmware/components/storage/"
          cp \
            tests/host/test_storage_object_json.c \
            tests/host/test_storage_procedures.c \
            "${root}/tests/host/"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/phase15-2-analyzer-base.tar.gz" \
            phase15-2-analyzer-base
      - uses: actions/upload-artifact@v4
        with:
          name: phase15-2-analyzer-base-files
          path: ${{ runner.temp }}/phase15-2-analyzer-base.tar.gz
          if-no-files-found: error
          retention-days: 1
