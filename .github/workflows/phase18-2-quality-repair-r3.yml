name: Phase 18.2 Quality Repair R3

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase18-2-quality-repair-r3.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: phase18-2-quality-repair-r3
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: true

      - name: Set up required Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          export GOTOOLCHAIN=go1.25.12
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./scripts/install-esp-idf.sh
          cd webapp
          npm ci
          npm run audit:ci

      - name: Apply iterative parser and implicit enum sentinel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path(".github/workflows/phase18-2-quality-repair.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          clang-format -i firmware/components/storage/storage_package.c"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("could not extract the verified parser transformation")
          transformation = textwrap.dedent(workflow[start + len(start_marker) : end])
          exec(compile(transformation, str(workflow_path), "exec"), {"__name__": "__main__"})

          source_path = Path("firmware/components/storage/storage_package.c")
          source = source_path.read_text(encoding="utf-8")
          enum_anchor = '''typedef enum {
              PACKAGE_ARRAY_SETS = 0,
              PACKAGE_ARRAY_MACROS,
              PACKAGE_ARRAY_GLOBAL_MACROS,
              PACKAGE_ARRAY_PROCEDURES,
              PACKAGE_ARRAY_PROGRESS,
          } package_array_t;
          '''
          enum_replacement = '''typedef enum {
              PACKAGE_ARRAY_SETS = 0,
              PACKAGE_ARRAY_MACROS,
              PACKAGE_ARRAY_GLOBAL_MACROS,
              PACKAGE_ARRAY_PROCEDURES,
              PACKAGE_ARRAY_PROGRESS,
              PACKAGE_ARRAY_COUNT,
          } package_array_t;
          '''
          sentinel = "        return STORAGE_PACKAGE_ARRAY_COUNT;\n"
          if source.count(enum_anchor) != 1 or source.count(sentinel) != 1:
              raise SystemExit("package-array sentinel anchors were not unique")
          source = source.replace(enum_anchor, enum_replacement).replace(
              sentinel, "        return PACKAGE_ARRAY_COUNT;\n"
          )
          source_path.write_text(source, encoding="utf-8")
          PY

          clang-format -i firmware/components/storage/storage_package.c
          git diff --check

      - name: Run authoritative quality gate
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh

      - name: Verify exact change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "firmware/components/storage/storage_package.c" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit verified parser repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firmware/components/storage/storage_package.c
          git commit -m "refactor: make package parser iterative"
          git push origin HEAD:master

      - name: Publish repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          python3 - "${commit_sha}" <<'PY' > /tmp/phase18-2-status.json
          import json
          import os
          import sys

          body = (
              "Phase 18.2 quality repair R3 workflow finished.\n\n"
              f"Status: `{os.environ['JOB_STATUS']}`\n"
              f"Run ID: `{os.environ['RUN_ID']}`\n"
              f"Checkout commit: `{sys.argv[1]}`\n"
              "The run is authoritative only when status is success and the parser repair commit is present on master."
          )
          print(json.dumps({"body": body}))
          PY
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/24" \
            --input /tmp/phase18-2-status.json \
            > /dev/null
