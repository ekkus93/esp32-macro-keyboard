name: Phase 18.3 Core Implementation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/phase18-3-core-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libcjson-dev

      - name: Apply Phase 18.3 transaction core
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          helper = Path("tools/phase18_3_core_impl.py")
          text = helper.read_text()

          callback_old = "                                                       bool should_be_present) {"
          callback_new = "                                                      bool should_be_present) {"
          if text.count(callback_old) != 2:
              raise SystemExit(
                  f"expected two callback-indent normalizations, found {text.count(callback_old)}"
              )
          text = text.replace(callback_old, callback_new)

          recover_tokens = (
              "generate_uuid,",
              "uuids,",
              "update_index,",
              "index);",
              "index,",
              "validate_set,",
              "NULL,",
              "remove_tree,",
              "NULL);",
          )
          for token in recover_tokens:
              old = "\n                                                     " + token
              new = "\n                                                    " + token
              text = text.replace(old, new)

          helper.write_text(text)
          PY
          python3 tools/phase18_3_core_impl.py 2>&1 | tee /tmp/phase18-3-core.log

      - name: Validate transaction core
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            cmake -S tests/host -B build/phase18-3-host -G Ninja
            cmake --build build/phase18-3-host --target storage_transaction_tests
            ctest --test-dir build/phase18-3-host --output-on-failure -R '^storage_transaction$'
          } 2>&1 | tee -a /tmp/phase18-3-core.log

      - name: Record failed implementation run
        if: failure()
        shell: bash
        run: |
          mkdir -p docs
          {
            echo '# Phase 18.3 core automation failure'
            echo
            echo 'The temporary implementation workflow failed before committing code.'
            echo
            echo '```text'
            cat /tmp/phase18-3-core.log 2>/dev/null || echo 'No captured log was available.'
            echo '```'
          } > docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git commit -m "ci: record Phase 18.3 core automation failure"
          git push origin HEAD:master

      - name: Commit validated implementation
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/storage tests/host
          git commit -m "feat(storage): add replace transaction recovery core"
          git push origin HEAD:master
