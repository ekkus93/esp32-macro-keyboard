name: Phase 18.3 Set Tree Implementation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/phase18-3-core-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libcjson-dev

      - name: Apply Phase 18.3 set-tree validator
        shell: bash
        run: |
          set -o pipefail
          python3 tools/phase18_3_tree_impl.py 2>&1 | tee /tmp/phase18-3-tree.log

      - name: Validate set-tree and transaction recovery
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            cmake -S tests/host -B build/phase18-3-tree -G Ninja
            cmake --build build/phase18-3-tree --target storage_set_tree_tests storage_transaction_tests
            ctest --test-dir build/phase18-3-tree --output-on-failure -R '^(storage_set_tree|storage_transaction)$'
          } 2>&1 | tee -a /tmp/phase18-3-tree.log

      - name: Record failed implementation run
        if: failure()
        shell: bash
        run: |
          {
            echo '# Phase 18.3 set-tree automation failure'
            echo
            echo 'The temporary implementation workflow failed before committing code.'
            echo
            echo '```text'
            cat /tmp/phase18-3-tree.log 2>/dev/null || echo 'No captured log was available.'
            echo '```'
          } > docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git commit -m "ci: record Phase 18.3 set-tree automation failure"
          git push origin HEAD:master

      - name: Commit validated implementation
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/storage tests/host
          git commit -m "feat(storage): validate complete replacement set trees"
          git push origin HEAD:master
