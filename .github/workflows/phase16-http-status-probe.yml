name: Phase 16 HTTP integration status probe

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase16-http-status-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record integration run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/phase16-http-integration-once.yml/runs?per_page=3" \
            --output /tmp/runs.json
          {
            echo "# Phase 16 HTTP integration status"
            echo
            echo '```json'
            jq '{runs: [.workflow_runs[] | {id, head_sha, status, conclusion, html_url}]}' /tmp/runs.json
            echo '```'
          } > docs/CI_PHASE16_HTTP_STATUS.md
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_PHASE16_HTTP_STATUS.md
          git commit -m "ci: record Phase 16 HTTP integration status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

