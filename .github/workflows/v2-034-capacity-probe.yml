name: V2-034 Capacity Probe

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-034-capacity-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned LittleFS tooling
        run: python3 -m pip install --user littlefs-python==0.15.0

      - name: Measure candidate image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from littlefs import LittleFS

          partition_bytes = 0x80000
          block_size = 4096
          block_count = partition_bytes // block_size
          maximum = 128 * 1024
          fs = LittleFS(block_size=block_size, block_count=block_count, name_max=64)
          fs.mkdir('/repository')
          expected = {}
          for index, name in enumerate((
              '00000000000000000001.gz',
              '00000000000000000002.gz',
              '00000000000000000003.gz.tmp',
          ), start=1):
              payload = bytes(((offset + index) % 251 for offset in range(maximum)))
              expected[name] = hashlib.sha256(payload).hexdigest()
              with fs.open('/repository/' + name, 'wb') as handle:
                  handle.write(payload)
          used_blocks = fs.used_block_count
          used_bytes = used_blocks * block_size
          remaining_bytes = partition_bytes - used_bytes
          print(f'partition_bytes={partition_bytes}')
          print(f'candidate_max_bytes={maximum}')
          print(f'payload_bytes={3 * maximum}')
          print(f'used_blocks={used_blocks}')
          print(f'used_bytes={used_bytes}')
          print(f'remaining_bytes={remaining_bytes}')
          print(f'overhead_bytes={used_bytes - 3 * maximum}')
          for name, digest in expected.items():
              with fs.open('/repository/' + name, 'rb') as handle:
                  actual = hashlib.sha256(handle.read()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'byte mismatch for {name}')
          Path('/tmp/userdata.bin').write_bytes(bytes(fs.context.buffer))
          if Path('/tmp/userdata.bin').stat().st_size != partition_bytes:
              raise SystemExit('image size does not match userdata partition')
          PY
          littlefs-python list /tmp/userdata.bin --block-size=4096 --name-max=64
