name: Apply H11-111 closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-h11-111-closeout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install documentation lint dependencies
        run: npm ci --prefix webapp
      - name: Close H11-111 from literal evidence audit
        env:
          EXPECTED_PARENT: 600b50a905615ef0c74363d892e6ceec3c88bad7
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md")
          text = path.read_text(encoding="utf-8")
          old = """### H11-111 — Literal evidence audit

          For every checked affected item:

          - [ ] every named behavior is independently proven,
          - [ ] hardware wording has hardware evidence,
          - [ ] spot-check wording is not called a full audit,
          - [ ] host fake behavior is not called real-httpd/device behavior,
          - [ ] exact evidence SHA is present,
          - [ ] evidence file exists at the referenced path.
          """
          new = """### H11-111 — Literal evidence audit

          For every checked affected item:

          - [x] every named behavior is independently proven,
          - [x] hardware wording has hardware evidence,
          - [x] spot-check wording is not called a full audit,
          - [x] host fake behavior is not called real-httpd/device behavior,
          - [x] exact evidence SHA is present,
          - [x] evidence file exists at the referenced path.

          - Evidence (2026-08-13): literal proof map completed at product/code basis
            `cc9e05727a2767f070dc79e9e699146e10509b34` and documentation basis
            `83c3c5a0cf13e7ad37e7a55436d2ea689db954ee`. Exact H10 software candidates,
            historical physical-board SHAs, fake-httpd scope, and spot-check/full-audit
            distinctions are recorded in
            `docs/implementation-v2/H11_111_LITERAL_EVIDENCE_AUDIT_2026-08-13.md`.
            No additional falsely checked affected V2 item was found; current H1/H2/H3
            hardware reruns, H4, H5, H11-112, the H11 exit gate, and H12 remain open.
          """
          if text.count(old) != 1:
              raise SystemExit("H11-111 open block did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          ./webapp/node_modules/.bin/markdownlint-cli2 \
            docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md \
            docs/implementation-v2/H11_111_LITERAL_EVIDENCE_AUDIT_2026-08-13.md
          git rm .github/workflows/apply-h11-111-closeout.yml
          git add docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            .github/workflows/apply-h11-111-closeout.yml \
            docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md | sort)"
          git diff --cached --check
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "docs: close H11-111 literal evidence audit"
          git push origin HEAD:master
