name: Validate Phase 17 frontend foundation once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase17-frontend-foundation-once.yml"
      - "scripts/apply-phase17-foundation.py"

permissions:
  contents: write

concurrency:
  group: phase17-frontend-foundation-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Phase 17 frontend foundation
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply-phase17-foundation.py \
            2>&1 | tee /tmp/phase17-foundation-transform.log

      - name: Remove temporary Phase 17 tooling
        id: cleanup
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            rm -f scripts/apply-phase17-foundation.py
            rm -f .github/workflows/phase17-frontend-foundation-once.yml
          } 2>&1 | tee /tmp/phase17-foundation-cleanup.log

      - uses: actions/setup-node@v4
        id: node
        if: steps.cleanup.outcome == 'success'
        continue-on-error: true
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        id: frontend_deps
        if: steps.node.outcome == 'success'
        continue-on-error: true
        working-directory: webapp
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/phase17-foundation-frontend-deps.log

      - name: Format generated frontend
        id: format
        if: steps.frontend_deps.outcome == 'success'
        continue-on-error: true
        working-directory: webapp
        shell: bash
        run: |
          set -o pipefail
          {
            npm run format:write
            npx stylelint 'src/**/*.css' --fix
            npm run format:write
          } 2>&1 | tee /tmp/phase17-foundation-format.log

      - name: Run focused frontend validation
        id: frontend
        if: steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '--- app-sets.test.tsx lines 100-155 ---'
            sed -n '100,155p' webapp/tests/app-sets.test.tsx
            echo '--- SettingsPage.tsx ---'
            sed -n '1,240p' webapp/src/features/settings/SettingsPage.tsx
            ! git grep -n -E 'HP Chromebook 11 G6 EE|value\.data as [A-Za-z]' -- webapp/src
            cd webapp
            npm run typecheck
            npm run lint
            npm run stylelint
            npm run format:check
            npm run test
            npm run build
          } 2>&1 | tee /tmp/phase17-foundation-frontend.log

      - name: Install repository validation dependencies
        id: host_deps
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              build-essential clang-format clang-tidy cmake jq libcjson-dev python3-venv shellcheck
            python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
            go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee /tmp/phase17-foundation-host-deps.log

      - name: Format and test changed firmware
        id: firmware
        if: steps.host_deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mapfile -t c_files < <(git diff --name-only --diff-filter=ACM | grep -E '\.(c|h)$' || true)
            if (( ${#c_files[@]} > 0 )); then
              clang-format -i "${c_files[@]}"
            fi
            ./scripts/run-tests.sh auth
            ./scripts/run-tests.sh web
            ./scripts/run-tests.sh --sanitizers auth
            ./scripts/run-tests.sh --sanitizers web
          } 2>&1 | tee /tmp/phase17-foundation-firmware.log

      - name: Install ESP-IDF v5.5.5
        id: idf
        if: steps.firmware.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          env -u VIRTUAL_ENV bash ./scripts/install-esp-idf.sh \
            2>&1 | tee /tmp/phase17-foundation-idf.log

      - name: Run authoritative repository gate
        id: gate
        if: steps.idf.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            . "$HOME/esp/esp-idf-v5.5.5/export.sh"
            bash ./scripts/check-all.sh
          } 2>&1 | tee /tmp/phase17-foundation-gate.log

      - name: Commit validated Phase 17 frontend foundation
        if: >-
          steps.transform.outcome == 'success' &&
          steps.cleanup.outcome == 'success' &&
          steps.node.outcome == 'success' &&
          steps.frontend_deps.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.host_deps.outcome == 'success' &&
          steps.firmware.outcome == 'success' &&
          steps.idf.outcome == 'success' &&
          steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): add Phase 17 session and set foundation"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git push origin HEAD:master

      - name: Record exact failure
        if: >-
          steps.transform.outcome == 'failure' ||
          steps.cleanup.outcome == 'failure' ||
          steps.node.outcome == 'failure' ||
          steps.frontend_deps.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.frontend.outcome == 'failure' ||
          steps.host_deps.outcome == 'failure' ||
          steps.firmware.outcome == 'failure' ||
          steps.idf.outcome == 'failure' ||
          steps.gate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git reset --hard origin/master
          git clean -fd
          {
            echo "# Phase 17 frontend foundation failure"
            echo
            echo "- Transform: ${{ steps.transform.outcome }}"
            echo "- Cleanup: ${{ steps.cleanup.outcome }}"
            echo "- Node setup: ${{ steps.node.outcome }}"
            echo "- Frontend dependencies: ${{ steps.frontend_deps.outcome }}"
            echo "- Format: ${{ steps.format.outcome }}"
            echo "- Frontend validation: ${{ steps.frontend.outcome }}"
            echo "- Host dependencies: ${{ steps.host_deps.outcome }}"
            echo "- Firmware formatting/tests: ${{ steps.firmware.outcome }}"
            echo "- ESP-IDF install: ${{ steps.idf.outcome }}"
            echo "- Authoritative gate: ${{ steps.gate.outcome }}"
            for log in \
              /tmp/phase17-foundation-transform.log \
              /tmp/phase17-foundation-cleanup.log \
              /tmp/phase17-foundation-frontend-deps.log \
              /tmp/phase17-foundation-format.log \
              /tmp/phase17-foundation-frontend.log \
              /tmp/phase17-foundation-host-deps.log \
              /tmp/phase17-foundation-firmware.log \
              /tmp/phase17-foundation-idf.log \
              /tmp/phase17-foundation-gate.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "## $(basename "$log")"
                echo
                echo '```text'
                grep -n -E \
                  'error|Error|ERROR|FAILED|Failure|AddressSanitizer|UndefinedBehaviorSanitizer|expected|mismatch' \
                  "$log" | tail -n 260 || true
                echo
                tail -n 420 "$log"
                echo '```'
              fi
            done
          } > docs/CI_PHASE17_FRONTEND_FOUNDATION_FAILURE.md
          sed -i 's/[[:space:]]\+$//' docs/CI_PHASE17_FRONTEND_FOUNDATION_FAILURE.md
          git add docs/CI_PHASE17_FRONTEND_FOUNDATION_FAILURE.md
          git commit -m "ci: record Phase 17 frontend foundation failure"
          git push origin HEAD:master
          exit 1
