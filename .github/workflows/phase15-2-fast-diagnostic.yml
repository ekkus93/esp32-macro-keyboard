---
name: Phase 15.2 Fast Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install lightweight validation tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install --yes clang-format jq libcjson-dev shellcheck >/dev/null
          python3 -m pip install --user \
            cmakelang==0.6.13 yamllint==1.38.0 gcovr==8.6 >/dev/null
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm ci --prefix webapp --silent

      - name: Check formatting
        run: ./scripts/check-format.sh

      - name: Check static-analysis policy
        run: ./scripts/check-static-analysis-policy.sh

      - name: Check partitions
        run: ./scripts/check-partitions.sh

      - name: Check production configuration
        run: bash ./scripts/check-production-config.sh

      - name: Check credential logging
        run: bash ./scripts/check-credential-logging.sh

      - name: Check web application
        run: ./scripts/check-webapp.sh

      - name: Check scripts
        run: ./scripts/check-scripts.sh

      - name: Check documentation
        run: ./scripts/check-docs.sh

      - name: Run host tests
        run: ./scripts/run-tests.sh
