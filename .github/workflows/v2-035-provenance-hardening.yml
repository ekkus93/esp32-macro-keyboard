name: V2-035 firmware provenance hardening

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-035-provenance-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0

      - name: Apply provenance hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch_path = Path('.github/v2-035-provenance-hardening.py')
          patch_text = patch_path.read_text(encoding='utf-8')

          duplicate_fixture_patch = '''replace_once(
              "tests/scripts/test-v2-035-hardware.py",
              "            \\"buildId\\": \\"abc123\\",\\n",
              "            \\"buildId\\": \\"a\\" * 39,\\n",
          )
          replace_once(
              "tests/scripts/test-v2-035-hardware.py",
              "            \\"buildId\\": \\"abc123\\",\\n",
              "            \\"buildId\\": \\"a\\" * 39,\\n",
          )
          '''
          if patch_text.count(duplicate_fixture_patch) != 1:
              raise SystemExit('temporary fixture cardinality bootstrap did not match exactly once')
          patch_text = patch_text.replace(duplicate_fixture_patch, '', 1)

          misplaced_doc_patch = '''insert_after(
              "docs/implementation-v2/V2_035_HARDWARE_EVIDENCE_HARNESS_2026-08-06.md",
              "- Final evidence is bound to an exact 40-character firmware commit and the\\n  `ESP32-S3R8` target.\\n",
              "- The exact commit is accepted only from a clean production flash manifest;\\n  the manifest's application-image SHA-256, full ELF SHA-256, 39-character\\n  diagnostics build ID, and manifest SHA-256 are preserved in the evidence.\\n",
          )
          '''
          if patch_text.count(misplaced_doc_patch) != 1:
              raise SystemExit('temporary misplaced documentation patch did not match exactly once')
          patch_path.write_text(
              patch_text.replace(misplaced_doc_patch, '', 1),
              encoding='utf-8',
          )

          test_path = Path('tests/scripts/test-v2-035-hardware.py')
          test_text = test_path.read_text(encoding='utf-8')
          needle = '            "buildId": "abc123",\n'
          if test_text.count(needle) != 2:
              raise SystemExit(f'expected two diagnostics fixtures, found {test_text.count(needle)}')
          test_path.write_text(
              test_text.replace(needle, '            "buildId": "a" * 39,\n'),
              encoding='utf-8',
          )
          PY
          python3 .github/v2-035-provenance-hardening.py
          chmod +x tests/scripts/fakes/esptool.py

      - name: Run focused regression gates
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run-v2-035-hardware.py tests/scripts/test-v2-035-hardware.py
          python3 tests/scripts/test-v2-035-hardware.py
          bash -n scripts/generate-flash-manifest.sh tests/scripts/test-generate-flash-manifest.sh tests/scripts/fakes/esptool.py
          bash tests/scripts/test-generate-flash-manifest.sh
          git diff --check

      - name: Commit permanent scoped changes
        run: |
          set -euo pipefail
          rm -f .github/v2-035-provenance-hardening.py
          rm -f .github/workflows/v2-035-provenance-hardening.yml
          git add -A

          cat > /tmp/expected-paths <<'EOF'
          .github/v2-035-provenance-hardening.py
          .github/workflows/v2-035-provenance-hardening.yml
          docs/implementation-v2/V2_035_HARDWARE_EVIDENCE_HARNESS_2026-08-06.md
          scripts/check-scripts.sh
          scripts/generate-flash-manifest.sh
          scripts/run-v2-035-hardware.py
          tests/scripts/fakes/esptool.py
          tests/scripts/test-generate-flash-manifest.sh
          tests/scripts/test-v2-035-hardware.py
          EOF
          git diff --cached --name-only | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "Harden V2-035 firmware provenance"
          git push origin HEAD:master
