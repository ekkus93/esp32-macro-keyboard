name: H6-061 Validator Trigger Repair

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/h6-061-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Repair validator and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/h6-061-async-health.yml')
          text = path.read_text()
          line = "    if: github.event.head_commit.message == 'chore: stage H6-061 async health validator'\n"
          if text.count(line) != 1:
              raise SystemExit('expected exactly one invalid if line')
          path.write_text(text.replace(line, '', 1))
          PY
          git rm .github/workflows/h6-061-repair.yml
          git add .github/workflows/h6-061-async-health.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: repair H6-061 validator"
          git push origin HEAD:master
