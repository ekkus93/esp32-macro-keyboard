# One-shot workflow; remove before merging.
name: Phase 1 Lockfile Repair

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Regenerate patched lock entries
        working-directory: webapp
        shell: bash
        run: |
          set -euo pipefail
          npm update postcss fast-uri brace-expansion --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock = require('./package-lock.json')

          function parse(version) {
            const parts = version?.split('.').map(Number)
            if (parts?.length !== 3 || !parts.every(Number.isInteger)) return null
            return parts
          }

          function atLeast(actual, minimum) {
            for (let index = 0; index < actual.length; index += 1) {
              if (actual[index] > minimum[index]) return true
              if (actual[index] < minimum[index]) return false
            }
            return true
          }

          const postcssVersion = lock.packages?.['node_modules/postcss']?.version
          const postcss = parse(postcssVersion)
          if (!postcss || postcss[0] !== 8 || !atLeast(postcss, [8, 5, 23])) {
            throw new Error(`Expected patched postcss 8.x >= 8.5.23, found ${postcssVersion ?? 'missing'}`)
          }

          const fastUriVersion = lock.packages?.['node_modules/fast-uri']?.version
          const fastUri = parse(fastUriVersion)
          if (!fastUri || fastUri[0] !== 3 || !atLeast(fastUri, [3, 1, 5])) {
            throw new Error(`Expected patched fast-uri 3.x >= 3.1.5, found ${fastUriVersion ?? 'missing'}`)
          }

          console.log(`Resolved patched postcss ${postcssVersion}`)
          console.log(`Resolved patched fast-uri ${fastUriVersion}`)
          NODE

      - name: Verify bounded lockfile change
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git diff --name-only)
          if [[ ${#changed_files[@]} -ne 1 || "${changed_files[0]}" != "webapp/package-lock.json" ]]; then
            printf 'Unexpected changed files:\n'
            printf '  %s\n' "${changed_files[@]}"
            exit 1
          fi
          npm --prefix webapp ci --ignore-scripts --no-audit --no-fund
          (
            cd webapp
            npm audit --json > "${RUNNER_TEMP}/npm-audit.json" || true
          )
          node - <<'NODE'
          const report = require(`${process.env.RUNNER_TEMP}/npm-audit.json`)
          const finding = report.vulnerabilities?.['brace-expansion']
          if (finding) {
            console.log('Remaining brace-expansion audit finding:')
            console.log(JSON.stringify(finding, null, 2))
          }
          NODE
          npm --prefix webapp run audit:ci

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/package-lock.json
          git commit -m "Update vulnerable transitive dependencies"
          git push origin HEAD:phase1-ci-repair
