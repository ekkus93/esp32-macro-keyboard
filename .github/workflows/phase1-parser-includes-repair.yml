# One-shot include-cleaner repair helper; remove before final validation.
name: Phase 1 Parser Includes Repair

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          persist-credentials: false
          show-progress: false

      - name: Install formatter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Apply bounded include ownership repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("firmware/components/macro_parser/macro_parser_v2.c"): [
                  (
                      '#include "app_limits_v2.h"\n',
                      '#include "app_error.h"\n#include "app_limits_v2.h"\n',
                  ),
              ],
              Path("firmware/components/macro_parser/macro_parser.c"): [
                  ('#include "macro_limits.h"\n', ''),
              ],
              Path("firmware/components/macro_parser/macro_keymap_us_v2.c"): [
                  (
                      '#include <string.h>\n',
                      '#include <string.h>\n\n#include "macro_keymap_us.h"\n',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          clang-format -i \
            firmware/components/macro_parser/macro_parser_v2.c \
            firmware/components/macro_parser/macro_parser.c \
            firmware/components/macro_parser/macro_keymap_us_v2.c
          clang-format --dry-run --Werror \
            firmware/components/macro_parser/macro_parser_v2.c \
            firmware/components/macro_parser/macro_parser.c \
            firmware/components/macro_parser/macro_keymap_us_v2.c

      - name: Upload repaired parser sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-repaired-parser-includes-${{ github.run_id }}
          path: |
            firmware/components/macro_parser/macro_parser_v2.c
            firmware/components/macro_parser/macro_parser.c
            firmware/components/macro_parser/macro_keymap_us_v2.c
          if-no-files-found: error
          retention-days: 1
