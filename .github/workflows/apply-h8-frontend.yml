name: Apply staged H8 frontend hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-h8-frontend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify H8 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/staging/h8-files.tgz.b64.part00 \
              .github/staging/h8-files.tgz.b64.part01 \
              .github/staging/h8-files.tgz.b64.part02 \
              .github/staging/h8-files.tgz.b64.part03 \
              .github/staging/h8-files.tgz.b64.part04 > /tmp/h8-files.tgz.b64
          base64 --decode /tmp/h8-files.tgz.b64 > /tmp/h8-files.tgz
          echo "6b9d233d2fa718138d2b051ac6049b398a2576f147d05f085d52dc2534096bab  /tmp/h8-files.tgz" | sha256sum --check --strict
          tar -tzf /tmp/h8-files.tgz
          tar -xzf /tmp/h8-files.tgz
          git diff --check

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Lint
        working-directory: webapp
        run: npm run lint

      - name: Check formatting
        working-directory: webapp
        run: npm run format:check

      - name: Run H8 regression tests
        working-directory: webapp
        run: >-
          npx vitest run
          tests/v2-package-selection.test.ts
          tests/v2-repository-startup-screen.test.tsx
          tests/v2-package-management-page.test.tsx
          tests/v2-snapshots-page.test.tsx
          tests/v2-app-v2.test.tsx
          tests/v2-macros-page.test.tsx

      - name: Build production webapp
        working-directory: webapp
        run: npm run build

      - name: Commit validated H8 implementation
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "master moved from triggering SHA $GITHUB_SHA to $remote_sha; refusing to overwrite" >&2
            exit 1
          fi

          rm -f .github/staging/h8-files.tgz.b64.part00 \
                .github/staging/h8-files.tgz.b64.part01 \
                .github/staging/h8-files.tgz.b64.part02 \
                .github/staging/h8-files.tgz.b64.part03 \
                .github/staging/h8-files.tgz.b64.part04 \
                .github/workflows/apply-h8-frontend.yml

          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(webapp): surface persistence and export failures"
          git push origin HEAD:master
