name: Phase 16 quality status probe

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase16-status-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Query Quality runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?per_page=20" \
            --output /tmp/runs.json
          jq --arg sha "f99cb41c34acaf1bc408dd9b1a66dc9ba9d8aec1" \
            '{runs: [.workflow_runs[] | select(.head_sha == $sha) | {id, head_sha, status, conclusion, html_url}]}' \
            /tmp/runs.json > /tmp/filtered.json
          {
            echo "# Phase 16 formatted Quality status"
            echo
            echo '```json'
            cat /tmp/filtered.json
            echo '```'
          } > docs/CI_PHASE16_FOUNDATION_STATUS.md
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_PHASE16_FOUNDATION_STATUS.md
          git commit -m "ci: record formatted Phase 16 quality status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
