name: Close H10-100 evidence

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/close-h10-100.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3

      - name: Record authoritative H10-100 closure
        shell: bash
        env:
          VALIDATED_SHA: 910a8fd461fc8f9079cc99ffa450c1c4f76589eb
          EDIT_SCRIPT_B64: ""
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "${VALIDATED_SHA}"
          git diff --quiet "${VALIDATED_SHA}" HEAD -- . ':(exclude).github/workflows/close-h10-100.yml'

          printf '%s' "${EDIT_SCRIPT_B64}" | base64 -d | python3

          git diff --check
          grep -A12 '^### H10-100' docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md
          grep -q '^## H10-100 final disposition' docs/implementation-v2/H10_100_NATIVE_CONTRACT_VALIDATION_2026-08-12.md
          grep -q '^## Final authoritative result' docs/implementation-v2/H10_100_AUTHORITATIVE_REVALIDATION_2026-08-12.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md docs/implementation-v2/H10_100_NATIVE_CONTRACT_VALIDATION_2026-08-12.md docs/implementation-v2/H10_100_AUTHORITATIVE_REVALIDATION_2026-08-12.md
          git rm .github/workflows/close-h10-100.yml

          printf '%s\n' '.github/workflows/close-h10-100.yml' 'docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md' 'docs/implementation-v2/H10_100_AUTHORITATIVE_REVALIDATION_2026-08-12.md' 'docs/implementation-v2/H10_100_NATIVE_CONTRACT_VALIDATION_2026-08-12.md' | sort > "${RUNNER_TEMP}/expected-files"
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual-files"
          cmp "${RUNNER_TEMP}/expected-files" "${RUNNER_TEMP}/actual-files"

          git commit -m "docs: close H10-100 native validation"
          git push origin HEAD:master
