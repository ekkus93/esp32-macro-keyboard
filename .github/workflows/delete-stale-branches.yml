name: Delete Stale Branches

on:
  push:
    branches:
      - master
    paths:
      - .github/delete-stale-branches-trigger.txt

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 1

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete \
            agent/code-review-fixes-readable \
            agent/phase16-live-status
