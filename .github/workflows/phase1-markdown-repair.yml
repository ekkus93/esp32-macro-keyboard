# One-shot Markdown repair helper; remove before final validation.
name: Phase 1 Markdown Repair

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          persist-credentials: false
          show-progress: false

      - name: Apply bounded Markdown repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          spec_path = Path("docs/SPEC_V2.md")
          spec = spec_path.read_text(encoding="utf-8")
          spec_path.write_text(spec.rstrip("\n") + "\n", encoding="utf-8")

          todo_path = Path("docs/TODO_V2.md")
          lines = todo_path.read_text(encoding="utf-8").splitlines()
          changed = 0
          repaired = []
          for line in lines:
              if line.startswith("# Phase ") or line == "# Final sign-off checklist":
                  line = "#" + line
                  changed += 1
              repaired.append(line)
          if changed != 17:
              raise SystemExit(f"expected 17 phase/sign-off H1 headings, found {changed}")
          todo_path.write_text("\n".join(repaired).rstrip("\n") + "\n", encoding="utf-8")
          PY

      - name: Verify Markdown lint
        shell: bash
        run: |
          set -euo pipefail
          npm install --global markdownlint-cli2@0.23.2
          markdownlint-cli2 docs/SPEC_V2.md docs/TODO_V2.md

      - name: Upload repaired Markdown
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-repaired-markdown-${{ github.run_id }}
          path: |
            docs/SPEC_V2.md
            docs/TODO_V2.md
          if-no-files-found: error
          retention-days: 1
