name: Phase 15 status probe

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase15-status-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Query Phase 15 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs
          for workflow in patch-phase15-generator-once.yml complete-phase15-once.yml; do
            curl --fail --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=5" \
              --output "/tmp/${workflow}.json"
          done
          {
            echo "# Phase 15 run status"
            echo
            echo '```json'
            jq -s '{patch: [.[0].workflow_runs[] | {id, head_sha, status, conclusion, html_url}], completion: [.[1].workflow_runs[] | {id, head_sha, status, conclusion, html_url}]}' \
              /tmp/patch-phase15-generator-once.yml.json \
              /tmp/complete-phase15-once.yml.json
            echo '```'
          } > docs/CI_PHASE15_RUN_STATUS.md
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_PHASE15_RUN_STATUS.md
          git commit -m "ci: update Phase 15 run status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
