name: V2 Settings CMake Formatter Materializer

on:
  push:
    paths:
      - .github/workflows/v2-settings-cmake-format-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Format and verify host CMake
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libcjson-dev
          python3 -m pip install --user cmakelang==0.6.13
          export PATH="$HOME/.local/bin:$PATH"
          cmake-format -i tests/host/CMakeLists.txt
          cmake-format --check tests/host/CMakeLists.txt
          cmake-lint tests/host/CMakeLists.txt
          python3 scripts/check-v2-device-settings-policy.py
          ./scripts/run-tests.sh
          git diff --check

      - name: Commit formatted CMake and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-settings-cmake-format-materialize.yml
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add tests/host/CMakeLists.txt .github/workflows/v2-settings-cmake-format-materialize.yml
          git diff --cached --check
          git commit -m "Format V2 settings host target CMake"
          git push origin HEAD:master
