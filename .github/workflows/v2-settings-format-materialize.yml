name: V2 Settings Formatter Materializer

on:
  push:
    paths:
      - .github/workflows/v2-settings-format-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Format and verify V2 settings sources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format build-essential cmake libcjson-dev
          clang-format -i \
            firmware/components/device_settings/device_settings.c \
            firmware/components/device_settings/device_settings_core.c \
            firmware/components/device_settings/device_settings_core.h \
            firmware/components/device_settings/include/device_settings.h \
            tests/host/test_device_settings_core.c
          clang-format --dry-run --Werror \
            firmware/components/device_settings/device_settings.c \
            firmware/components/device_settings/device_settings_core.c \
            firmware/components/device_settings/device_settings_core.h \
            firmware/components/device_settings/include/device_settings.h \
            tests/host/test_device_settings_core.c
          python3 scripts/check-v2-device-settings-policy.py
          ./scripts/run-tests.sh
          git diff --check

      - name: Commit formatted sources and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-settings-format-materialize.yml
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            firmware/components/device_settings/device_settings.c \
            firmware/components/device_settings/device_settings_core.c \
            firmware/components/device_settings/device_settings_core.h \
            firmware/components/device_settings/include/device_settings.h \
            tests/host/test_device_settings_core.c \
            .github/workflows/v2-settings-format-materialize.yml
          git diff --cached --check
          git commit -m "Format V2 settings persistence sources"
          git push origin HEAD:master
