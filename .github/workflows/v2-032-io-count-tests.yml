name: V2-032 Impossible IO Count Tests

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  add-tests:
    if: github.event.head_commit.message == 'Add one-shot V2-032 IO count tests'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Add hostile callback regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/host/test_storage_atomic.c")
          text = path.read_text(encoding="utf-8")

          marker = (
              "static ssize_t adapter_write(void *context, int descriptor, const void *buffer, size_t length) {\n"
              "    return fake_fs_write(context, descriptor, buffer, length);\n"
              "}\n"
          )
          addition = marker + (
              "\n"
              "static ssize_t overreport_read(void *context, int descriptor, void *buffer,\n"
              "                               size_t length) {\n"
              "    (void)context;\n"
              "    (void)descriptor;\n"
              "    (void)buffer;\n"
              "    (void)length;\n"
              "    return 2;\n"
              "}\n"
              "\n"
              "static ssize_t overreport_write(void *context, int descriptor, const void *buffer,\n"
              "                                size_t length) {\n"
              "    (void)context;\n"
              "    (void)descriptor;\n"
              "    (void)buffer;\n"
              "    (void)length;\n"
              "    return 2;\n"
              "}\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("adapter insertion point did not match exactly once")
          text = text.replace(marker, addition)

          marker = "/* SPEC 24.2 item: interruption between writing `.tmp` and `rename()` */\n"
          test = (
              "static void test_impossible_io_counts_are_rejected(void) {\n"
              "    test_temp_dir_t directory = {0};\n"
              "    test_temp_dir_create(&directory);\n"
              "    char path[APP_PATH_MAX_BYTES];\n"
              "    make_path(path, sizeof(path), &directory, \"object.bin\");\n"
              "    static const char data[] = \"x\";\n"
              "\n"
              "    fake_fs_backend_t filesystem;\n"
              "    fake_fs_backend_reset(&filesystem);\n"
              "    storage_fs_ops_t operations = make_operations(&filesystem);\n"
              "    operations.write_file = overreport_write;\n"
              "    TEST_CHECK_EQ_INT(APP_ERROR_IO, storage_atomic_write_with_ops(\n"
              "                                            path, data, sizeof(data) - 1U, true,\n"
              "                                            &operations));\n"
              "    TEST_CHECK(access(path, F_OK) != 0);\n"
              "    assert_no_temporary_files(&directory);\n"
              "\n"
              "    fake_fs_backend_reset(&filesystem);\n"
              "    operations = make_operations(&filesystem);\n"
              "    operations.read_file = overreport_read;\n"
              "    TEST_CHECK_EQ_INT(APP_ERROR_IO, storage_atomic_write_with_ops(\n"
              "                                            path, data, sizeof(data) - 1U, true,\n"
              "                                            &operations));\n"
              "    TEST_CHECK(access(path, F_OK) != 0);\n"
              "    assert_no_temporary_files(&directory);\n"
              "    test_temp_dir_remove(&directory);\n"
              "}\n"
              "\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("test insertion point did not match exactly once")
          text = text.replace(marker, test + marker)

          marker = (
              "    test_short_io_is_completed();\n"
              "    test_failures_preserve_destination();\n"
          )
          replacement = (
              "    test_short_io_is_completed();\n"
              "    test_impossible_io_counts_are_rejected();\n"
              "    test_failures_preserve_destination();\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("test call insertion point did not match exactly once")
          path.write_text(text.replace(marker, replacement), encoding="utf-8")
          PY
          clang-format -i \
            firmware/components/storage/storage_blob_access_core.c \
            firmware/components/storage/storage_atomic.c \
            tests/host/test_storage_blob_access.c \
            tests/host/test_storage_atomic.c
          rm .github/workflows/v2-032-io-count-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/storage/storage_blob_access_core.c \
              firmware/components/storage/storage_atomic.c \
              tests/host/test_storage_blob_access.c \
              tests/host/test_storage_atomic.c \
              .github/workflows/v2-032-io-count-tests.yml
          git diff --cached --check
          git commit -m "Test V2-032 impossible filesystem counts"
          git push origin HEAD:master
