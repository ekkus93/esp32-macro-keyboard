name: V2-034 Implementation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-034-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libcjson-dev clang-format
          python3 -m pip install --user littlefs-python==0.15.0

      - name: Apply V2-034 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one target in {path_text}")
              path.write_text(text.replace(old, new))

          replace_once(
              "firmware/components/web_server/web_api_core.c",
              '''    case APP_ERROR_MACRO_LIMIT:
                  return WEB_HTTP_STATUS_UNPROCESSABLE_ENTITY;
              case APP_ERROR_NOT_FOUND:''',
              '''    case APP_ERROR_MACRO_LIMIT:
                  return WEB_HTTP_STATUS_UNPROCESSABLE_ENTITY;
              case APP_ERROR_LIMIT:
                  return WEB_HTTP_STATUS_PAYLOAD_TOO_LARGE;
              case APP_ERROR_NOT_FOUND:''',
          )
          replace_once(
              "tests/host/test_web_api_core.c",
              '''    TEST_CHECK_EQ_U64(422U, web_api_http_status_for_error(APP_ERROR_MACRO_LIMIT));
              TEST_CHECK_EQ_U64(404U, web_api_http_status_for_error(APP_ERROR_NOT_FOUND));''',
              '''    TEST_CHECK_EQ_U64(422U, web_api_http_status_for_error(APP_ERROR_MACRO_LIMIT));
              TEST_CHECK_EQ_U64(413U, web_api_http_status_for_error(APP_ERROR_LIMIT));
              TEST_CHECK_EQ_U64(404U, web_api_http_status_for_error(APP_ERROR_NOT_FOUND));''',
          )
          replace_once(
              "scripts/check-all.sh",
              '''./scripts/check-partitions.sh
          bash ./scripts/check-production-config.sh''',
              '''./scripts/check-partitions.sh
          python3 ./scripts/check-v2-034-capacity.py
          bash ./scripts/check-production-config.sh''',
          )
          replace_once(
              "scripts/check-v2-034-capacity.py",
              '''    if "#define APP_V2_BLOB_MAX_BYTES (128u * 1024u)" not in app_limits_text:''',
              '''    if "#define APP_V2_BLOB_MAX_BYTES UINT32_C(131072)" not in app_limits_text:''',
          )
          PY
          clang-format -i \
            firmware/components/web_server/web_api_core.c \
            tests/host/test_web_api_core.c
          chmod +x scripts/check-v2-034-capacity.py

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ./scripts/check-v2-034-capacity.py
          python3 ./scripts/check-v2-034-capacity.py
          ./scripts/run-tests.sh

      - name: Verify scope and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-034-capacity-probe.yml
          rm .github/workflows/v2-034-implement.yml
          git diff --check
          expected_paths="$(printf '%s\n' \
            .github/workflows/v2-034-capacity-probe.yml \
            .github/workflows/v2-034-implement.yml \
            firmware/components/web_server/web_api_core.c \
            scripts/check-all.sh \
            scripts/check-v2-034-capacity.py \
            tests/host/test_web_api_core.c | sort)"
          test "$(git diff --name-only | sort)" = "${expected_paths}"
          git status --short

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Implement V2-034 capacity and blob limits"
          git push origin HEAD:master
