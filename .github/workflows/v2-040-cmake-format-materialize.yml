name: V2-040 CMake Format Materializer

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v2-040-cmake-format-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pinned CMake formatter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user cmakelang==0.6.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format V2-040 native contract CMake file
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/cmake-format" -i tests/v2_contracts/CMakeLists.txt
          "$HOME/.local/bin/cmake-format" --check tests/v2_contracts/CMakeLists.txt
          "$HOME/.local/bin/cmake-lint" tests/v2_contracts/CMakeLists.txt
          git diff --check

      - name: Validate native V2 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-v2-contracts.sh --native-only

      - name: Commit CMake formatter repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v2_contracts/CMakeLists.txt
          git rm .github/workflows/v2-040-cmake-format-materialize.yml
          expected=$(printf '%s\n' \
            '.github/workflows/v2-040-cmake-format-materialize.yml' \
            'tests/v2_contracts/CMakeLists.txt')
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git commit -m "Format V2-040 contract CMake"
          git push origin HEAD:master
