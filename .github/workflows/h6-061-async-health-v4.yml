name: H6-061 Async HTTP Health Validator v4

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/h6-061-async-health-v4.yml"

permissions:
  contents: write

jobs:
  apply-validate-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host-test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang-format \
            cmake \
            libcjson-dev

      - name: Apply H6-061 hardening from reviewed v3 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          # v3's only application failure was its matcher accidentally dedenting
          # these two already-indented baseline lines. Normalize only those lines
          # before executing the otherwise-reviewed patch; clang-format restores
          # normal C indentation afterward.
          test_path = Path("tests/host/test_web_server_async_confirmation.c")
          text = test_path.read_text()
          old = ('    TEST_CHECK_EQ_STRING("200 OK", fake.response_status);\n'
                 '    TEST_CHECK_EQ_U64(0U, (uint64_t)g_wait_for_confirmation_calls);')
          new = ('TEST_CHECK_EQ_STRING("200 OK", fake.response_status);\n'
                 'TEST_CHECK_EQ_U64(0U, (uint64_t)g_wait_for_confirmation_calls);')
          if text.count(old) != 1:
              raise SystemExit("expected one non-confirmation assertion block")
          test_path.write_text(text.replace(old, new, 1))

          workflow = Path(".github/workflows/h6-061-async-health-v3.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          clang-format -i"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit("v3 apply script start marker missing")
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit("v3 apply script end marker missing")
          script = dedent(workflow[start:end])
          exec(compile(script, "h6-061-v3-apply.py", "exec"), {"__name__": "__main__"})
          PY

          clang-format -i \
            firmware/components/web_server/include/http_health.h \
            firmware/components/web_server/http_health.c \
            firmware/components/web_server/web_server_async.c \
            tests/host/test_http_health.c \
            tests/host/test_web_server_async_confirmation.c \
            tests/host/test_web_server_administration_route.c
          git diff --check

      - name: Run web host tests
        run: ./scripts/run-tests.sh web

      - name: Run web host tests with ASan and UBSan
        run: ./scripts/run-tests.sh --sanitizers web

      - name: Commit validated H6-061 product change
        shell: bash
        run: |
          set -euo pipefail
          git add \
            firmware/components/web_server/include/http_health.h \
            firmware/components/web_server/http_health.c \
            firmware/components/web_server/web_server_async.c \
            tests/host/test_http_health.c \
            tests/host/test_web_server_async_confirmation.c \
            tests/host/test_web_server_administration_route.c
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(web): track async HTTP health failures"
          git rev-parse HEAD > "$RUNNER_TEMP/h6-061-product-sha"

      - name: Record H6-061 evidence and ledger
        shell: bash
        run: |
          set -euo pipefail
          product_sha="$(cat "$RUNNER_TEMP/h6-061-product-sha")"
          cat > docs/implementation-v2/H6_061_ASYNC_HTTP_HEALTH_2026-08-11.md <<EOF
          # H6-061 — Async HTTP subsystem health evidence

          **Date:** 2026-08-11  
          **Task:** \`H6-061 — Track async subsystem health\`  
          **Implementation SHA:** \`${product_sha}\`

          ## Implemented health model

          The existing \`http_health\` subsystem records sanitized async failure metadata without changing the frozen v2 diagnostics schema. Internal snapshots retain a first-failure stage plus an \`app_error_code_t\` for worker start, worker run, worker stop, queue, and async request completion failures.

          Raw ESP-IDF/FreeRTOS return values are not exposed. The first async failure wins, so later completion or shutdown fallout cannot erase the earlier actionable cause. Production uses a FreeRTOS critical section around health state; host builds use a real pthread mutex so concurrent host tests exercise exclusion rather than a no-op fake.

          ## Production instrumentation

          \`web_server_async.c\` records health for worker start/create failures, worker-unavailable dispatch, queue receive/send failures, request allocation and async-handler-begin failures, handler/send failure, async-request completion failure, inconsistent or timed-out worker stop, and stop-signal failure.

          The H6-060 worker-unavailable path remains fail-closed with HTTP 503; health recording does not restore any synchronous fallback.

          ## Diagnostics contract decision

          The authoritative diagnostics contract fixes eight subsystem entries and forbids response fields outside the checked-in contract. H6-061 therefore does not add a ninth subsystem or raw failure-detail fields. An async failure degrades the existing \`http\` subsystem entry to \`failed\`. A route regression verifies the response still contains exactly eight entries and the existing \`http\` entry changes to \`failed\`.

          Detailed first-failure stage/error metadata remains internal in \`http_health_snapshot()\` for diagnostics logic, tests, and future contract-approved use.

          ## Regression coverage

          \`test_http_health.c\` verifies healthy defaults, sanitized stage/error capture, first-failure-wins behavior, invalid-pair no-op behavior, and a pthread stress test proving concurrent snapshots never observe a torn stage/error pair.

          \`test_web_server_async_confirmation.c\` verifies worker-unavailable confirmation requests record a worker-start health failure while preserving H6-060's 503/no-handler/no-confirmation-wait behavior; a non-confirmation settings request records no async fault.

          \`test_web_server_administration_route.c\` verifies an internal async-completion failure is surfaced through only the existing diagnostics \`http\` subsystem state while retaining the eight-entry contract.

          ## Validation

          Targeted workflow run **${GITHUB_RUN_ID}** ran \`./scripts/run-tests.sh web\` with **28/28 passed** and \`./scripts/run-tests.sh --sanitizers web\` with **28/28 passed under ASan + UBSan**. The validator also ran clang-format on changed C/header files and \`git diff --check\` before committing.

          ## Scope intentionally left open

          H6-062 and the remaining H6-063 failure-injection cases are not closed here. H6-061 necessarily begins observing handler/completion/stop-signal results so they can be health-tracked, but H6-062 still requires cleanup-safety proof and H6-063 still requires worker-capable queue/handler/completion/pending-stop/concurrency injections.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md")
          text = path.read_text()
          old = '''### H6-061 — Track async subsystem health

          - [ ] Add sanitized health state for worker start/run/stop/queue/completion failures.
          - [ ] Keep the first/most useful failure visible.
          - [ ] Expose through existing diagnostics only if consistent with the authoritative diagnostics contract; otherwise keep internal/log evidence and flag required contract change.
          '''.replace("          ", "")
          product_sha = Path(os.environ["RUNNER_TEMP"]).joinpath("h6-061-product-sha").read_text().strip()
          run_id = os.environ["GITHUB_RUN_ID"]
          new = f'''### H6-061 — Track async subsystem health

          - [x] Add sanitized health state for worker start/run/stop/queue/completion failures.
          - [x] Keep the first/most useful failure visible.
          - [x] Expose through existing diagnostics only if consistent with the authoritative diagnostics contract; otherwise keep internal/log evidence and flag required contract change.
          - Evidence: implementation commit `{product_sha}` adds synchronized first-failure async HTTP health metadata for worker start/run/stop, queue, and completion failures. The frozen diagnostics schema remains unchanged: async failure degrades the existing `http` subsystem entry rather than adding fields/subsystems. `./scripts/run-tests.sh web` passed 28/28 and `./scripts/run-tests.sh --sanitizers web` passed 28/28 in targeted run `{run_id}`. Full evidence: `docs/implementation-v2/H6_061_ASYNC_HTTP_HEALTH_2026-08-11.md`.
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("expected exactly one H6-061 ledger block")
          path.write_text(text.replace(old, new, 1))
          PY

          git add \
            docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md \
            docs/implementation-v2/H6_061_ASYNC_HTTP_HEALTH_2026-08-11.md
          git diff --cached --check
          git commit -m "docs: record H6-061 async health evidence"
          git push origin HEAD:master
