---
name: Phase 15.2 Quality Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install host lint tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install --yes \
            clang-format clang-tidy jq libcjson-dev shellcheck >/dev/null
          python3 -m pip install --user \
            cmakelang==0.6.13 yamllint==1.38.0 gcovr==8.6 >/dev/null
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        run: npm ci --prefix webapp --silent

      - name: Verify toolchain
        run: ./scripts/verify-toolchain.sh

      - name: Check formatting
        run: ./scripts/check-format.sh

      - name: Check static-analysis policy
        run: ./scripts/check-static-analysis-policy.sh

      - name: Check partitions
        run: ./scripts/check-partitions.sh

      - name: Check production configuration
        run: bash ./scripts/check-production-config.sh

      - name: Check credential logging
        run: bash ./scripts/check-credential-logging.sh

      - name: Check firmware
        shell: bash
        run: |
          source "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-firmware.sh

      - name: Check web application
        run: ./scripts/check-webapp.sh

      - name: Check scripts
        run: ./scripts/check-scripts.sh

      - name: Check documentation
        run: ./scripts/check-docs.sh

      - name: Run host tests
        run: ./scripts/run-tests.sh
