# One-shot formatter helper; remove before final validation.
name: Phase 1 Clang Format

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          persist-credentials: false
          show-progress: false

      - name: Install formatter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Format repaired source
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i firmware/components/web_server/web_server_adapter_json.c
          clang-format --dry-run --Werror firmware/components/web_server/web_server_adapter_json.c

      - name: Upload formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-formatted-web-adapter-${{ github.run_id }}
          path: firmware/components/web_server/web_server_adapter_json.c
          if-no-files-found: error
          retention-days: 1
