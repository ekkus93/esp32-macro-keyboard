name: Inspect Phase 15 status once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-phase15-status-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Query Phase 15 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/complete-phase15-once.yml/runs?per_page=5" \
            --output /tmp/runs.json
          mkdir -p docs
          {
            echo "# Phase 15 workflow status"
            echo
            echo '```json'
            jq '{workflow_runs: [.workflow_runs[] | {id, head_sha, status, conclusion, run_started_at, updated_at, html_url}]}' /tmp/runs.json
            echo '```'
          } > docs/CI_PHASE15_STATUS.md
      - name: Publish status and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-phase15-status-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: capture Phase 15 workflow status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
