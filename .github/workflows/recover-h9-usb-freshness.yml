name: Recover USB status freshness hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/recover-h9-usb-freshness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Reuse verified USB patch and remove redundant condition
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /cat > \/tmp\/usb-patch\.b64 <<'"'"'PAYLOAD'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PAYLOAD$/ { exit }
            capture { sub(/^[[:space:]]+/, ""); print }
          ' .github/workflows/apply-h9-usb-freshness.yml > /tmp/usb-patch.b64
          base64 --decode /tmp/usb-patch.b64 | gzip --decompress > /tmp/usb-patch.sh
          echo "98acd3c7237c8658b7ae914b65aadbb820792334b417e535f8e66f92d3cbea3f  /tmp/usb-patch.sh" | sha256sum --check --strict
          bash /tmp/usb-patch.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("webapp/src/features/shell/v2/useDeviceStatus.ts")
          text = path.read_text()
          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)if \(active\) \{\n"
              r"[ \t]+schedulePoll\(\);\n(?P=indent)\}"
          )
          text, count = pattern.subn(
              lambda match: f"{match.group('indent')}schedulePoll();",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"expected one redundant active check, found {count}")
          path.write_text(text)
          PY
          git diff --check

      - name: Format changed frontend files
        working-directory: webapp
        run: >-
          npx prettier --write
          src/features/shell/v2/useDeviceStatus.ts
          src/AppV2.tsx
          tests/v2-use-device-status.test.tsx
          tests/v2-app-v2.test.tsx

      - name: Typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Lint
        working-directory: webapp
        run: npm run lint

      - name: Check formatting
        working-directory: webapp
        run: npm run format:check

      - name: Run focused USB freshness regressions
        working-directory: webapp
        run: >-
          npx vitest run
          tests/v2-use-device-status.test.tsx
          tests/v2-app-v2.test.tsx
          tests/v2-macros-page.test.tsx
          tests/v2-macro-preview-page.test.tsx

      - name: Build production webapp
        working-directory: webapp
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "master moved from triggering SHA $GITHUB_SHA to $remote_sha; refusing to overwrite" >&2
            exit 1
          fi
          rm -f .github/workflows/apply-h9-usb-freshness.yml \
                .github/workflows/recover-h9-usb-freshness.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(webapp): expose stale USB status"
          git push origin HEAD:master
