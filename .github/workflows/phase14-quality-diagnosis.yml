name: Phase 14 quality diagnosis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm ci --prefix webapp
      - name: Validate C formatting
        run: |
          mapfile -t c_files < <(find firmware/main firmware/components firmware/test_app/main \
            -type f \( -name '*.c' -o -name '*.h' \) -print | sort)
          clang-format --dry-run --Werror "${c_files[@]}"
      - name: Validate CMake formatting
        if: always()
        run: |
          mapfile -t cmake_files < <(find firmware tests \
            -type d \( -name managed_components -o -name 'build*' \) -prune -o \
            -type f -name 'CMakeLists.txt' -print | sort)
          cmake-format --check "${cmake_files[@]}"
          cmake-lint "${cmake_files[@]}"
      - name: Validate shell formatting
        if: always()
        run: shfmt -d scripts/*.sh
      - name: Validate frontend formatting
        if: always()
        working-directory: webapp
        run: npm run format:check
      - name: Validate static-analysis policy
        if: always()
        run: ./scripts/check-static-analysis-policy.sh
      - name: Validate scripts
        if: always()
        run: ./scripts/check-scripts.sh
      - name: Validate documentation
        if: always()
        run: ./scripts/check-docs.sh
