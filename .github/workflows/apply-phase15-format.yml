---
name: Apply Phase 15 repository formatting

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          clean: true

      - name: Install formatting and test tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install --yes clang-format libcjson-dev >/dev/null
          python3 -m pip install --user cmakelang==0.6.13 >/dev/null
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Format all Phase 15 storage sources
        shell: bash
        run: |
          mapfile -t storage_c < <(
            find firmware/components/storage \
              -type f \( -name '*.c' -o -name '*.h' \) -print \
              | sort
          )
          clang-format -i "${storage_c[@]}"
          cmake-format -i \
            firmware/components/storage/CMakeLists.txt \
            tests/host/CMakeLists.txt \
            tests/host/cmake/extra_tests.cmake
          clang-format --dry-run --Werror "${storage_c[@]}"
          cmake-format --check \
            firmware/components/storage/CMakeLists.txt \
            tests/host/CMakeLists.txt \
            tests/host/cmake/extra_tests.cmake
          git diff --check

      - name: Run storage tests
        run: |
          ./scripts/run-tests.sh storage
          ./scripts/run-tests.sh --sanitizers storage

      - name: Commit formatting repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/storage \
            tests/host/CMakeLists.txt \
            tests/host/cmake/extra_tests.cmake
          git commit -m "fix(storage): format Phase 15 repository sources"
          git push origin HEAD:master
