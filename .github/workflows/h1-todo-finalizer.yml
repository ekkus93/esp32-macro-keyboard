name: H1 checklist finalizer

on:
  push:
    paths:
      - .github/workflows/h1-todo-finalizer.yml

permissions:
  contents: write

concurrency:
  group: h1-todo-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hash-verified H1 checklist patch
        shell: bash
        run: |
          set -euo pipefail
          todo='docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md'
          patch='.github/h1-todo-finalizer.patch'
          workflow='.github/workflows/h1-todo-finalizer.yml'

          test "$(git hash-object "${todo}")" = '41379431218490b5518599b4e81b293d5aace89b'
          printf '%s  %s\n' \
            'e6dfbb6eff97ef9234b84e9fa81bb80c9b332cdb9e963f31fbe459268517b694' \
            "${patch}" | sha256sum -c -
          git apply --check "${patch}"
          git apply "${patch}"
          test "$(git hash-object "${todo}")" = 'a2c4eafb96f88572e0b2680eca825f01bba23d36'

          rm -f -- "${patch}" "${workflow}"
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reconcile H1 software evidence'
          git push origin HEAD:master
