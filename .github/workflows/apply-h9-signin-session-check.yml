name: Apply Sign In session-check visibility hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-h9-signin-session-check.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Make session-check failures explicit and retryable
        shell: bash
        run: |
          set -euo pipefail
          cat > webapp/src/features/auth/v2/SignInPage.tsx <<'TSX'
          import { useCallback, useEffect, useRef, useState } from "react";
          import {
            V2ApiError,
            v2GetJson,
            v2PostJson,
          } from "../../../v2/apiClient";
          import { isSessionStatus } from "../../../v2/apiGuards";
          import { isLoginRequest } from "../../../v2/apiRequestGuards";
          import type { SessionStatus } from "../../../v2/apiTypes";
          import { ErrorBanner } from "../../../components/ErrorBanner";
          import { v2ErrorText } from "./v2ErrorText";

          export interface SignInPageProps {
            /**
             * Called once with the sanitized session object after a successful
             * `POST /api/v1/auth/login`, or after this component discovers on mount
             * that the tab already holds a valid session. The caller owns what
             * "repository startup" means (UI_UX_SPEC_V2 §3.4) — this component's job
             * ends at the moment authentication is established.
             */
            onAuthenticated: (session: SessionStatus) => void;
          }

          type Phase = "checking" | "form" | "check-error";

          /**
           * V2-081 — Sign In (UI_UX_SPEC_V2 §3.2).
           *
           * A 401 from the initial session probe is the expected unauthenticated
           * state and opens the password form. Every other probe failure is a
           * connectivity/protocol/server failure, so it remains visible with Retry
           * rather than being silently reclassified as "no session".
           */
          export function SignInPage({
            onAuthenticated,
          }: SignInPageProps): React.JSX.Element {
            const [phase, setPhase] = useState<Phase>("checking");
            const [sessionCheckError, setSessionCheckError] = useState<string | null>(
              null,
            );
            const [adminPassword, setAdminPassword] = useState("");
            const [submitting, setSubmitting] = useState(false);
            const [error, setError] = useState<string | null>(null);

            const onAuthenticatedRef = useRef(onAuthenticated);
            onAuthenticatedRef.current = onAuthenticated;
            const mountedRef = useRef(false);

            const checkExistingSession = useCallback(async (): Promise<void> => {
              setPhase("checking");
              setSessionCheckError(null);
              try {
                const session = await v2GetJson(
                  "/api/v1/auth/session",
                  isSessionStatus,
                  { notifyOnUnauthorized: false },
                );
                if (mountedRef.current) {
                  onAuthenticatedRef.current(session);
                }
              } catch (checkError: unknown) {
                if (!mountedRef.current) {
                  return;
                }
                if (checkError instanceof V2ApiError && checkError.status === 401) {
                  setPhase("form");
                  return;
                }
                setSessionCheckError(v2ErrorText(checkError));
                setPhase("check-error");
              }
            }, []);

            useEffect(() => {
              mountedRef.current = true;
              void checkExistingSession();
              return () => {
                mountedRef.current = false;
              };
            }, [checkExistingSession]);

            const submit = async (
              event: React.FormEvent<HTMLFormElement>,
            ): Promise<void> => {
              event.preventDefault();
              setSubmitting(true);
              setError(null);
              try {
                const session = await v2PostJson(
                  "/api/v1/auth/login",
                  { adminPassword },
                  isSessionStatus,
                  { notifyOnUnauthorized: false },
                );
                setAdminPassword("");
                onAuthenticated(session);
              } catch (loginError: unknown) {
                setError(v2ErrorText(loginError));
              } finally {
                setSubmitting(false);
              }
            };

            if (phase === "checking") {
              return (
                <main className="standalone" aria-busy="true">
                  <p role="status">Checking for an existing session…</p>
                </main>
              );
            }

            if (phase === "check-error") {
              return (
                <main className="standalone">
                  <section>
                    <h1>Unable to check session</h1>
                    <ErrorBanner message={sessionCheckError} />
                    <button
                      className="primary"
                      onClick={() => {
                        void checkExistingSession();
                      }}
                      type="button"
                    >
                      Retry
                    </button>
                  </section>
                </main>
              );
            }

            const requestValid = isLoginRequest({ adminPassword });

            return (
              <main className="standalone">
                <section>
                  <h1>Sign in</h1>
                  <form
                    className="form-stack"
                    onSubmit={(event: React.FormEvent<HTMLFormElement>) => {
                      void submit(event);
                    }}
                  >
                    <label htmlFor="admin-password">Administrator password</label>
                    <input
                      aria-invalid={error === null ? undefined : true}
                      autoComplete="current-password"
                      autoFocus
                      disabled={submitting}
                      id="admin-password"
                      onChange={(event: React.ChangeEvent<HTMLInputElement>) => {
                        setAdminPassword(event.target.value);
                      }}
                      required
                      type="password"
                      value={adminPassword}
                    />
                    <ErrorBanner message={error} />
                    <button
                      className="primary"
                      disabled={submitting || !requestValid}
                      type="submit"
                    >
                      {submitting ? "Signing in…" : "Sign in"}
                    </button>
                  </form>
                </section>
              </main>
            );
          }
          TSX

          python3 - <<'PY'
          from pathlib import Path

          path = Path("webapp/tests/v2-sign-in-page.test.tsx")
          text = path.read_text()
          old_import = "  buttonWithText,\n  flushReact,"
          new_import = "  buttonWithText,\n  click,\n  flushReact,"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected Sign In render-helper import layout")
          text = text.replace(old_import, new_import, 1)

          old_test = '''  test("falls back to the form when the session check fails unexpectedly", async () => {
            planSessionCheck(500, {
              error: { code: "internal_error", message: "Unexpected failure." },
            });
            const view = await render(
              <SignInPage
                onAuthenticated={() => {
                  /* not exercised in this test */
                }}
              />,
            );
            await flushReact();

            expect(document.body.textContent).toContain("Administrator password");
            await view.unmount();
          });'''
          new_test = '''  test("shows a retryable error when the session check fails unexpectedly", async () => {
            planSessionCheck(500, {
              error: { code: "internal_error", message: "Unexpected failure." },
            });
            const view = await render(
              <SignInPage
                onAuthenticated={() => {
                  /* not exercised in this test */
                }}
              />,
            );
            await flushReact();

            expect(requiredElement("[role='alert']", HTMLElement).textContent).toBe(
              "internal_error: Unexpected failure.",
            );
            expect(document.body.textContent).not.toContain("Administrator password");

            planUnauthenticatedSessionCheck();
            await click(buttonWithText("Retry"));
            await flushReact();
            expect(document.body.textContent).toContain("Administrator password");
            expect(document.body.textContent).not.toContain("Unexpected failure.");
            await view.unmount();
          });'''
          if text.count(old_test) != 1:
              raise SystemExit("unexpected Sign In failure-test layout")
          path.write_text(text.replace(old_test, new_test, 1))
          PY
          git diff --check

      - name: Format changed frontend files
        working-directory: webapp
        run: npx prettier --write src/features/auth/v2/SignInPage.tsx tests/v2-sign-in-page.test.tsx

      - name: Typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Lint
        working-directory: webapp
        run: npm run lint

      - name: Check formatting
        working-directory: webapp
        run: npm run format:check

      - name: Run focused Sign In regressions
        working-directory: webapp
        run: npx vitest run tests/v2-sign-in-page.test.tsx tests/v2-app-v2.test.tsx

      - name: Build production webapp
        working-directory: webapp
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "master moved from triggering SHA $GITHUB_SHA to $remote_sha; refusing to overwrite" >&2
            exit 1
          fi
          rm -f .github/workflows/apply-h9-signin-session-check.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(webapp): expose Sign In session-check failures"
          git push origin HEAD:master
