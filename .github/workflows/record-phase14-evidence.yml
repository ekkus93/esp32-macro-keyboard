name: Apply Phase 13 and 14 evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preserve evidence patch
        run: |
          base64 --decode docs/review-source/PHASE14_EVIDENCE.patch.b64 \
            >"${RUNNER_TEMP}/phase14-evidence.patch"
      - uses: actions/checkout@v4
        with:
          ref: master
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install documentation validation tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install --yes jq >/dev/null
          python3 -m pip install --user yamllint==1.38.0 >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm ci --prefix webapp --silent
      - name: Apply evidence patch
        run: |
          git apply --check "${RUNNER_TEMP}/phase14-evidence.patch"
          git apply "${RUNNER_TEMP}/phase14-evidence.patch"
          git diff --check
      - name: Validate documentation with concise diagnostics
        id: docs
        shell: bash
        run: |
          set +e
          ./scripts/check-docs.sh >"${RUNNER_TEMP}/docs-check.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/docs-check.log"
          exit "${status}"
      - name: Preserve documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-evidence-docs-check
          path: ${{ runner.temp }}/docs-check.log
          if-no-files-found: warn
          retention-days: 1
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md
          git commit -m "docs(fix1): record Phase 13 and 14 evidence"
          git push origin HEAD:master
