name: Quality

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-commit-review-files:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/code-review-fixes-readable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/code-review-fixes-readable
          fetch-depth: 0

      - name: Install formatter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format

      - name: Format and commit only reviewed C files
        shell: bash
        run: |
          set -euo pipefail
          readonly files=(
            firmware/components/storage/storage_atomic.c
            firmware/components/web_server/web_api_json.c
            firmware/components/web_server/web_api_procedures.c
            tests/host/test_storage_atomic.c
            tests/host/test_web_api_json.c
            tests/host/test_web_api_repository_handlers.c
          )
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
          unexpected="$(git diff --name-only | grep -Fvx -f <(printf '%s\n' "${files[@]}") || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Unexpected formatted paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            printf 'Reviewed C files already formatted.\n'
            exit 0
          fi
          staged="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "${staged}" | grep -Fvx -f <(printf '%s\n' "${files[@]}") || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format code-review C changes"
          git push origin HEAD:agent/code-review-fixes-readable

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install host lint tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Enforce reviewed npm audit policy
        working-directory: webapp
        run: npm run audit:ci

      - name: Run authoritative checks
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh
