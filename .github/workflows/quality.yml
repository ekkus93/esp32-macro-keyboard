name: Quality

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-review-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install formatter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format

      - name: Format changed C files
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i \
            firmware/components/storage/storage_atomic.c \
            firmware/components/web_server/web_api_json.c \
            firmware/components/web_server/web_api_procedures.c \
            tests/host/test_storage_atomic.c \
            tests/host/test_web_api_json.c \
            tests/host/test_web_api_repository_handlers.c
          clang-format --dry-run --Werror \
            firmware/components/storage/storage_atomic.c \
            firmware/components/web_server/web_api_json.c \
            firmware/components/web_server/web_api_procedures.c \
            tests/host/test_storage_atomic.c \
            tests/host/test_web_api_json.c \
            tests/host/test_web_api_repository_handlers.c

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatted-code-review-files
          path: |
            firmware/components/storage/storage_atomic.c
            firmware/components/web_server/web_api_json.c
            firmware/components/web_server/web_api_procedures.c
            tests/host/test_storage_atomic.c
            tests/host/test_web_api_json.c
            tests/host/test_web_api_repository_handlers.c
          if-no-files-found: error
          retention-days: 1

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install host lint tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Enforce reviewed npm audit policy
        working-directory: webapp
        run: npm run audit:ci

      - name: Run authoritative checks
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh
