name: Quality

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-storage-cleanup-signature:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/code-review-fixes-readable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/code-review-fixes-readable
          fetch-depth: 0

      - name: Apply exact typed-request change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/components/storage/storage_atomic.c")
          text = path.read_text(encoding="utf-8")
          old = '''static app_error_code_t close_preserving_error(const storage_fs_ops_t *operations, int descriptor,
                                                         app_error_code_t original_error) {
              if (operations->close_file(operations->context, descriptor) == 0) {
                  return original_error;
              }
              const app_error_code_t close_error = map_error_number(errno);
              return original_error == APP_ERROR_NONE ? close_error : original_error;
          }
          '''
          new = '''typedef struct {
              int descriptor;
              app_error_code_t original_error;
          } close_request_t;

          static app_error_code_t close_preserving_error(const storage_fs_ops_t *operations,
                                                         close_request_t request) {
              if (operations->close_file(operations->context, request.descriptor) == 0) {
                  return request.original_error;
              }
              const app_error_code_t close_error = map_error_number(errno);
              return request.original_error == APP_ERROR_NONE ? close_error : request.original_error;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("close helper anchor mismatch")
          text = text.replace(old, new, 1)
          text = text.replace(
              "close_preserving_error(operations, descriptor, APP_ERROR_NONE)",
              "close_preserving_error(\n                    operations, (close_request_t){.descriptor = descriptor,\n                                                  .original_error = APP_ERROR_NONE})",
              1,
          )
          text = text.replace(
              "close_preserving_error(operations, descriptor, result_for_stat)",
              "close_preserving_error(\n                    operations, (close_request_t){.descriptor = descriptor,\n                                                  .original_error = result_for_stat})",
              1,
          )
          if text.count("close_preserving_error(") != 3:
              raise SystemExit("unexpected close helper call count")
          path.write_text(text, encoding="utf-8")
          PY
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format
          clang-format -i firmware/components/storage/storage_atomic.c
          clang-format --dry-run --Werror firmware/components/storage/storage_atomic.c
          changed="$(git diff --name-only)"
          if [[ "${changed}" != "firmware/components/storage/storage_atomic.c" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed}" >&2
            exit 1
          fi
          git add firmware/components/storage/storage_atomic.c
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: type storage descriptor cleanup request"
          git push origin HEAD:agent/code-review-fixes-readable

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install host lint tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Enforce reviewed npm audit policy
        working-directory: webapp
        run: npm run audit:ci

      - name: Run authoritative checks
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh
