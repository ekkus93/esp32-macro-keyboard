name: Quality

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Enforce reviewed npm audit policy
        working-directory: webapp
        shell: bash
        env:
          QUALITY_LOG_PATH: ${{ runner.temp }}/quality-checks.log
        run: |
          set -euo pipefail
          : > "${QUALITY_LOG_PATH}"
          npm run audit:ci 2>&1 | tee -a "${QUALITY_LOG_PATH}"

      - name: Install host lint tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          export GOTOOLCHAIN=go1.25.12
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install V2-034 LittleFS dependency
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          python3 -m pip install littlefs-python==0.15.0
          python3 -c 'from importlib.metadata import version; assert version("littlefs-python") == "0.15.0"'

      - name: Run authoritative checks
        shell: bash
        env:
          QUALITY_LOG_PATH: ${{ runner.temp }}/quality-checks.log
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh 2>&1 | tee -a "${QUALITY_LOG_PATH}"

      - name: Upload failed quality log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-checks.log
          if-no-files-found: error
          retention-days: 14
