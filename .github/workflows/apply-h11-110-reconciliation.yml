name: Apply H11-110 reconciliation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-h11-110-reconciliation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply guarded H11-110 documentation reconciliation
        env:
          AUDIT_SHA: cc9e05727a2767f070dc79e9e699146e10509b34
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${AUDIT_SHA}" HEAD
          python3 - <<'PY'
          import subprocess
          audit = "cc9e05727a2767f070dc79e9e699146e10509b34"
          changed = sorted(subprocess.check_output(
              ["git", "diff", "--name-only", f"{audit}..HEAD"], text=True
          ).splitlines())
          expected = sorted([
              ".github/workflows/apply-h11-110-reconciliation.yml",
              ".github/h11-110-edit/part00.pyfrag",
          ])
          if changed != expected:
              raise SystemExit(f"unexpected pre-apply changes since audit SHA: {changed}")
          PY
          python3 .github/h11-110-edit/part00.pyfrag
          git diff --check
          bash scripts/check-docs.sh
          git rm \
            .github/workflows/apply-h11-110-reconciliation.yml \
            .github/h11-110-edit/part00.pyfrag
          git add \
            docs/TODO_V2.md \
            docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md \
            docs/implementation-v2/H11_110_V2_CHECKBOX_REAUDIT_2026-08-13.md
          python3 - <<'PY'
          import subprocess
          changed = sorted(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          expected = sorted([
              ".github/workflows/apply-h11-110-reconciliation.yml",
              ".github/h11-110-edit/part00.pyfrag",
              "docs/TODO_V2.md",
              "docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md",
              "docs/implementation-v2/H11_110_V2_CHECKBOX_REAUDIT_2026-08-13.md",
          ])
          if changed != expected:
              raise SystemExit(f"unexpected staged paths: {changed}")
          PY
          git diff --cached --check
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "docs: reconcile H11-110 v2 evidence"
          git push origin HEAD:master
