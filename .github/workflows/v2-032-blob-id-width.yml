name: V2-032 Blob ID Width Contract

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add one-shot V2-032 blob ID width fix'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Use the storage blob ID width contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/components/web_server/web_api_core.c")
          text = path.read_text(encoding="utf-8")

          include_marker = '#include "app_error.h"\n#include "web_http_status.h"\n'
          include_replacement = (
              '#include "app_error.h"\n'
              '#include "storage_blob.h"\n'
              '#include "web_http_status.h"\n'
          )
          if text.count(include_marker) != 1:
              raise SystemExit("include insertion point did not match exactly once")
          text = text.replace(include_marker, include_replacement)

          condition = "if (length == 0U || length > 20U || value[0] == '0') {"
          replacement = (
              "if (length == 0U || length > STORAGE_BLOB_ID_DIGITS || value[0] == '0') {"
          )
          if text.count(condition) != 1:
              raise SystemExit("blob ID length condition did not match exactly once")
          text = text.replace(condition, replacement)

          path.write_text(text, encoding="utf-8")
          PY
          clang-format -i firmware/components/web_server/web_api_core.c
          rm .github/workflows/v2-032-blob-id-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/web_server/web_api_core.c \
              .github/workflows/v2-032-blob-id-width.yml
          git diff --cached --check
          git commit -m "Use V2-032 blob ID width contract"
          git push origin HEAD:master
