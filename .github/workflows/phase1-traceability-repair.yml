# One-shot traceability generator; remove before final validation.
name: Phase 1 Traceability Repair

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          show-progress: false

      - name: Regenerate traceability evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-spec-traceability.py
          changed="$(git diff --name-only)"
          if [ "${changed}" != "docs/SPEC_TEST_TRACEABILITY.md" ]; then
            printf 'unexpected changed files:\n%s\n' "${changed}" >&2
            exit 1
          fi
          before="$(sha256sum docs/SPEC_TEST_TRACEABILITY.md)"
          python3 scripts/generate-spec-traceability.py
          after="$(sha256sum docs/SPEC_TEST_TRACEABILITY.md)"
          if [ "${before}" != "${after}" ]; then
            printf 'traceability generator is not deterministic\n' >&2
            exit 1
          fi

      - name: Verify generated Markdown
        shell: bash
        run: |
          set -euo pipefail
          npm install --global markdownlint-cli2@0.23.2
          markdownlint-cli2 docs/SPEC_TEST_TRACEABILITY.md

      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SPEC_TEST_TRACEABILITY.md
          git commit -m "docs: regenerate v2 specification traceability"
          git push origin HEAD:phase1-ci-repair
