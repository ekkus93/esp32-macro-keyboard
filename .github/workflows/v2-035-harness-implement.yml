name: V2-035 Hardware Evidence Harness

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-035-harness-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install scoped V2-035 harness files
        shell: bash
        env:
          V2_035_BUNDLE: 
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          printf '%s' "${V2_035_BUNDLE}" | base64 --decode > "${work}/bundle.tgz"
          tar -xzf "${work}/bundle.tgz" -C "${work}"
          install -m 0644 "${work}/scripts/run-v2-035-hardware.py" scripts/run-v2-035-hardware.py
          install -m 0644 "${work}/scripts/check-scripts.sh" scripts/check-scripts.sh
          install -m 0644 "${work}/tests/scripts/test-v2-035-hardware.py" tests/scripts/test-v2-035-hardware.py
          install -m 0644 \
            "${work}/docs/implementation-v2/V2_035_HARDWARE_EVIDENCE_HARNESS_2026-08-06.md" \
            docs/implementation-v2/V2_035_HARDWARE_EVIDENCE_HARNESS_2026-08-06.md

      - name: Validate scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/run-v2-035-hardware.py \
            tests/scripts/test-v2-035-hardware.py
          python3 tests/scripts/test-v2-035-hardware.py
          git diff --check

      - name: Verify scope and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-035-harness-implement.yml
          expected_paths="$(printf '%s\n' \
            .github/workflows/v2-035-harness-implement.yml \
            docs/implementation-v2/V2_035_HARDWARE_EVIDENCE_HARNESS_2026-08-06.md \
            scripts/check-scripts.sh \
            scripts/run-v2-035-hardware.py \
            tests/scripts/test-v2-035-hardware.py | sort)"
          test "$(git diff --name-only | sort)" = "${expected_paths}"

      - name: Commit V2-035 harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test(V2-035): add physical storage evidence harness"
          git push origin HEAD:master
