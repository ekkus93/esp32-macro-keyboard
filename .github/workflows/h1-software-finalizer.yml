name: H1 software finalizer

on:
  push:
    paths:
      - .github/workflows/h1-software-finalizer.yml

permissions:
  contents: write

concurrency:
  group: h1-software-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hash-verified H1 software patch
        shell: bash
        run: |
          set -euo pipefail

          staging_dir='.github/h1-finalizer'
          workflow_file='.github/workflows/h1-software-finalizer.yml'
          patch_file="${RUNNER_TEMP}/h1-software.patch"

          cat "${staging_dir}"/part-*.patch >"${patch_file}"
          printf '%s  %s\n' \
            'd6f5f0f1c70fbc8eaf31f70698e55dbcc2bc97e206f1b12dc52013d1043fbb6d' \
            "${patch_file}" | sha256sum -c -

          git apply --check "${patch_file}"
          git apply "${patch_file}"
          chmod 755 tests/hardware/test_send_confirmation.py

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "${path}")"
            if [[ "${actual}" != "${expected}" ]]; then
              printf 'blob mismatch: %s expected=%s actual=%s\n' "${path}" "${expected}" "${actual}" >&2
              exit 1
            fi
          }

          check_blob 2089efd0ba60f8fe2e345db1a9f99f6ca3ab2c4b firmware/components/serial_console/serial_console.c
          check_blob 00e9f234b6a40f75f934b30ee9dae760072c4ba6 firmware/components/serial_console/serial_console_confirmation.c
          check_blob b113ae4a39946ce94f5e1b65f0dcf8fd9640908a firmware/components/serial_console/serial_console_confirmation.h
          check_blob 99726ba82f3929d4344c5d8b7af55e7ef6a390d4 firmware/components/serial_console/CMakeLists.txt
          check_blob bd1c511c9b531be5e36d17698e12772dbd0f4bdc firmware/components/web_server/web_send.c
          check_blob e28cca927e77f778fd84228d2c7f4af88da26d57 firmware/components/web_server/web_send.h
          check_blob 8986b40114d0b909486bbc1af8568ef717c20c1b tests/host/test_serial_console_confirmation.c
          check_blob 1a8697cd5a7f167fb802be5cfa439d61b6391ee2 tests/host/CMakeLists.txt
          check_blob b2f4ee5f1c79c4c0726c0b894acf995745edda05 tests/host/test_web_send.c
          check_blob a0b98247afe679e7f2d12693138d2601d2d4c7fe tests/host/test_web_server_send_route.c
          check_blob 787997800f8ba7f0b4e04d03938d814db12e04be tests/host/executor_confirmation_tests.inc
          check_blob a17633c87eb1bea3b31dcf541792a0905a8c3026 webapp/src/features/macros/v2/MacrosPage.tsx
          check_blob 5c3dca8c88c4f44a21fbcd0bc7abb68590acaa9b webapp/tests/v2-macros-page.test.tsx
          check_blob c35e34ef0e6aeb825cd74a55a98e029c7f04fa46 webapp/tests/v2-send-client.test.ts
          check_blob c9ad26c53b08183d5281b3df492612203d030f89 webapp/tests/browser/run-browser-tests.mjs
          check_blob 18541c46e6dd5d3d8e49a54d5060c73ff78960e7 tests/hardware/test_send_confirmation.py
          check_blob c5c5b0c8e2ffc1416790a99c20ae8de0c836d5cc tests/hardware/README.md

          rm -rf -- "${staging_dir}"
          rm -f -- "${workflow_file}"

          git diff --check
          git add -A

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete H1 software confirmation path'
          git push origin HEAD:master
