name: V2-035 Hardware Harness Hardening

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-035-harness-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply scoped hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/v2-035-hardening-patch.py

      - name: Validate hardened collector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run-v2-035-hardware.py tests/scripts/test-v2-035-hardware.py
          python3 tests/scripts/test-v2-035-hardware.py
          python3 scripts/run-v2-035-hardware.py start --help | grep -F -- '--firmware-sha'
          git diff --check

      - name: Stage and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/v2-035-hardening-patch.py
          rm .github/workflows/v2-035-harness-hardening.yml
          git add --all
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/v2-035-hardening-patch.py \
            .github/workflows/v2-035-harness-hardening.yml \
            docs/implementation-v2/V2_035_HARDWARE_EVIDENCE_HARNESS_2026-08-06.md \
            scripts/run-v2-035-hardware.py \
            tests/scripts/test-v2-035-hardware.py | sort)"
          test "${actual}" = "${expected}"

      - name: Commit V2-035 harness hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(V2-035): harden physical evidence provenance"
          git push origin HEAD:master
