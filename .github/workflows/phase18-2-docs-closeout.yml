name: Phase 18.2 Docs Closeout

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase18-2-docs-closeout.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: phase18-2-docs-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Synchronize Phase 18.2 documentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          old_todo = '''### 18.2 Implement export

          - [ ] include referenced set-local and global macros;
          - [ ] include procedures and optional progress;
          - [ ] exclude every secret;
          - [ ] deterministic ordering;
          - [ ] stable schema version;
          - [ ] exact content length or bounded chunked response.
          '''
          new_todo = '''### 18.2 Implement export

          - [x] include referenced set-local and global macros;
          - [x] include procedures and optional progress;
          - [x] exclude every secret;
          - [x] deterministic ordering;
          - [x] stable schema version;
          - [x] exact content length or bounded chunked response.

          Implemented: the set export route builds a bounded, versioned package from one
          repository-locked snapshot; includes all set-local macros and only referenced
          global macros; includes procedures and optional current progress; excludes
          provisioning, session, credential, and encryption stores by construction;
          revalidates the serialized package; and transfers the exact byte length to the
          HTTP response.
          '''
          if todo.count(old_todo) != 1:
              raise SystemExit("Phase 18.2 TODO block was not unique")
          todo_path.write_text(todo.replace(old_todo, new_todo), encoding="utf-8")

          progress_path = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md")
          progress = progress_path.read_text(encoding="utf-8")
          old_status = "| 18 | Import / export / backup / restore | not started |"
          new_status = "| 18 | Import / export / backup / restore | in progress (§18.2 complete; §18.1 and §18.3–18.5 remain) |"
          if progress.count(old_status) != 1:
              raise SystemExit("Phase 18 status row was not unique")
          progress = progress.replace(old_status, new_status)

          heading = "## Completed tasks (commit evidence)\n\n"
          evidence = '''- Phase 18.2 deterministic set export — complete in the implementation through
            `4fde78b`, with permanent gate repairs in `0e3218b` and the real-Chrome startup
            readiness repair in `1bad01e`. The GET export route returns a raw schema-version-1
            set package from one repository-locked snapshot, includes every set-local macro and
            only referenced global macros, includes procedures and optional current progress,
            excludes provisioning/session/credential/encryption stores by construction, enforces
            `APP_IMPORT_PACKAGE_MAX_BYTES`, validates its own serialized output, and returns the
            exact byte length. Native coverage proves byte-identical repeated exports, omission of
            an unreferenced sentinel global, optional/stale progress behavior, balanced lock and
            ownership cleanup, and fail-closed unresolved/ambiguous references. Route and frontend
            coverage prove raw-body framing, exact content length, error envelopes, and download
            behavior. Targeted repair runs `30581649333` and `30581998929` passed; permanent Host
            Tests run `30582054163` and Browser Tests run `30582054132` passed on clean code head
            `657d7c4`.

          '''
          if progress.count(heading) != 1:
              raise SystemExit("completed-task heading was not unique")
          progress_path.write_text(progress.replace(heading, heading + evidence), encoding="utf-8")
          PY
          git diff --check

      - name: Verify exact change scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          expected_a='docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md'
          expected_b='docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md'
          if [[ "${#changed[@]}" -ne 2 || "${changed[0]}" != "${expected_a}" || "${changed[1]}" != "${expected_b}" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit Phase 18.2 closeout
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md
          git commit -m "docs: close Phase 18.2 export"
          git push origin HEAD:master

      - name: Publish closeout result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          python3 - "${commit_sha}" <<'PY' > /tmp/phase18-2-status.json
          import json
          import os
          import sys

          body = (
              "Phase 18.2 documentation closeout finished.\n\n"
              f"Status: `{os.environ['JOB_STATUS']}`\n"
              f"Run ID: `{os.environ['RUN_ID']}`\n"
              f"Checkout commit: `{sys.argv[1]}`\n"
              "The closeout is authoritative only when status is success and the documentation commit is present on master."
          )
          print(json.dumps({"body": body}))
          PY
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/24" \
            --input /tmp/phase18-2-status.json \
            > /dev/null
