name: Publish CI Status

on:
  workflow_run:
    workflows:
      - Quality
      - Host Tests
      - Browser Tests
      - Device Test Build
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-ci-status-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    name: Publish latest workflow status
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out trusted publisher code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false
          show-progress: false
          sparse-checkout: tools/ci_status
          sparse-checkout-cone-mode: true

      - name: Resolve monitored target
        shell: bash
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          case "${WORKFLOW_NAME}" in
            "Quality")
              issue_number="19"
              legacy_title="CI Status: Quality"
              issue_title="CI Status: Quality — master"
              issue_heading="Latest Quality Run — master"
              ;;
            "Host Tests")
              issue_number="20"
              legacy_title="CI Status: Host Tests"
              issue_title="CI Status: Host Tests — master"
              issue_heading="Latest Host Tests Run — master"
              ;;
            "Browser Tests")
              issue_number="21"
              legacy_title="CI Status: Browser Tests"
              issue_title="CI Status: Browser Tests — master"
              issue_heading="Latest Browser Tests Run — master"
              ;;
            "Device Test Build")
              issue_number="22"
              legacy_title="CI Status: Device Test Build"
              issue_title="CI Status: Device Test Build — master"
              issue_heading="Latest Device Test Build Run — master"
              ;;
            *)
              printf 'Unsupported workflow: %s\n' "${WORKFLOW_NAME}" >&2
              exit 1
              ;;
          esac
          marker="<!-- maintained by .github/workflows/publish-ci-status.yml; workflow=${WORKFLOW_NAME}; branch=master; issue=${issue_number} -->"
          {
            printf 'ISSUE_NUMBER=%s\n' "${issue_number}"
            printf 'LEGACY_ISSUE_TITLE=%s\n' "${legacy_title}"
            printf 'ISSUE_TITLE=%s\n' "${issue_title}"
            printf 'ISSUE_HEADING=%s\n' "${issue_heading}"
            printf 'STATUS_MARKER=%s\n' "${marker}"
            printf 'MONITORED_BRANCH=master\n'
          } >> "${GITHUB_ENV}"

      - name: Reject stale or unrelated run
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]]; then
            printf 'Ignoring untrusted head repository %s.\n' "${HEAD_REPOSITORY}"
            printf 'should_publish=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${HEAD_BRANCH}" != "${MONITORED_BRANCH}" ]]; then
            printf 'Ignoring unrelated branch %s.\n' "${HEAD_BRANCH}"
            printf 'should_publish=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          case "${RUN_EVENT}" in
            push | workflow_dispatch) ;;
            *)
              printf 'Ignoring unrelated event %s.\n' "${RUN_EVENT}"
              printf 'should_publish=false\n' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac

          runs_file="${RUNNER_TEMP}/ci-status-runs.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?branch=${MONITORED_BRANCH}&per_page=100" \
            > "${runs_file}"
          latest_run_id="$(
            python3 tools/ci_status/publish_status.py latest-run \
              --runs "${runs_file}" \
              --repository "${REPOSITORY}" \
              --branch "${MONITORED_BRANCH}" \
              --accepted-events push,workflow_dispatch
          )"
          if [[ "${latest_run_id}" != "${RUN_ID}" ]]; then
            printf 'Skipping stale run %s; latest applicable run is %s.\n' \
              "${RUN_ID}" "${latest_run_id}"
            printf 'should_publish=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf 'should_publish=true\n' >> "${GITHUB_OUTPUT}"

      - name: Validate status issue ownership
        if: steps.freshness.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue_file="${RUNNER_TEMP}/ci-status-issue.json"
          gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" > "${issue_file}"
          python3 tools/ci_status/publish_status.py validate-issue \
            --issue "${issue_file}" \
            --issue-number "${ISSUE_NUMBER}" \
            --marker "${STATUS_MARKER}" \
            --accepted-title "${LEGACY_ISSUE_TITLE}" \
            --accepted-title "${ISSUE_TITLE}"

      - name: Fetch paginated run metadata
        if: steps.freshness.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
        run: |
          set -euo pipefail
          jobs_file="${RUNNER_TEMP}/ci-status-jobs.json"
          artifacts_file="${RUNNER_TEMP}/ci-status-artifacts.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
            > "${jobs_file}"
          if [[ "${RUN_STATUS}" == "completed" ]]; then
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              > "${artifacts_file}"
          else
            printf '[]\n' > "${artifacts_file}"
          fi
          {
            printf 'JOBS_FILE=%s\n' "${jobs_file}"
            printf 'ARTIFACTS_FILE=%s\n' "${artifacts_file}"
          } >> "${GITHUB_ENV}"

      - name: Generate bounded status issue
        if: steps.freshness.outputs.should_publish == 'true'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/ci-status-body.md"
          patch_file="${RUNNER_TEMP}/ci-status-patch.json"
          python3 tools/ci_status/publish_status.py build \
            --jobs "${JOBS_FILE}" \
            --artifacts "${ARTIFACTS_FILE}" \
            --body "${body_file}" \
            --patch "${patch_file}" \
            --workflow-file .github/workflows/publish-ci-status.yml \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-title "${ISSUE_TITLE}" \
            --heading "${ISSUE_HEADING}" \
            --marker "${STATUS_MARKER}" \
            --monitored-branch "${MONITORED_BRANCH}" \
            --workflow-name "${WORKFLOW_NAME}" \
            --workflow-id "${WORKFLOW_ID}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --run-url "${RUN_URL}" \
            --event "${RUN_EVENT}" \
            --status "${RUN_STATUS}" \
            --conclusion "${RUN_CONCLUSION}" \
            --head-repository "${HEAD_REPOSITORY}" \
            --head-branch "${HEAD_BRANCH}" \
            --head-sha "${HEAD_SHA}" \
            --created-at "${CREATED_AT}" \
            --updated-at "${UPDATED_AT}"
          {
            printf 'BODY_FILE=%s\n' "${body_file}"
            printf 'PATCH_FILE=%s\n' "${patch_file}"
          } >> "${GITHUB_ENV}"

      - name: Publish and verify status issue
        if: steps.freshness.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --input "${PATCH_FILE}" \
            > /dev/null
          verification_file="${RUNNER_TEMP}/ci-status-verification.json"
          gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            > "${verification_file}"
          python3 tools/ci_status/publish_status.py validate-issue \
            --issue "${verification_file}" \
            --issue-number "${ISSUE_NUMBER}" \
            --marker "${STATUS_MARKER}" \
            --accepted-title "${ISSUE_TITLE}"
          printf 'Published %s run %s to issue #%s.\n' \
            "${WORKFLOW_NAME}" "${RUN_ID}" "${ISSUE_NUMBER}"
