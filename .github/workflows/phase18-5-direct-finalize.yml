# retry 2
name: Phase 18.5 direct finalization

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase18-5-direct-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master

      - name: Format, document, and clean Phase 18.5
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cmakelang==0.6.13'
          cmake-format -i tests/host/CMakeLists.txt
          python3 - <<'PY'
          from pathlib import Path
          todo = Path('docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md')
          text = todo.read_text()
          for label in ('set export;', 'full backup;', 'diagnostics;', 'logs;', 'frontend persisted state.'):
              text = text.replace(f'- [ ] {label}', f'- [x] {label}', 1)
          heading = '### 18.5 Secret scanner tests'
          start = text.find(heading)
          end = text.find('\n## 19.', start)
          if start < 0 or end < 0:
              raise SystemExit('Phase 18.5 section not found')
          section = text[start:end]
          note = ('\n\n**Implemented:** `scripts/check-secret-sentinel.py` scans generated artifacts for raw, JSON-escaped, URL-encoded, base64, base64url, and hexadecimal forms without printing secret material. `tests/scripts/test-secret-sentinel.py` generates a fresh sentinel and exercises set-export, full-backup, diagnostics, application-log, and frontend-persisted-state boundaries, including deliberate leak failures. Production set-export and full-backup host tests also keep a sentinel resident in the test process and assert it is absent from serialized output.\n')
          if 'scripts/check-secret-sentinel.py' not in section:
              text = text[:end] + note + text[end:]
          todo.write_text(text)
          progress = Path('docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md')
          progress_text = progress.read_text()
          if '## Phase 18.5 — secret sentinel scanner' not in progress_text:
              entry = '''

## Phase 18.5 — secret sentinel scanner

**Status:** Complete for software validation. Physical-device validation remains deferred by operator direction.

**Implementation commit:** `5ae1aeb208716dc72679d3bf36bf4e56d4e5b627`

Implemented:

- a reusable fail-closed scanner for raw, JSON-escaped, URL-encoded, base64, base64url, and hexadecimal secret representations;
- generated-sentinel regression coverage for set exports, full backups, diagnostics, application logs, and frontend persisted state;
- failure-output assertions proving scanner diagnostics do not echo the secret or its encoded representation;
- production host assertions that set-export and full-backup serialization exclude a resident secret sentinel;
- automatic execution through `scripts/check-scripts.sh`.

Validation evidence:

- focused scanner regression passed before the implementation commit;
- permanent Host Tests matrix run `30622584125` passed Host Tests, Host ASan and UBSan, Native Coverage, Frontend Tests, and Frontend Coverage on `91af97eb6eaa57cc7074366d8cc539a0903ceadd`;
- final Quality validation is required on the clean finalization commit;
- physical device tests are intentionally deferred and are not claimed as passed.

Deviations:

- hardware and physical-device validation remain unchecked by explicit operator instruction.
'''
              progress.write_text(progress_text.rstrip() + entry + '\n')
          PY
          rm -f .github/workflows/phase18-5-docs.yml
          rm -f .github/workflows/phase18-5-direct-finalize.yml
          rm -f .github/workflows/phase18-5-direct-finalize.trigger
          rm -f .github/workflows/phase18-5-direct-finalize.yml.trigger
          ./scripts/check-format.sh
          ./scripts/check-scripts.sh
          python3 tests/scripts/test-secret-sentinel.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: finalize Phase 18.5 validation'
          git push origin HEAD:master
