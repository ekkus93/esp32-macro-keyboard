name: Phase 17.9 and 17.10 documentation sync v2

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.repository == 'ekkus93/esp32-macro-keyboard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/code-review-fixes-readable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install pinned documentation tooling
        working-directory: webapp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply heading-bounded documentation updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_section(
              path: Path,
              start_heading: str,
              end_heading: str,
              replacement: str,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              if replacement.strip() in text:
                  return
              start = text.find(start_heading)
              end = text.find(end_heading, start + len(start_heading))
              if start < 0 or end < 0:
                  raise SystemExit(f"{path}: section boundary not found")
              path.write_text(
                  text[:start] + replacement.rstrip() + "\n\n" + text[end:],
                  encoding="utf-8",
              )

          todo = Path(
              "docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md"
          )
          progress = Path(
              "docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md"
          )
          review = Path(
              "docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_PROGRESS_2026-07-29.md"
          )
          ci = Path("docs/CI_REPRODUCIBILITY.md")

          replace_section(
              todo,
              "### 17.9 Implement real management screens",
              "## 18. Complete import, export, backup, and restore",
              """### 17.9 Implement real management screens

          - [x] create/edit/duplicate/reorder/delete sets;
          - [x] import-as-new boundary screen, disabled until Phase 18;
          - [x] transactional-replace boundary screen, disabled until Phase 18;
          - [x] export boundary screen, disabled until Phase 18;
          - [x] settings;
          - [x] backup/restore boundary screens, disabled until Phase 18;
          - [x] diagnostics;
          - [x] quarantine view;
          - [x] restart/reset workflows.

          No enabled button may be inert.

          **Implemented:** every enabled management control performs a real request or
          navigation. Set create, edit, duplicate, keyboard-accessible reorder, and
          guarded delete use live revisioned APIs. Settings, storage health, redacted
          quarantine evidence, restart, settings reset, and factory reset use strict
          response guards and visible physical-confirmation waits. Import, replace,
          export, backup, and restore are honest disabled boundaries because their
          all-or-nothing package services remain Phase 18; the frontend never simulates
          success or sends an unsupported mutation.

          ### 17.10 Add accessibility and browser tests

          - [x] keyboard-only navigation;
          - [x] focus trap and restoration;
          - [x] screen-reader live regions;
          - [x] reorder alternatives;
          - [x] touch target checks;
          - [x] no color-only status;
          - [x] offline/reconnect;
          - [x] full execution workflow.

          **Implemented:** the permanent read-only Browser Tests workflow builds the
          production bundle and drives Chrome through the DevTools Protocol. It proves
          native keyboard activation, modal focus wrapping and restoration, visible
          status text, 44 by 44 CSS-pixel targets, explicit reorder controls, offline and
          reconnect announcements with live refresh, and the complete persisted-macro
          preview, submit, poll, and terminal-result workflow. The gate fails if Chrome
          is unavailable rather than silently falling back to a DOM simulator.""",
          )

          progress_text = progress.read_text(encoding="utf-8")
          old_status = (
              "| 17 | Replace frontend mock behavior | in progress "
              "(17.1-17.8 and settings complete; 17.9-17.10 open) |"
          )
          new_status = (
              "| 17 | Replace frontend mock behavior | done "
              "(Phase 18 package services and Phase 19 aggregation remain separate) |"
          )
          if old_status in progress_text:
              progress_text = progress_text.replace(old_status, new_status, 1)
          elif new_status not in progress_text:
              raise SystemExit(f"{progress}: Phase 17 status line not found")

          progress_evidence = """- Phase 17.9 management surfaces and Phase 17.10 accessibility/browser
            coverage — complete in the implementation ending at `ac12c50`. Live APIs
            now back set create, edit, duplicate, reorder, guarded delete, settings,
            storage health, quarantine evidence, restart, settings reset, and factory
            reset. Phase 18 package operations are visible disabled boundaries with
            specific explanations rather than inert or simulated controls. Dialogs
            trap and restore focus; statuses have visible text; reconnect refreshes
            live configuration; and mobile target sizing is enforced in real Chrome.
            Host Tests run `30455828432` passed static checks, unit tests, coverage,
            sanitizers, and native tests. Browser Tests run `30455823494` built the
            production bundle and passed the full Chrome workflow."""
          if progress_evidence not in progress_text:
              marker = "## Completed tasks (commit evidence)\n\n"
              if marker not in progress_text:
                  raise SystemExit(f"{progress}: completed-task heading not found")
              progress_text = progress_text.replace(
                  marker,
                  marker + progress_evidence + "\n\n",
                  1,
              )
          progress.write_text(progress_text, encoding="utf-8")

          review_text = review.read_text(encoding="utf-8")
          review_evidence = """### Phase 17.9 management surfaces

          - Set create, edit, duplicate, exact-order reorder, and guarded delete use
            current revisions and strict response validation.
          - Settings, storage health, quarantine evidence, restart, settings reset, and
            factory reset are live and fail closed.
          - Import, transactional replace, export, backup, and restore show disabled
            Phase 18 boundaries with explicit reasons; no unsupported request is sent.
          - Every enabled management control performs a real request or navigation.

          ### Phase 17.10 accessibility and browser coverage

          - Accessible dialogs trap focus, close with Escape, and restore focus.
          - Reordering has Move first, up, down, and last controls.
          - Offline and reconnect states are announced and reconnect reloads live data.
          - A dedicated read-only Chrome workflow checks keyboard activation, status
            text, 44 by 44 CSS-pixel targets, reordering, reconnect, and end-to-end
            execution against a deterministic same-origin API fixture.
          - Chrome absence is a hard failure; there is no jsdom substitution for the
            browser acceptance gate.

          Final implementation commit before documentation sync: `ac12c50`."""
          if review_evidence not in review_text:
              marker = "## Intentionally deferred scope"
              if marker not in review_text:
                  raise SystemExit(f"{review}: deferred-scope heading not found")
              review_text = review_text.replace(
                  marker,
                  review_evidence + "\n\n" + marker,
                  1,
              )

          validation_heading = "## Validation status"
          validation = """## Validation status

          - Host Tests run `30455828432`: passed, including strict frontend gates,
            frontend and native coverage, host tests, and ASan/UBSan.
          - Browser Tests run `30455823494`: passed the real Chrome production-bundle
            workflow, including keyboard, focus, touch-target, reconnect, reorder, and
            complete execution checks.
          - The documentation-only synchronization commit is revalidated by the
            read-only Quality, Host Tests, Browser Tests, and ESP32-S3 build workflows
            before Phase 17.9/17.10 is reported as final.
          """.rstrip()
          validation_start = review_text.find(validation_heading)
          if validation_start < 0:
              raise SystemExit(f"{review}: validation heading not found")
          review_text = review_text[:validation_start] + validation + "\n"
          review.write_text(review_text, encoding="utf-8")

          ci_text = ci.read_text(encoding="utf-8")
          chrome_bullet = (
              "- Chrome or Chromium from the pinned `ubuntu-24.04` runner image\n"
          )
          if chrome_bullet not in ci_text:
              marker = (
                  "- npm graph: exact committed `webapp/package-lock.json`, "
                  "installed with `npm ci`\n"
              )
              if marker not in ci_text:
                  raise SystemExit(f"{ci}: npm graph bullet not found")
              ci_text = ci_text.replace(marker, chrome_bullet + marker, 1)

          browser_section = """## Real Chrome browser validation

          Phase 17.10 has a dedicated read-only workflow at
          `.github/workflows/browser-tests.yml`. It:

          - uses pinned checkout and Node setup action commits;
          - builds the production Vite bundle before testing;
          - launches Chrome or Chromium from the pinned Ubuntu runner image;
          - fails when no supported browser is present;
          - serves a deterministic same-origin API fixture without external assets;
          - drives the page through the Chrome DevTools Protocol using Node 24 built-ins;
          - checks keyboard activation, modal focus, visible status text, 44 by 44
            CSS-pixel targets, reorder alternatives, reconnect refresh, and the complete
            execution workflow.

          `scripts/check-webapp.sh` runs the same browser harness after the unit,
          coverage, static, and production-build gates, so the authoritative Quality
          workflow cannot pass by skipping real-browser behavior."""
          if "## Real Chrome browser validation" not in ci_text:
              ci_text = ci_text.rstrip() + "\n\n" + browser_section + "\n"
          ci.write_text(ci_text, encoding="utf-8")
          PY

      - name: Verify exact documentation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ./scripts/check-docs.sh
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            docs/CI_REPRODUCIBILITY.md
            docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_PROGRESS_2026-07-29.md
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'error: unexpected documentation diff: %s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit exact documentation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/CI_REPRODUCIBILITY.md \
            docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_PROGRESS_2026-07-29.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md
          git commit -m "docs: complete Phase 17.9 and 17.10 evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
