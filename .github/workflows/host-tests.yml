name: Host Tests

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev

      - name: Run host tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-tests.sh 2>&1 | tee "${RUNNER_TEMP}/host-tests.log"

      - name: Upload failed host-test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-host-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-tests.log
          if-no-files-found: error
          retention-days: 14

      - name: Package tagged host-test assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/host-tests"
          readonly build_dir="tests/host/build"

          mkdir -p "${output_dir}/binaries"
          find "${build_dir}" -maxdepth 1 -type f -perm /111 \
            -exec cp -- {} "${output_dir}/binaries/" \;
          cp -- "${RUNNER_TEMP}/host-tests.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\nmode=normal\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged host-test assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-${{ github.ref_name }}-linux-x86_64
          path: artifacts/host-tests/
          if-no-files-found: error
          retention-days: 90

  host-sanitizers:
    name: Host ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev

      - name: Run host tests with sanitizers
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-tests.sh --sanitizers 2>&1 \
            | tee "${RUNNER_TEMP}/host-sanitizers.log"

      - name: Upload failed sanitizer log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-host-sanitizers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-sanitizers.log
          if-no-files-found: error
          retention-days: 14

      - name: Package tagged sanitizer assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/host-sanitizers"
          readonly build_dir="tests/host/build-sanitizers"

          mkdir -p "${output_dir}/binaries"
          find "${build_dir}" -maxdepth 1 -type f -perm /111 \
            -exec cp -- {} "${output_dir}/binaries/" \;
          cp -- "${RUNNER_TEMP}/host-sanitizers.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\nmode=asan-ubsan\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged sanitizer assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: host-sanitizers-${{ github.ref_name }}-linux-x86_64
          path: artifacts/host-sanitizers/
          if-no-files-found: error
          retention-days: 90

  native-coverage:
    name: Native Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev \
            python3-venv
          python3 -m venv "${RUNNER_TEMP}/gcovr"
          "${RUNNER_TEMP}/gcovr/bin/python" -m pip install --disable-pip-version-check \
            gcovr==8.6

      - name: Generate native coverage and enforce gates
        shell: bash
        run: |
          set -o pipefail
          PATH="${RUNNER_TEMP}/gcovr/bin:${PATH}" \
            bash ./scripts/generate-native-coverage.sh 2>&1 \
            | tee "${RUNNER_TEMP}/native-coverage.log"

      - name: Package tagged native coverage
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/native-coverage"
          mkdir -p "${output_dir}"
          cp -R -- tests/host/coverage/. "${output_dir}/"
          cp -- "${RUNNER_TEMP}/native-coverage.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\ncoverage=gcovr-8.6\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged native coverage
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ github.ref_name }}
          path: artifacts/native-coverage/
          if-no-files-found: error
          retention-days: 90

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix webapp ci --ignore-scripts --no-audit --no-fund

      - name: Type-check frontend
        run: npm --prefix webapp run typecheck

      - name: Lint frontend TypeScript
        run: npm --prefix webapp run lint

      - name: Lint frontend styles
        run: npm --prefix webapp run stylelint

      - name: Check frontend formatting
        run: npm --prefix webapp run format:check

      - name: Run frontend tests
        run: npm --prefix webapp test

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Generate frontend coverage
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/generate-frontend-coverage.sh 2>&1 \
            | tee "${RUNNER_TEMP}/frontend-coverage.log"

      - name: Package tagged frontend coverage
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/frontend-coverage"
          mkdir -p "${output_dir}"
          cp -R -- webapp/coverage/. "${output_dir}/"
          cp -- "${RUNNER_TEMP}/frontend-coverage.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\ncoverage=vitest-v8-3.2.4\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged frontend coverage
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.ref_name }}
          path: artifacts/frontend-coverage/
          if-no-files-found: error
          retention-days: 90

  phase18-5-cleanup:
    name: Finalize Phase 18.5
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out cleanup trigger
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2

      - name: Install pinned formatter
        run: python3 -m pip install --disable-pip-version-check cmakelang==0.6.13

      - name: Format, document, restore workflow, and commit
        shell: bash
        run: |
          set -euo pipefail
          cmake-format -i tests/host/CMakeLists.txt
          cmake-format --check tests/host/CMakeLists.txt

          python3 - <<'PY'
          from pathlib import Path

          todo = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md")
          text = todo.read_text(encoding="utf-8")
          heading = "### 18.5 Secret scanner tests"
          start = text.find(heading)
          end = text.find("\n## 19.", start)
          if start < 0 or end < 0:
              raise SystemExit("Phase 18.5 section not found")
          section = text[start:end]
          for label in (
              "set export;",
              "full backup;",
              "diagnostics;",
              "logs;",
              "frontend persisted state.",
          ):
              section = section.replace(f"- [ ] {label}", f"- [x] {label}", 1)
          note = (
              "\n\n**Implemented:** `scripts/check-secret-sentinel.py` scans generated artifacts "
              "for raw, JSON-escaped, URL-encoded, base64, base64url, and hexadecimal forms "
              "without printing secret material. `tests/scripts/test-secret-sentinel.py` "
              "generates a fresh sentinel and exercises set-export, full-backup, diagnostics, "
              "application-log, and frontend-persisted-state boundaries, including deliberate "
              "leak failures. Production set-export and full-backup host tests also keep a "
              "sentinel resident in the test process and assert it is absent from serialized output.\n"
          )
          if "scripts/check-secret-sentinel.py" not in section:
              section += note
          todo.write_text(text[:start] + section + text[end:], encoding="utf-8")

          progress = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md")
          progress_text = progress.read_text(encoding="utf-8")
          if "## Phase 18.5 — secret sentinel scanner" not in progress_text:
              entry = """

## Phase 18.5 — secret sentinel scanner

**Status:** Complete for software validation. Physical-device validation remains deferred by operator direction.

**Implementation commit:** `5ae1aeb208716dc72679d3bf36bf4e56d4e5b627`

Implemented:

- reusable fail-closed scanning for raw, JSON-escaped, URL-encoded, base64, base64url, and hexadecimal secret representations;
- generated-sentinel regression coverage for set exports, full backups, diagnostics, application logs, and frontend persisted state;
- failure-output assertions proving scanner diagnostics do not echo secret material;
- production host assertions that set-export and full-backup serialization exclude a resident secret sentinel;
- automatic execution through `scripts/check-scripts.sh`.

Validation evidence:

- focused sentinel-scanner regression passed before the implementation commit;
- Host Tests matrix run `30622584125` passed all five jobs, including Host Tests, Host ASan and UBSan, Native Coverage, Frontend Tests, and Frontend Coverage;
- the permanent Quality workflow must pass on the final clean Phase 18.5 commit;
- physical device tests are intentionally deferred and are not claimed as passed.

Deviations:

- hardware and physical-device validation remain unchecked by explicit operator instruction.
"""
              progress.write_text(progress_text.rstrip() + entry + "\n", encoding="utf-8")
          PY

          python3 tests/scripts/test-secret-sentinel.py
          git show HEAD^:.github/workflows/host-tests.yml > .github/workflows/host-tests.yml
          rm -f .github/workflows/phase18-5-docs.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize Phase 18.5 validation"
          git push origin HEAD:master
