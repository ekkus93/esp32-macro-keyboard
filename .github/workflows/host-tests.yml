name: Host Tests

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18-3-set-tree:
    name: Phase 18.3 Set Tree
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Detect pending implementation
        id: state
        shell: bash
        run: |
          if [[ -f firmware/components/storage/storage_set_tree.c ]]; then
            echo 'needed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'needed=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install host-test dependencies
        if: steps.state.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libcjson-dev

      - name: Apply Phase 18.3 set-tree validator
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path("tools/phase18_3_tree_impl.py")
          text = helper.read_text()

          replacements = {
              '''    join_path(path, sizeof(path), out_set_path "/macros", LOCAL_MACRO_ID ".json");
    write_text(path, LOCAL_MACRO_JSON);
    join_path(path, sizeof(path), out_set_path "/procedures", PROCEDURE_ID ".json");
    write_text(path, PROCEDURE_JSON);
    join_path(path, sizeof(path), out_set_path "/progress", PROCEDURE_ID ".json");
    write_text(path, PROGRESS_JSON);
''': '''    char directory_path[APP_PATH_MAX_BYTES];
    join_path(directory_path, sizeof(directory_path), out_set_path, "macros");
    join_path(path, sizeof(path), directory_path, LOCAL_MACRO_ID ".json");
    write_text(path, LOCAL_MACRO_JSON);
    join_path(directory_path, sizeof(directory_path), out_set_path, "procedures");
    join_path(path, sizeof(path), directory_path, PROCEDURE_ID ".json");
    write_text(path, PROCEDURE_JSON);
    join_path(directory_path, sizeof(directory_path), out_set_path, "progress");
    join_path(path, sizeof(path), directory_path, PROCEDURE_ID ".json");
    write_text(path, PROGRESS_JSON);
''',
              '''    join_path(path, sizeof(path), set_path "/macros", "not-a-uuid.json");
''': '''    char directory_path[APP_PATH_MAX_BYTES];
    join_path(directory_path, sizeof(directory_path), set_path, "macros");
    join_path(path, sizeof(path), directory_path, "not-a-uuid.json");
''',
              '''    join_path(path, sizeof(path), set_path "/progress", PROCEDURE_ID ".json");
''': '''    char progress_path[APP_PATH_MAX_BYTES];
    join_path(progress_path, sizeof(progress_path), set_path, "progress");
    join_path(path, sizeof(path), progress_path, PROCEDURE_ID ".json");
''',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one set-tree fixture replacement, found {count}")
              text = text.replace(old, new, 1)

          text += r'''

extra_tests = Path("tests/host/cmake/extra_tests.cmake")
extra_text = extra_tests.read_text()
extra_needle = '    "${CMAKE_SOURCE_DIR}/../../firmware/components/storage/storage_transaction.c"\n'
if extra_text.count(extra_needle) != 2:
    raise SystemExit(
        f"expected two modular transaction source entries, found {extra_text.count(extra_needle)}"
    )
extra_replacement = (
    extra_needle
    + '    "${CMAKE_SOURCE_DIR}/../../firmware/components/storage/storage_transaction_replace.c"\n'
)
extra_tests.write_text(extra_text.replace(extra_needle, extra_replacement))
'''

          helper.write_text(text)
          PY
          python3 tools/phase18_3_tree_impl.py 2>&1 | tee "${RUNNER_TEMP}/phase18-3-set-tree.log"

      - name: Validate set-tree and permanent host configuration
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            cmake -S tests/host -B build/phase18-3-tree -G Ninja
            cmake --build build/phase18-3-tree --target storage_set_tree_tests storage_transaction_tests
            ctest --test-dir build/phase18-3-tree --output-on-failure \
              -R '^(storage_set_tree|storage_transaction)$'
            ./scripts/run-tests.sh storage
          } 2>&1 | tee -a "${RUNNER_TEMP}/phase18-3-set-tree.log"

      - name: Record failed implementation run
        if: failure() && steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          {
            echo '# Phase 18.3 set-tree automation failure'
            echo
            echo 'The implementation job failed before committing production code.'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/phase18-3-set-tree.log" 2>/dev/null \
              || echo 'No captured log was available.'
            echo '```'
          } > docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git commit -m "ci: record Phase 18.3 set-tree automation failure"
          git push origin HEAD:master

      - name: Commit validated implementation
        if: success() && steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/storage tests/host
          git commit -m "feat(storage): validate complete replacement set trees"
          git push origin HEAD:master

  host-tests:
    name: Host Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev

      - name: Run host tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-tests.sh 2>&1 | tee "${RUNNER_TEMP}/host-tests.log"

      - name: Package tagged host-test assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/host-tests"
          readonly build_dir="tests/host/build"

          mkdir -p "${output_dir}/binaries"
          find "${build_dir}" -maxdepth 1 -type f -perm /111 \
            -exec cp -- {} "${output_dir}/binaries/" \;
          cp -- "${RUNNER_TEMP}/host-tests.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\nmode=normal\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged host-test assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-${{ github.ref_name }}-linux-x86_64
          path: artifacts/host-tests/
          if-no-files-found: error
          retention-days: 90

  host-sanitizers:
    name: Host ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev

      - name: Run host tests with sanitizers
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-tests.sh --sanitizers 2>&1 \
            | tee "${RUNNER_TEMP}/host-sanitizers.log"

      - name: Package tagged sanitizer assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/host-sanitizers"
          readonly build_dir="tests/host/build-sanitizers"

          mkdir -p "${output_dir}/binaries"
          find "${build_dir}" -maxdepth 1 -type f -perm /111 \
            -exec cp -- {} "${output_dir}/binaries/" \;
          cp -- "${RUNNER_TEMP}/host-sanitizers.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\nmode=asan-ubsan\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged sanitizer assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: host-sanitizers-${{ github.ref_name }}-linux-x86_64
          path: artifacts/host-sanitizers/
          if-no-files-found: error
          retention-days: 90

  native-coverage:
    name: Native Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev \
            python3-venv
          python3 -m venv "${RUNNER_TEMP}/gcovr"
          "${RUNNER_TEMP}/gcovr/bin/python" -m pip install --disable-pip-version-check \
            gcovr==8.6

      - name: Generate native coverage and enforce gates
        shell: bash
        run: |
          set -o pipefail
          PATH="${RUNNER_TEMP}/gcovr/bin:${PATH}" \
            bash ./scripts/generate-native-coverage.sh 2>&1 \
            | tee "${RUNNER_TEMP}/native-coverage.log"

      - name: Package tagged native coverage
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/native-coverage"
          mkdir -p "${output_dir}"
          cp -R -- tests/host/coverage/. "${output_dir}/"
          cp -- "${RUNNER_TEMP}/native-coverage.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\ncoverage=gcovr-8.6\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged native coverage
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ github.ref_name }}
          path: artifacts/native-coverage/
          if-no-files-found: error
          retention-days: 90

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix webapp ci --ignore-scripts --no-audit --no-fund

      - name: Type-check frontend
        run: npm --prefix webapp run typecheck

      - name: Lint frontend TypeScript
        run: npm --prefix webapp run lint

      - name: Lint frontend styles
        run: npm --prefix webapp run stylelint

      - name: Check frontend formatting
        run: npm --prefix webapp run format:check

      - name: Run frontend tests
        run: npm --prefix webapp test

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Generate frontend coverage
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/generate-frontend-coverage.sh 2>&1 \
            | tee "${RUNNER_TEMP}/frontend-coverage.log"

      - name: Package tagged frontend coverage
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          readonly output_dir="artifacts/frontend-coverage"
          mkdir -p "${output_dir}"
          cp -R -- webapp/coverage/. "${output_dir}/"
          cp -- "${RUNNER_TEMP}/frontend-coverage.log" "${output_dir}/"
          printf 'tag=%s\ncommit=%s\nrunner=%s\ncoverage=vitest-v8-3.2.4\n' \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${RUNNER_OS}" \
            > "${output_dir}/BUILD-METADATA.txt"
          bash ./scripts/validate-tagged-test-assets.sh "${output_dir}"

      - name: Upload tagged frontend coverage
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.ref_name }}
          path: artifacts/frontend-coverage/
          if-no-files-found: error
          retention-days: 90
