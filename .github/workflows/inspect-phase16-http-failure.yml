name: Inspect Phase 16 HTTP failure once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-phase16-http-failure.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture failed job tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "90275400849"
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          {
            echo "# Phase 16 HTTP integration failure"
            echo
            echo '```text'
            tail -n 700 /tmp/job.log
            echo '```'
          } > docs/CI_PHASE16_HTTP_FAILURE.md
          sed -i 's/[[:space:]]\+$//' docs/CI_PHASE16_HTTP_FAILURE.md
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_PHASE16_HTTP_FAILURE.md
          git commit -m "ci: record Phase 16 HTTP test failure"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
