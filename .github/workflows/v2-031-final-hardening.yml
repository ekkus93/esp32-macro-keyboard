name: V2-031 Final Hardening

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Add one-shot V2-031 final hardening'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Apply bounded browser and HTTP error fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          browser = Path("webapp/tests/browser/run-browser-tests.mjs")
          text = browser.read_text(encoding="utf-8")
          old = (
              "    const timeout = setTimeout(() => {\n"
              "      reject(new Error(`Chrome did not expose DevTools. Output:\\n${output}`));\n"
              "    }, 15_000);\n"
          )
          new = (
              "    const timeout = setTimeout(() => {\n"
              "      reject(new Error(`Chrome did not expose DevTools. Output:\\n${output}`));\n"
              "    }, 30_000);\n"
          )
          if text.count(old) != 1:
              raise SystemExit("Chrome startup timeout block did not match exactly once")
          browser.write_text(text.replace(old, new), encoding="utf-8")

          handler = Path("firmware/components/web_server/web_server_blob.c")
          text = handler.read_text(encoding="utf-8")
          old = (
              "    app_error_code_t result = establish_request_id(request, request_id, sizeof(request_id));\n"
              "    if (result != APP_ERROR_NONE) {\n"
              "        return web_api_send_status_error(request, WEB_HTTP_STATUS_BAD_REQUEST, result,\n"
              "                                         \"invalid request ID\");\n"
              "    }\n"
          )
          new = (
              "    app_error_code_t result = establish_request_id(request, request_id, sizeof(request_id));\n"
              "    if (result != APP_ERROR_NONE) {\n"
              "        const unsigned int status =\n"
              "            result == APP_ERROR_INVALID_ARGUMENT ? WEB_HTTP_STATUS_BAD_REQUEST\n"
              "                                                 : web_api_http_status_for_error(result);\n"
              "        return web_api_send_status_error(request, status, result, \"invalid request ID\");\n"
              "    }\n"
          )
          if text.count(old) != 1:
              raise SystemExit("request-ID error block did not match exactly once")
          handler.write_text(text.replace(old, new), encoding="utf-8")
          PY
          sudo apt-get update
          sudo apt-get install --yes clang-format
          clang-format -i firmware/components/web_server/web_server_blob.c
          rm .github/workflows/v2-031-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/tests/browser/run-browser-tests.mjs \
              firmware/components/web_server/web_server_blob.c \
              .github/workflows/v2-031-final-hardening.yml
          git diff --cached --check
          git commit -m "Harden V2-031 browser startup and request IDs"
          git push origin HEAD:master
