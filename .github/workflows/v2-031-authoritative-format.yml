name: V2-031 Authoritative Format

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Add one-shot V2-031 authoritative formatter'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install repository formatters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format
          python3 -m pip install --user cmakelang==0.6.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply exact repository formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          clang-format -i \
            firmware/components/storage/include/storage_blob.h \
            firmware/components/storage/storage_blob_upload.c \
            firmware/components/storage/storage_blob_upload_core.c \
            firmware/components/storage/storage_blob_upload_internal.h \
            firmware/components/web_server/web_server_adapter.h \
            firmware/components/web_server/web_server_adapter_body_auth.c \
            firmware/components/web_server/web_api_core.h \
            firmware/components/web_server/web_api_core.c \
            firmware/components/web_server/web_request_policy.c \
            firmware/components/web_server/web_server_internal.h \
            firmware/components/web_server/web_server_lifecycle.c \
            firmware/components/web_server/web_server_api.c \
            firmware/components/web_server/web_server_blob.c \
            tests/host/test_storage_blob_upload.c \
            tests/host/test_web_server_adapter_body.inc \
            tests/host/test_web_server_adapter_main.inc \
            tests/host/test_web_request_policy.c \
            tests/host/test_web_api_core.c
          cmake-format -i \
            firmware/components/storage/CMakeLists.txt \
            firmware/components/web_server/CMakeLists.txt \
            tests/host/CMakeLists.txt
          rm .github/workflows/v2-031-authoritative-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/storage firmware/components/web_server tests/host \
              .github/workflows/v2-031-authoritative-format.yml
          git diff --cached --check
          git commit -m "Format V2-031 upload implementation"
          git push origin HEAD:master
