name: Phase 18 Format Artifact

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase18-format-artifact.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: phase18-format-artifact
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Install formatter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Harden and format exact source file
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/components/storage/storage_package.c")
          source = path.read_text(encoding="utf-8")
          old = """    const size_t bytes = shape->count * shape->item_size;
              if (*in_out_total > APP_IMPORT_PACKAGE_MAX_BYTES - bytes) {
                  return false;
              }
          """
          new = """    const size_t bytes = shape->count * shape->item_size;
              if (bytes > APP_IMPORT_PACKAGE_MAX_BYTES) {
                  return false;
              }
              if (*in_out_total > APP_IMPORT_PACKAGE_MAX_BYTES - bytes) {
                  return false;
              }
          """
          if source.count(old) != 1:
              raise SystemExit("expected exact allocation guard once")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          clang-format -i firmware/components/storage/storage_package.c
          clang-format --dry-run --Werror firmware/components/storage/storage_package.c
          git diff --check

      - name: Verify exact change scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "firmware/components/storage/storage_package.c" ]]; then
            printf 'unexpected changed paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Commit exact source change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firmware/components/storage/storage_package.c
          git commit -m "style: format bounded package validator"
          git push origin HEAD:master

      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          python3 - "${commit_sha}" <<'PY' > /tmp/issue.json
          import json
          import os
          import sys

          body = (
              "Temporary exact-path formatter completed.\n\n"
              f"Run ID: `{os.environ['RUN_ID']}`\n"
              f"Commit: `{sys.argv[1]}`\n"
              "Only `firmware/components/storage/storage_package.c` was allowed to change. "
              "The temporary workflow must now be removed."
          )
          print(json.dumps({"body": body}))
          PY
          curl --fail-with-body \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/24" \
            --data-binary @/tmp/issue.json
