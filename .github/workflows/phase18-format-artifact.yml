name: Phase 18 Format Artifact

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase18-format-artifact.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: phase18-format-artifact
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install formatter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Format exact source file
        run: |
          set -euo pipefail
          # The output is uploaded only; this job cannot write repository contents.
          clang-format -i firmware/components/storage/storage_package.c
          clang-format --dry-run --Werror firmware/components/storage/storage_package.c

      - name: Upload formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase18-formatted-storage-package
          path: firmware/components/storage/storage_package.c
          if-no-files-found: error
          retention-days: 1

      - name: Publish run ID
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/issue.json
          import json
          import os

          run_id = os.environ["RUN_ID"]
          body = (
              "Temporary read-only formatter run.\n\n"
              f"Run ID: `{run_id}`\n"
              "Artifact: `phase18-formatted-storage-package`\n"
              "The workflow has no repository write permission and formats only "
              "`firmware/components/storage/storage_package.c`."
          )
          print(json.dumps({"body": body}))
          PY
          curl --fail-with-body \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/24" \
            --data-binary @/tmp/issue.json
