name: V2-032 Closeout

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/v2-032-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0

      - name: Close V2-032 checklist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO_V2.md")
          text = path.read_text(encoding="utf-8")
          old = '''## V2-032 — List, load, and delete

          - [ ] Implement newest-first listing with ID and stored byte size only.
          - [ ] Implement byte-identical streaming download as `application/gzip`.
          - [ ] Implement explicit deletion of exactly one selected blob.
          - [ ] Permit deletion of the final blob.
          - [ ] Never select or load a replacement automatically.
          - [ ] Never inspect gzip headers, decompress, parse JSON, compute metadata, or add
                a checksum, hash, digest, or CRC.
          '''
          new = old.replace("- [ ]", "- [x]")
          if text.count(old) != 1:
              raise SystemExit("V2-032 TODO block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/v2-032-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO_V2.md
          git add -u .github/workflows/v2-032-closeout.yml
          git diff --cached --check
          git commit -m "Close V2-032 checklist"
          git push origin HEAD:master
