name: Inspect Phase 16 quality failure once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-phase16-quality-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and summarize failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/90251632269/logs" \
            --output /tmp/phase16-quality.log
          python3 - <<'PY'
          from pathlib import Path

          raw = Path("/tmp/phase16-quality.log").read_text(encoding="utf-8", errors="replace")
          lines = [line.rstrip() for line in raw.splitlines()]
          markers = (
              " error:",
              "##[error]",
              "FAILED:",
              "Error:",
              "errors generated",
              "tests failed",
              "The following tests FAILED",
          )
          matched = [index for index, line in enumerate(lines) if any(marker in line for marker in markers)]
          start = max(0, (matched[-1] - 80) if matched else len(lines) - 250)
          excerpt = lines[start:]
          if len(excerpt) > 350:
              excerpt = excerpt[-350:]
          output = [
              "# Phase 16 quality failure",
              "",
              "Run: `30352059484`",
              "Job: `90251632269`",
              "Head: `96867411d5895d39339b48157661fea50fdd801f`",
              "",
              "```text",
              *excerpt,
              "```",
              "",
          ]
          Path("docs/CI_PHASE16_QUALITY_FAILURE.md").write_text("\n".join(output), encoding="utf-8")
          PY
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_PHASE16_QUALITY_FAILURE.md
          git commit -m "ci: record Phase 16 quality failure"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
