---
name: Export current master source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          clean: true
      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude='*/build' \
            --exclude='*/build-*' \
            --exclude='*/node_modules' \
            --exclude='*/dist' \
            --exclude='*/coverage' \
            -czf "${RUNNER_TEMP}/esp32-macro-keyboard-master.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: current-master-source
          path: ${{ runner.temp }}/esp32-macro-keyboard-master.tar.gz
          if-no-files-found: error
          retention-days: 1
