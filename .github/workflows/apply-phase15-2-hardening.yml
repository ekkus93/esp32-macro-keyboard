---
name: Apply Phase 15.2 hardening

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Assemble reviewed patch transport
        shell: bash
        run: |
          cat docs/review-source/phase15-2-full-analysis-v3.part.* \
            >"${RUNNER_TEMP}/phase15-2-hardening.b64"
          sha256sum "${RUNNER_TEMP}/phase15-2-hardening.b64" \
            >"${RUNNER_TEMP}/phase15-2-hardening.b64.sha256"

      - name: Preserve assembled transport
        uses: actions/upload-artifact@v4
        with:
          name: phase15-2-assembled-transport
          path: |
            ${{ runner.temp }}/phase15-2-hardening.b64
            ${{ runner.temp }}/phase15-2-hardening.b64.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          base64 --decode "${RUNNER_TEMP}/phase15-2-hardening.b64" \
            | gzip --decompress >"${RUNNER_TEMP}/phase15-2-hardening.patch"
          expected='b26fa9fff431b772b8db8996295956cdc0f252d3310da42a2dce28844fff34c5'
          actual="$(sha256sum "${RUNNER_TEMP}/phase15-2-hardening.patch" | cut -d' ' -f1)"
          printf 'expected patch SHA-256: %s\n' "${expected}"
          printf 'actual patch SHA-256:   %s\n' "${actual}"
          [[ "${actual}" == "${expected}" ]]

      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install authoritative validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./scripts/install-esp-idf.sh

      - name: Apply reviewed repository hardening
        shell: bash
        run: |
          git apply --check "${RUNNER_TEMP}/phase15-2-hardening.patch"
          git apply "${RUNNER_TEMP}/phase15-2-hardening.patch"
          clang-format -i \
            firmware/components/storage/storage_atomic_validators.c \
            firmware/components/storage/storage_json.c \
            firmware/components/storage/storage_paths.c \
            firmware/components/storage/storage_repository_macros.c \
            firmware/components/storage/storage_repository_objects_json.c \
            firmware/components/storage/storage_repository_objects_json.h \
            firmware/components/storage/storage_repository_order.c \
            firmware/components/storage/storage_repository_order.h \
            firmware/components/storage/storage_repository_procedures.c \
            firmware/components/storage/storage_repository_procedures_internal.h \
            tests/host/test_storage_object_json.c \
            tests/host/test_storage_procedures.c
          git diff --check

      - name: Run storage tests
        run: |
          ./scripts/run-tests.sh storage
          ./scripts/run-tests.sh --sanitizers storage

      - name: Run authoritative firmware gate
        shell: bash
        run: |
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/verify-toolchain.sh
          set +e
          ./scripts/check-firmware.sh >"$RUNNER_TEMP/check-firmware.log" 2>&1
          status=$?
          set -e
          if ((status != 0)); then
            grep -E '/firmware/(main/|components/|test_app/main/).*:[0-9]+:[0-9]+: (warning|error):' \
              "$RUNNER_TEMP/check-firmware.log" \
              | head -n 250 || tail -n 300 "$RUNNER_TEMP/check-firmware.log"
          fi
          exit "$status"

      - name: Preserve firmware diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-2-firmware-diagnostics
          path: ${{ runner.temp }}/check-firmware.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/storage/storage_atomic_validators.c \
            firmware/components/storage/storage_json.c \
            firmware/components/storage/storage_paths.c \
            firmware/components/storage/storage_repository_macros.c \
            firmware/components/storage/storage_repository_objects_json.c \
            firmware/components/storage/storage_repository_objects_json.h \
            firmware/components/storage/storage_repository_order.c \
            firmware/components/storage/storage_repository_order.h \
            firmware/components/storage/storage_repository_procedures.c \
            firmware/components/storage/storage_repository_procedures_internal.h \
            tests/host/test_storage_object_json.c \
            tests/host/test_storage_procedures.c
          git commit -m "fix(storage): satisfy strict procedure repository analysis"
          git push origin HEAD:master
