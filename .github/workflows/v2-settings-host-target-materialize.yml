name: V2 Settings Host Target Materializer

on:
  push:
    paths:
      - .github/workflows/v2-settings-host-target-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Add and run focused V2 settings host test
        shell: bash
        run: |
          set -euo pipefail
          # Re-run after fixing the fixture to satisfy canonical V2 settings invariants.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/host/CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          marker = """register_host_test(provisioning_settings_tests provisioning_settings storage)

          add_executable(
              web_api_core_tests test_web_api_core.c ../../firmware/components/macro_model/app_error.c
          """
          replacement = """register_host_test(provisioning_settings_tests provisioning_settings storage)

          add_executable(
              device_settings_core_tests
              test_device_settings_core.c
              ../../firmware/components/device_settings/device_settings_core.c
              ../../firmware/components/app_contracts_v2/device_settings_v2.c
          )
          target_include_directories(
              device_settings_core_tests
              PRIVATE ../../firmware/components/macro_model/include
                      ../../firmware/components/app_contracts_v2/include
                      ../../firmware/components/device_settings/include
                      ../../firmware/components/device_settings
          )
          register_host_test(device_settings_core_tests device_settings_core storage)

          add_executable(
              web_api_core_tests test_web_api_core.c ../../firmware/components/macro_model/app_error.c
          """
          if text.count(marker) != 1:
              raise SystemExit("host CMake insertion marker drifted")
          path.write_text(text.replace(marker, replacement), encoding="utf-8")
          PY

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libcjson-dev
          cmake -S tests/host -B /tmp/v2-settings-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/v2-settings-host --target device_settings_core_tests --parallel 2
          ctest --test-dir /tmp/v2-settings-host -R '^device_settings_core$' --output-on-failure
          git diff --check

      - name: Commit permanent target and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-settings-host-target-materialize.yml
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add tests/host/CMakeLists.txt .github/workflows/v2-settings-host-target-materialize.yml
          git diff --cached --check
          git commit -m "Register V2 settings host tests"
          git push origin HEAD:master
