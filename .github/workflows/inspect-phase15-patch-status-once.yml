name: Inspect Phase 15 patch status once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-phase15-patch-status-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Query workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in patch-phase15-generator-once.yml complete-phase15-once.yml; do
            curl --fail --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=3" \
              --output "/tmp/${workflow}.json"
          done
          mkdir -p docs
          {
            echo "# Phase 15 patch workflow status"
            echo
            echo '```json'
            jq -s '{patch: .[0].workflow_runs, completion: .[1].workflow_runs}' \
              /tmp/patch-phase15-generator-once.yml.json \
              /tmp/complete-phase15-once.yml.json
            echo '```'
          } > docs/CI_PHASE15_PATCH_STATUS.md
      - name: Publish status and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-phase15-patch-status-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: capture Phase 15 patch status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
