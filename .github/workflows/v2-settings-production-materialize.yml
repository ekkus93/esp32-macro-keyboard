name: V2 Settings Production Hardening Materializer

on:
  push:
    paths:
      - .github/workflows/v2-settings-production-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Materialize and validate V2 settings hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("tests/host/test_device_settings_core.c")
          test = test_path.read_text(encoding="utf-8")
          old = """    TEST_CHECK_APP_ERROR(APP_ERROR_STORAGE_CORRUPT,
                               device_settings_core_replace(&core, &failed, &changed));
          """
          new = """    TEST_CHECK_APP_ERROR(APP_ERROR_INVALID_ARGUMENT,
                               device_settings_core_replace(&core, &failed, &changed));
          """
          if test.count(old) != 1:
              raise SystemExit("expected exactly one stale invalid-candidate expectation")
          test_path.write_text(test.replace(old, new), encoding="utf-8")

          adapter_path = Path("firmware/components/device_settings/device_settings.c")
          adapter = adapter_path.read_text(encoding="utf-8")
          old_finish = """static app_error_code_t finish_locked(app_error_code_t result) {
              if (xSemaphoreGive(settings_mutex) != pdTRUE && result == APP_ERROR_NONE) {
                  return APP_ERROR_INTERNAL;
              }
              return result;
          }
          """
          new_finish = """static app_error_code_t finish_locked(app_error_code_t result) {
              if (xSemaphoreGive(settings_mutex) != pdTRUE) {
                  return APP_ERROR_INTERNAL;
              }
              return result;
          }
          """
          if adapter.count(old_finish) != 1:
              raise SystemExit("device settings unlock policy marker drifted")
          adapter_path.write_text(adapter.replace(old_finish, new_finish), encoding="utf-8")

          cmake_path = Path("firmware/components/app_core/CMakeLists.txt")
          cmake = cmake_path.read_text(encoding="utf-8")
          marker = """    macro_model
              support
              provisioning
          """
          replacement = """    macro_model
              support
              device_settings
              provisioning
          """
          if cmake.count(marker) != 1:
              raise SystemExit("app_core dependency marker drifted")
          cmake_path.write_text(cmake.replace(marker, replacement), encoding="utf-8")

          check_all_path = Path("scripts/check-all.sh")
          check_all = check_all_path.read_text(encoding="utf-8")
          marker = "python3 ./scripts/check-v2-034-capacity.py\n"
          insertion = marker + "python3 ./scripts/check-v2-device-settings-policy.py\n"
          if check_all.count(marker) != 1:
              raise SystemExit("check-all V2 insertion marker drifted")
          check_all_path.write_text(check_all.replace(marker, insertion), encoding="utf-8")

          check_scripts_path = Path("scripts/check-scripts.sh")
          check_scripts = check_scripts_path.read_text(encoding="utf-8")
          marker = "python3 scripts/check-v2-settings-schema.py\n"
          insertion = marker + "python3 scripts/check-v2-device-settings-policy.py\n"
          if check_scripts.count(marker) != 1:
              raise SystemExit("check-scripts V2 insertion marker drifted")
          check_scripts_path.write_text(check_scripts.replace(marker, insertion), encoding="utf-8")
          PY

          cat > scripts/check-v2-device-settings-policy.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          core = (ROOT / "firmware/components/device_settings/device_settings_core.c").read_text(
              encoding="utf-8"
          )
          adapter = (ROOT / "firmware/components/device_settings/device_settings.c").read_text(
              encoding="utf-8"
          )
          app_core_cmake = (ROOT / "firmware/components/app_core/CMakeLists.txt").read_text(
              encoding="utf-8"
          )
          host_test = (ROOT / "tests/host/test_device_settings_core.c").read_text(encoding="utf-8")

          def require(source: str, fragment: str, description: str) -> None:
              if fragment not in source:
                  raise SystemExit(f"V2 settings policy violation: {description}")

          require(
              core,
              "if (read_result == APP_ERROR_NOT_FOUND)",
              "only an absent record may enter the unprovisioned-default path",
          )
          require(
              core,
              "return APP_ERROR_STORAGE_CORRUPT;",
              "stored record length/decode corruption must remain a hard storage error",
          )
          require(
              core,
              "map_decode_result(decode_result)",
              "stored record decode failures must use storage-error mapping",
          )
          require(
              core,
              "map_candidate_result(result)",
              "caller-supplied settings validation must be distinct from storage corruption",
          )
          require(
              core,
              "memcmp(current_record, candidate_record, sizeof(current_record)) == 0",
              "duplicate settings records must be detected before persistence",
          )
          require(
              core,
              "core->ops.replace_record_atomic",
              "settings updates must pass through the transactional persistence operation",
          )
          replace_index = core.index("core->ops.replace_record_atomic")
          cache_index = core.index("core->current = *settings;")
          if cache_index <= replace_index:
              raise SystemExit(
                  "V2 settings policy violation: cached settings advance before durable replacement succeeds"
              )

          require(adapter, '#define DEVICE_SETTINGS_NAMESPACE "v2_settings"', "V2 NVS namespace drift")
          require(adapter, '#define DEVICE_SETTINGS_RECORD_KEY "record"', "V2 NVS record key drift")
          require(adapter, "nvs_get_blob", "V2 settings must load from NVS")
          require(adapter, "nvs_set_blob", "V2 settings must write through NVS")
          require(adapter, "nvs_commit", "V2 settings writes must commit explicitly")
          require(
              adapter,
              "const app_error_code_t reopen_result = reopen_settings_handle();",
              "failed NVS writes/commits must discard staged handle state by reopening",
          )
          require(
              adapter,
              "if (xSemaphoreGive(settings_mutex) != pdTRUE) {\n        return APP_ERROR_INTERNAL;\n    }",
              "mutex release failure must never be hidden behind an earlier result",
          )
          for forbidden in ("nvs_erase_all", "nvs_flash_erase", "nvs_erase_key"):
              if forbidden in adapter:
                  raise SystemExit(
                      f"V2 settings policy violation: forbidden destructive fallback {forbidden}"
                  )

          require(
              app_core_cmake,
              "    device_settings\n",
              "production app_core must explicitly depend on the V2 settings component",
          )
          require(
              host_test,
              "TEST_CHECK_APP_ERROR(APP_ERROR_INVALID_ARGUMENT,\n                         device_settings_core_replace(&core, &failed, &changed));",
              "invalid caller settings must be covered as invalid arguments",
          )
          require(
              host_test,
              "TEST_CHECK_EQ_BUFFER(durable_before, fake.durable, sizeof(durable_before));",
              "failed replacement must prove durable settings preservation",
          )
          require(
              host_test,
              "TEST_CHECK_EQ_U64(0U, fake.replace_calls);",
              "no-op settings writes must be covered",
          )

          print("V2 device settings persistence policy checks passed")
          PY
          chmod +x scripts/check-v2-device-settings-policy.py

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libcjson-dev
          python3 -m py_compile scripts/check-v2-device-settings-policy.py
          python3 scripts/check-v2-device-settings-policy.py
          python3 scripts/check-v2-settings-schema.py
          ./scripts/run-tests.sh
          git diff --check

      - name: Commit permanent hardening and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-settings-production-materialize.yml
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            firmware/components/device_settings/device_settings.c \
            firmware/components/app_core/CMakeLists.txt \
            tests/host/test_device_settings_core.c \
            scripts/check-v2-device-settings-policy.py \
            scripts/check-all.sh \
            scripts/check-scripts.sh \
            .github/workflows/v2-settings-production-materialize.yml
          git diff --cached --check
          git commit -m "Harden canonical V2 settings persistence"
          git push origin HEAD:master
