name: Phase 18.2 Quality Repair

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase18-2-quality-repair.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: phase18-2-quality-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: true

      - name: Set up required Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          export GOTOOLCHAIN=go1.25.12
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./scripts/install-esp-idf.sh
          cd webapp
          npm ci
          npm run audit:ci

      - name: Replace recursive package scanner with bounded state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/components/storage/storage_package.c")
          text = path.read_text(encoding="utf-8")

          def replace_section(source: str, start: str, end: str, replacement: str) -> str:
              start_index = source.find(start)
              end_index = source.find(end, start_index + len(start))
              if start_index < 0 or end_index < 0:
                  raise SystemExit(f"missing replacement boundary: {start!r} -> {end!r}")
              if source.find(start, start_index + 1) >= 0:
                  raise SystemExit(f"non-unique start boundary: {start!r}")
              return source[:start_index] + replacement.rstrip() + "\n\n" + source[end_index:]

          macro_anchor = "#define STORAGE_PACKAGE_GLOBAL_MACROS_MAX ((size_t)APP_MACROS_PER_SET_MAX)\n"
          macro_replacement = (
              macro_anchor
              + "#define STORAGE_PACKAGE_JSON_FRAME_COUNT (STORAGE_PACKAGE_MAX_JSON_DEPTH + 1U)\n"
              + "#define JSON_UNICODE_ESCAPE_DIGITS 4U\n"
              + "#define JSON_DECIMAL_RADIX 10U\n"
          )
          if text.count(macro_anchor) != 1:
              raise SystemExit("package constant anchor was not unique")
          text = text.replace(macro_anchor, macro_replacement)

          allocation_anchor = '''typedef struct {
              size_t count;
              size_t item_size;
          } allocation_shape_t;
          '''
          allocation_replacement = allocation_anchor + '''
          typedef enum {
              VALIDATION_ALLOCATION_SETS = 0,
              VALIDATION_ALLOCATION_MACROS,
              VALIDATION_ALLOCATION_PROCEDURES,
              VALIDATION_ALLOCATION_PROGRESS,
              VALIDATION_ALLOCATION_SET_MACRO_COUNTS,
              VALIDATION_ALLOCATION_SET_PROCEDURE_COUNTS,
              VALIDATION_ALLOCATION_COUNT,
          } validation_allocation_t;
          '''
          if text.count(allocation_anchor) != 1:
              raise SystemExit("allocation type anchor was not unique")
          text = text.replace(allocation_anchor, allocation_replacement)

          scanner = r'''static bool is_hex_digit(char value) {
              return (value >= '0' && value <= '9') || (value >= 'a' && value <= 'f') ||
                     (value >= 'A' && value <= 'F');
          }

          static bool is_decimal_digit(char value) {
              return value >= '0' && value <= '9';
          }

          static app_error_code_t scan_json_unicode_escape(json_cursor_t *cursor) {
              if (cursor->length - cursor->offset < JSON_UNICODE_ESCAPE_DIGITS) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              bool all_zero = true;
              for (size_t index = 0U; index < JSON_UNICODE_ESCAPE_DIGITS; ++index) {
                  const char digit = cursor->data[cursor->offset + index];
                  if (!is_hex_digit(digit)) {
                      return APP_ERROR_INVALID_ARGUMENT;
                  }
                  all_zero = all_zero && digit == '0';
              }
              if (all_zero) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              cursor->offset += JSON_UNICODE_ESCAPE_DIGITS;
              return APP_ERROR_NONE;
          }

          static app_error_code_t scan_json_escape(json_cursor_t *cursor) {
              if (cursor->offset >= cursor->length) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              const char escape = cursor->data[cursor->offset++];
              switch (escape) {
              case '"':
              case '\\':
              case '/':
              case 'b':
              case 'f':
              case 'n':
              case 'r':
              case 't':
                  return APP_ERROR_NONE;
              case 'u':
                  return scan_json_unicode_escape(cursor);
              default:
                  return APP_ERROR_INVALID_ARGUMENT;
              }
          }

          static app_error_code_t scan_json_string(json_cursor_t *cursor) {
              if (cursor->offset >= cursor->length || cursor->data[cursor->offset] != '"') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              ++cursor->offset;
              while (cursor->offset < cursor->length) {
                  const unsigned char value = (unsigned char)cursor->data[cursor->offset++];
                  if (value == (unsigned char)'"') {
                      return APP_ERROR_NONE;
                  }
                  if (value < 0x20U) {
                      return APP_ERROR_INVALID_ARGUMENT;
                  }
                  if (value == (unsigned char)'\\') {
                      const app_error_code_t result = scan_json_escape(cursor);
                      if (result != APP_ERROR_NONE) {
                          return result;
                      }
                  }
              }
              return APP_ERROR_INVALID_ARGUMENT;
          }

          static app_error_code_t scan_json_digits(json_cursor_t *cursor) {
              const size_t start = cursor->offset;
              while (cursor->offset < cursor->length &&
                     is_decimal_digit(cursor->data[cursor->offset])) {
                  ++cursor->offset;
              }
              return cursor->offset > start ? APP_ERROR_NONE : APP_ERROR_INVALID_ARGUMENT;
          }

          static app_error_code_t scan_json_integer_part(json_cursor_t *cursor) {
              if (cursor->offset >= cursor->length) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              if (cursor->data[cursor->offset] == '0') {
                  ++cursor->offset;
                  return cursor->offset < cursor->length &&
                                 is_decimal_digit(cursor->data[cursor->offset])
                             ? APP_ERROR_INVALID_ARGUMENT
                             : APP_ERROR_NONE;
              }
              if (cursor->data[cursor->offset] < '1' || cursor->data[cursor->offset] > '9') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              return scan_json_digits(cursor);
          }

          static app_error_code_t scan_json_fraction(json_cursor_t *cursor) {
              if (cursor->offset >= cursor->length || cursor->data[cursor->offset] != '.') {
                  return APP_ERROR_NONE;
              }
              ++cursor->offset;
              return scan_json_digits(cursor);
          }

          static app_error_code_t scan_json_exponent(json_cursor_t *cursor) {
              if (cursor->offset >= cursor->length ||
                  (cursor->data[cursor->offset] != 'e' && cursor->data[cursor->offset] != 'E')) {
                  return APP_ERROR_NONE;
              }
              ++cursor->offset;
              if (cursor->offset < cursor->length &&
                  (cursor->data[cursor->offset] == '+' || cursor->data[cursor->offset] == '-')) {
                  ++cursor->offset;
              }
              return scan_json_digits(cursor);
          }

          static app_error_code_t scan_json_number(json_cursor_t *cursor) {
              if (cursor->offset < cursor->length && cursor->data[cursor->offset] == '-') {
                  ++cursor->offset;
              }
              app_error_code_t result = scan_json_integer_part(cursor);
              if (result == APP_ERROR_NONE) {
                  result = scan_json_fraction(cursor);
              }
              if (result == APP_ERROR_NONE) {
                  result = scan_json_exponent(cursor);
              }
              return result;
          }

          static bool consume_literal(json_cursor_t *cursor, const char *literal) {
              const size_t length = strlen(literal);
              if (cursor->length - cursor->offset < length ||
                  memcmp(cursor->data + cursor->offset, literal, length) != 0) {
                  return false;
              }
              cursor->offset += length;
              return true;
          }

          typedef enum {
              JSON_FRAME_ARRAY_VALUE_OR_END = 0,
              JSON_FRAME_ARRAY_VALUE_REQUIRED,
              JSON_FRAME_ARRAY_SEPARATOR_OR_END,
              JSON_FRAME_OBJECT_KEY_OR_END,
              JSON_FRAME_OBJECT_KEY_REQUIRED,
              JSON_FRAME_OBJECT_COLON,
              JSON_FRAME_OBJECT_VALUE_REQUIRED,
              JSON_FRAME_OBJECT_SEPARATOR_OR_END,
          } json_frame_state_t;

          typedef struct {
              json_frame_state_t state;
          } json_frame_t;

          static app_error_code_t complete_json_value(json_frame_t *frames, size_t depth,
                                                       bool *out_complete) {
              if (depth == 0U) {
                  *out_complete = true;
                  return APP_ERROR_NONE;
              }
              json_frame_state_t *state = &frames[depth - 1U].state;
              switch (*state) {
              case JSON_FRAME_ARRAY_VALUE_OR_END:
              case JSON_FRAME_ARRAY_VALUE_REQUIRED:
                  *state = JSON_FRAME_ARRAY_SEPARATOR_OR_END;
                  return APP_ERROR_NONE;
              case JSON_FRAME_OBJECT_VALUE_REQUIRED:
                  *state = JSON_FRAME_OBJECT_SEPARATOR_OR_END;
                  return APP_ERROR_NONE;
              default:
                  return APP_ERROR_INVALID_ARGUMENT;
              }
          }

          static app_error_code_t scan_json_scalar(json_cursor_t *cursor) {
              switch (cursor->data[cursor->offset]) {
              case '"':
                  return scan_json_string(cursor);
              case 't':
                  return consume_literal(cursor, "true") ? APP_ERROR_NONE
                                                         : APP_ERROR_INVALID_ARGUMENT;
              case 'f':
                  return consume_literal(cursor, "false") ? APP_ERROR_NONE
                                                          : APP_ERROR_INVALID_ARGUMENT;
              case 'n':
                  return consume_literal(cursor, "null") ? APP_ERROR_NONE
                                                         : APP_ERROR_INVALID_ARGUMENT;
              default:
                  return scan_json_number(cursor);
              }
          }

          static app_error_code_t begin_json_value(json_cursor_t *cursor, json_frame_t *frames,
                                                   size_t *in_out_depth, bool *out_complete) {
              skip_whitespace(cursor);
              if (cursor->offset >= cursor->length) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              const char token = cursor->data[cursor->offset];
              if (token == '[' || token == '{') {
                  if (*in_out_depth >= STORAGE_PACKAGE_JSON_FRAME_COUNT) {
                      return APP_ERROR_MACRO_LIMIT;
                  }
                  ++cursor->offset;
                  frames[*in_out_depth].state = token == '[' ? JSON_FRAME_ARRAY_VALUE_OR_END
                                                             : JSON_FRAME_OBJECT_KEY_OR_END;
                  ++*in_out_depth;
                  return APP_ERROR_NONE;
              }
              const app_error_code_t result = scan_json_scalar(cursor);
              return result == APP_ERROR_NONE
                         ? complete_json_value(frames, *in_out_depth, out_complete)
                         : result;
          }

          static app_error_code_t close_json_container(json_cursor_t *cursor, json_frame_t *frames,
                                                       size_t *in_out_depth, bool *out_complete) {
              ++cursor->offset;
              --*in_out_depth;
              return complete_json_value(frames, *in_out_depth, out_complete);
          }

          static app_error_code_t process_array_value(json_cursor_t *cursor, json_frame_t *frames,
                                                       size_t *in_out_depth, bool allow_empty,
                                                       bool *out_complete) {
              skip_whitespace(cursor);
              if (allow_empty && cursor->offset < cursor->length &&
                  cursor->data[cursor->offset] == ']') {
                  return close_json_container(cursor, frames, in_out_depth, out_complete);
              }
              return begin_json_value(cursor, frames, in_out_depth, out_complete);
          }

          static app_error_code_t process_array_separator(json_cursor_t *cursor,
                                                           json_frame_t *frames,
                                                           size_t *in_out_depth,
                                                           bool *out_complete) {
              skip_whitespace(cursor);
              if (cursor->offset >= cursor->length) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              const char separator = cursor->data[cursor->offset];
              if (separator == ']') {
                  return close_json_container(cursor, frames, in_out_depth, out_complete);
              }
              if (separator != ',') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              ++cursor->offset;
              frames[*in_out_depth - 1U].state = JSON_FRAME_ARRAY_VALUE_REQUIRED;
              return APP_ERROR_NONE;
          }

          static app_error_code_t process_object_key(json_cursor_t *cursor, json_frame_t *frames,
                                                      size_t *in_out_depth, bool allow_empty,
                                                      bool *out_complete) {
              skip_whitespace(cursor);
              if (allow_empty && cursor->offset < cursor->length &&
                  cursor->data[cursor->offset] == '}') {
                  return close_json_container(cursor, frames, in_out_depth, out_complete);
              }
              const app_error_code_t result = scan_json_string(cursor);
              if (result == APP_ERROR_NONE) {
                  frames[*in_out_depth - 1U].state = JSON_FRAME_OBJECT_COLON;
              }
              return result;
          }

          static app_error_code_t process_object_colon(json_cursor_t *cursor, json_frame_t *frames,
                                                        size_t depth) {
              skip_whitespace(cursor);
              if (cursor->offset >= cursor->length || cursor->data[cursor->offset] != ':') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              ++cursor->offset;
              frames[depth - 1U].state = JSON_FRAME_OBJECT_VALUE_REQUIRED;
              return APP_ERROR_NONE;
          }

          static app_error_code_t process_object_separator(json_cursor_t *cursor,
                                                            json_frame_t *frames,
                                                            size_t *in_out_depth,
                                                            bool *out_complete) {
              skip_whitespace(cursor);
              if (cursor->offset >= cursor->length) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              const char separator = cursor->data[cursor->offset];
              if (separator == '}') {
                  return close_json_container(cursor, frames, in_out_depth, out_complete);
              }
              if (separator != ',') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              ++cursor->offset;
              frames[*in_out_depth - 1U].state = JSON_FRAME_OBJECT_KEY_REQUIRED;
              return APP_ERROR_NONE;
          }

          static app_error_code_t process_json_frame(json_cursor_t *cursor, json_frame_t *frames,
                                                      size_t *in_out_depth, bool *out_complete) {
              switch (frames[*in_out_depth - 1U].state) {
              case JSON_FRAME_ARRAY_VALUE_OR_END:
                  return process_array_value(cursor, frames, in_out_depth, true, out_complete);
              case JSON_FRAME_ARRAY_VALUE_REQUIRED:
                  return process_array_value(cursor, frames, in_out_depth, false, out_complete);
              case JSON_FRAME_ARRAY_SEPARATOR_OR_END:
                  return process_array_separator(cursor, frames, in_out_depth, out_complete);
              case JSON_FRAME_OBJECT_KEY_OR_END:
                  return process_object_key(cursor, frames, in_out_depth, true, out_complete);
              case JSON_FRAME_OBJECT_KEY_REQUIRED:
                  return process_object_key(cursor, frames, in_out_depth, false, out_complete);
              case JSON_FRAME_OBJECT_COLON:
                  return process_object_colon(cursor, frames, *in_out_depth);
              case JSON_FRAME_OBJECT_VALUE_REQUIRED:
                  return begin_json_value(cursor, frames, in_out_depth, out_complete);
              case JSON_FRAME_OBJECT_SEPARATOR_OR_END:
                  return process_object_separator(cursor, frames, in_out_depth, out_complete);
              default:
                  return APP_ERROR_INVALID_ARGUMENT;
              }
          }

          static app_error_code_t scan_json_value(json_cursor_t *cursor, size_t depth) {
              if (depth != 0U) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              json_frame_t frames[STORAGE_PACKAGE_JSON_FRAME_COUNT] = {0};
              size_t frame_depth = 0U;
              bool complete = false;
              app_error_code_t result =
                  begin_json_value(cursor, frames, &frame_depth, &complete);
              while (result == APP_ERROR_NONE && !complete) {
                  result = process_json_frame(cursor, frames, &frame_depth, &complete);
              }
              return result;
          }'''
          text = replace_section(
              text,
              "static bool is_hex_digit(char value) {",
              "static app_error_code_t capture_json_value(",
              scanner,
          )

          read_u32 = r'''static app_error_code_t read_u32(json_cursor_t *cursor, uint32_t *out_value) {
              if (out_value == NULL || cursor->offset >= cursor->length ||
                  !is_decimal_digit(cursor->data[cursor->offset])) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              uint32_t value = 0U;
              const size_t start = cursor->offset;
              while (cursor->offset < cursor->length &&
                     is_decimal_digit(cursor->data[cursor->offset])) {
                  const uint32_t digit = (uint32_t)(cursor->data[cursor->offset] - '0');
                  if (value > (UINT32_MAX - digit) / JSON_DECIMAL_RADIX) {
                      return APP_ERROR_INVALID_ARGUMENT;
                  }
                  value = value * JSON_DECIMAL_RADIX + digit;
                  ++cursor->offset;
              }
              if (cursor->offset - start > 1U && cursor->data[start] == '0') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              *out_value = value;
              return APP_ERROR_NONE;
          }'''
          text = replace_section(
              text,
              "static app_error_code_t read_u32(",
              "static size_t package_field_index(",
              read_u32,
          )

          package_document = r'''static app_error_code_t parse_package_member(json_cursor_t *cursor,
                                                       package_document_t *out_document,
                                                       uint32_t *in_out_seen) {
              char name[STORAGE_PACKAGE_FIELD_NAME_BYTES];
              app_error_code_t result = read_plain_string(cursor, name, sizeof(name));
              if (result != APP_ERROR_NONE) {
                  return result;
              }
              const size_t field_index = package_field_index(name);
              if (field_index == SIZE_MAX ||
                  (*in_out_seen & (UINT32_C(1) << field_index)) != 0U) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              skip_whitespace(cursor);
              if (cursor->offset >= cursor->length || cursor->data[cursor->offset] != ':') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              ++cursor->offset;
              result = parse_package_field(cursor, field_index, out_document);
              if (result == APP_ERROR_NONE) {
                  *in_out_seen |= UINT32_C(1) << field_index;
              }
              return result;
          }

          static app_error_code_t parse_package_members(json_cursor_t *cursor,
                                                         package_document_t *out_document,
                                                         uint32_t *out_seen) {
              *out_seen = 0U;
              skip_whitespace(cursor);
              if (cursor->offset < cursor->length && cursor->data[cursor->offset] == '}') {
                  ++cursor->offset;
                  return APP_ERROR_NONE;
              }
              for (;;) {
                  app_error_code_t result =
                      parse_package_member(cursor, out_document, out_seen);
                  if (result != APP_ERROR_NONE) {
                      return result;
                  }
                  skip_whitespace(cursor);
                  if (cursor->offset >= cursor->length) {
                      return APP_ERROR_INVALID_ARGUMENT;
                  }
                  const char separator = cursor->data[cursor->offset++];
                  if (separator == '}') {
                      return APP_ERROR_NONE;
                  }
                  if (separator != ',') {
                      return APP_ERROR_INVALID_ARGUMENT;
                  }
                  skip_whitespace(cursor);
                  if (cursor->offset >= cursor->length || cursor->data[cursor->offset] == '}') {
                      return APP_ERROR_INVALID_ARGUMENT;
                  }
              }
          }

          static app_error_code_t finish_package_document(json_cursor_t *cursor, uint32_t seen,
                                                           const package_document_t *document) {
              skip_whitespace(cursor);
              const uint32_t required =
                  (UINT32_C(1) << STORAGE_PACKAGE_FIELD_COUNT) - UINT32_C(1);
              return cursor->offset == cursor->length && seen == required &&
                             document->schema_version == APP_SCHEMA_VERSION
                         ? APP_ERROR_NONE
                         : APP_ERROR_INVALID_ARGUMENT;
          }

          static app_error_code_t parse_package_document(const char *data, size_t length,
                                                          package_document_t *out_document) {
              memset(out_document, 0, sizeof(*out_document));
              json_cursor_t cursor = {
                  .data = data,
                  .length = length,
                  .offset = 0U,
              };
              skip_whitespace(&cursor);
              if (cursor.offset >= cursor.length || cursor.data[cursor.offset] != '{') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              ++cursor.offset;
              uint32_t seen = 0U;
              const app_error_code_t result =
                  parse_package_members(&cursor, out_document, &seen);
              return result == APP_ERROR_NONE
                         ? finish_package_document(&cursor, seen, out_document)
                         : result;
          }'''
          text = replace_section(
              text,
              "static app_error_code_t parse_package_document(",
              "static app_error_code_t visit_object_array(",
              package_document,
          )

          object_array = r'''static app_error_code_t finish_object_array(json_cursor_t *cursor) {
              skip_whitespace(cursor);
              return cursor->offset == cursor->length ? APP_ERROR_NONE
                                                      : APP_ERROR_INVALID_ARGUMENT;
          }

          static app_error_code_t visit_object_array_item(json_cursor_t *cursor,
                                                           size_t maximum_count,
                                                           package_object_callback_t callback,
                                                           void *context, size_t *in_out_count) {
              json_span_t object = {0};
              app_error_code_t result = capture_json_value(cursor, &object);
              if (result != APP_ERROR_NONE) {
                  return result;
              }
              if (object.length == 0U || object.data[0] != '{') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              if (*in_out_count >= maximum_count) {
                  return APP_ERROR_MACRO_LIMIT;
              }
              if (callback != NULL) {
                  result = callback(&object, context);
                  if (result != APP_ERROR_NONE) {
                      return result;
                  }
              }
              ++*in_out_count;
              return APP_ERROR_NONE;
          }

          static app_error_code_t consume_object_array_separator(json_cursor_t *cursor,
                                                                  bool *out_done) {
              skip_whitespace(cursor);
              if (cursor->offset >= cursor->length) {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              const char separator = cursor->data[cursor->offset++];
              if (separator == ']') {
                  *out_done = true;
                  return APP_ERROR_NONE;
              }
              if (separator != ',') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              skip_whitespace(cursor);
              if (cursor->offset >= cursor->length || cursor->data[cursor->offset] == ']') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              *out_done = false;
              return APP_ERROR_NONE;
          }

          static app_error_code_t visit_object_array(const json_span_t *array, size_t maximum_count,
                                                      package_object_callback_t callback,
                                                      void *context, size_t *out_count) {
              if (array == NULL || out_count == NULL || array->length < 2U ||
                  array->data[0] != '[') {
                  return APP_ERROR_INVALID_ARGUMENT;
              }
              *out_count = 0U;
              json_cursor_t cursor = {
                  .data = array->data,
                  .length = array->length,
                  .offset = 1U,
              };
              skip_whitespace(&cursor);
              if (cursor.offset < cursor.length && cursor.data[cursor.offset] == ']') {
                  ++cursor.offset;
                  return finish_object_array(&cursor);
              }
              bool done = false;
              while (!done) {
                  app_error_code_t result = visit_object_array_item(
                      &cursor, maximum_count, callback, context, out_count);
                  if (result != APP_ERROR_NONE) {
                      return result;
                  }
                  result = consume_object_array_separator(&cursor, &done);
                  if (result != APP_ERROR_NONE) {
                      return result;
                  }
              }
              return finish_object_array(&cursor);
          }'''
          text = replace_section(
              text,
              "static app_error_code_t visit_object_array(",
              "static bool add_allocation_budget(",
              object_array,
          )

          allocation = r'''static app_error_code_t allocate_validation_state(
              const storage_package_summary_t *summary, package_validation_state_t *out_state) {
              memset(out_state, 0, sizeof(*out_state));
              if (summary->local_macro_count > SIZE_MAX - summary->global_macro_count) {
                  return APP_ERROR_MACRO_LIMIT;
              }
              out_state->set_capacity = summary->set_count;
              out_state->macro_capacity = summary->local_macro_count + summary->global_macro_count;
              out_state->procedure_capacity = summary->procedure_count;
              out_state->progress_capacity = summary->progress_count;

              const allocation_shape_t shapes[VALIDATION_ALLOCATION_COUNT] = {
                  [VALIDATION_ALLOCATION_SETS] =
                      {.count = out_state->set_capacity, .item_size = sizeof(*out_state->sets)},
                  [VALIDATION_ALLOCATION_MACROS] =
                      {.count = out_state->macro_capacity, .item_size = sizeof(*out_state->macros)},
                  [VALIDATION_ALLOCATION_PROCEDURES] =
                      {.count = out_state->procedure_capacity,
                       .item_size = sizeof(*out_state->procedures)},
                  [VALIDATION_ALLOCATION_PROGRESS] =
                      {.count = out_state->progress_capacity,
                       .item_size = sizeof(*out_state->progress)},
                  [VALIDATION_ALLOCATION_SET_MACRO_COUNTS] =
                      {.count = out_state->set_capacity,
                       .item_size = sizeof(*out_state->set_macro_counts)},
                  [VALIDATION_ALLOCATION_SET_PROCEDURE_COUNTS] =
                      {.count = out_state->set_capacity,
                       .item_size = sizeof(*out_state->set_procedure_counts)},
              };
              size_t allocation_bytes = 0U;
              for (size_t index = 0U; index < VALIDATION_ALLOCATION_COUNT; ++index) {
                  if (!add_allocation_budget(&shapes[index], &allocation_bytes)) {
                      return APP_ERROR_MACRO_LIMIT;
                  }
              }

              app_error_code_t result = allocate_items(
                  &shapes[VALIDATION_ALLOCATION_SETS], (void **)&out_state->sets);
              if (result == APP_ERROR_NONE) {
                  result = allocate_items(&shapes[VALIDATION_ALLOCATION_MACROS],
                                          (void **)&out_state->macros);
              }
              if (result == APP_ERROR_NONE) {
                  result = allocate_items(&shapes[VALIDATION_ALLOCATION_PROCEDURES],
                                          (void **)&out_state->procedures);
              }
              if (result == APP_ERROR_NONE) {
                  result = allocate_items(&shapes[VALIDATION_ALLOCATION_PROGRESS],
                                          (void **)&out_state->progress);
              }
              if (result == APP_ERROR_NONE) {
                  result = allocate_items(&shapes[VALIDATION_ALLOCATION_SET_MACRO_COUNTS],
                                          (void **)&out_state->set_macro_counts);
              }
              if (result == APP_ERROR_NONE) {
                  result = allocate_items(&shapes[VALIDATION_ALLOCATION_SET_PROCEDURE_COUNTS],
                                          (void **)&out_state->set_procedure_counts);
              }
              if (result != APP_ERROR_NONE) {
                  free_validation_state(out_state);
              }
              return result;
          }'''
          text = replace_section(
              text,
              "static app_error_code_t allocate_validation_state(",
              "static size_t find_set_index(",
              allocation,
          )

          path.write_text(text, encoding="utf-8")
          PY

          clang-format -i firmware/components/storage/storage_package.c
          git diff --check

      - name: Run authoritative quality gate
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh

      - name: Verify exact change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "firmware/components/storage/storage_package.c" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit verified parser repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firmware/components/storage/storage_package.c
          git commit -m "refactor: make package parser iterative"
          git push origin HEAD:master

      - name: Publish repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          python3 - "${commit_sha}" <<'PY' > /tmp/phase18-2-status.json
          import json
          import os
          import sys

          body = (
              "Phase 18.2 quality repair workflow finished.\n\n"
              f"Status: `{os.environ['JOB_STATUS']}`\n"
              f"Run ID: `{os.environ['RUN_ID']}`\n"
              f"Checkout commit: `{sys.argv[1]}`\n"
              "The run is authoritative only when status is success and the parser repair commit is present on master."
          )
          print(json.dumps({"body": body}))
          PY
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/24" \
            --input /tmp/phase18-2-status.json \
            > /dev/null
