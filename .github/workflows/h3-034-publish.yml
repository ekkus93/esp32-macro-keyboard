name: H3-034 reset-settings semantics publish

on:
  push:
    branches:
      - h3-034-transport
    paths:
      - .github/h3-034-apply.py
      - .github/h3-034-preprocess.py
      - .github/h3-034-followup.py
      - .github/h3-034-evidence.md
      - .github/workflows/h3-034-publish.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Apply exact-base H3-034 candidate
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_MASTER='be727d666347990abc097a9a23e202f85d02c988'

          cp .github/h3-034-apply.py /tmp/h3-034-apply.py
          cp .github/h3-034-preprocess.py /tmp/h3-034-preprocess.py
          cp .github/h3-034-followup.py /tmp/h3-034-followup.py
          cp .github/h3-034-evidence.md /tmp/h3-034-evidence.md
          python3 /tmp/h3-034-preprocess.py
          python3 -m py_compile /tmp/h3-034-apply.py /tmp/h3-034-followup.py

          git fetch origin master
          test "$(git rev-parse origin/master)" = "${EXPECTED_MASTER}"
          git checkout -B h3-034-product origin/master

          python3 /tmp/h3-034-apply.py
          python3 /tmp/h3-034-followup.py
          cp /tmp/h3-034-evidence.md \
            docs/implementation-v2/H3_034_RESET_SETTINGS_SEMANTICS_2026-08-12.md

          python3 - <<'PY'
          from pathlib import Path

          todo = Path('docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md').read_text()
          h34 = todo.split('### H3-034 — Reset-settings semantics', 1)[1].split(
              '### H3-035 — Hardware interruption evidence', 1
          )[0]
          h35 = todo.split('### H3-035 — Hardware interruption evidence', 1)[1].split(
              '### Phase H3 exit gate', 1
          )[0]
          assert '- [ ]' not in h34
          assert '- [ ]' in h35
          assert Path('docs/implementation-v2/H3_034_RESET_SETTINGS_SEMANTICS_2026-08-12.md').is_file()

          controls_h = Path('firmware/components/device_controls/include/device_controls.h').read_text()
          assert 'device_controls_reset_settings_outcome_t device_controls_reset_settings(void);' in controls_h
          assert 'device_controls_reset_settings_restart_required(void);' in controls_h

          stale = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in {'.c', '.h'}:
                  continue
              text = path.read_text(errors='replace')
              if 'app_error_code_t device_controls_reset_settings(void)' in text:
                  stale.append(str(path))
          assert not stale, stale
          PY

      - name: Install frontend formatting dependencies
        working-directory: webapp
        run: npm ci

      - name: Install host validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format libcjson-dev
          python3 -m pip install --user cmakelang==0.6.13
          export GOTOOLCHAIN=go1.25.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format and inspect candidate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            {
              git diff --name-only --diff-filter=ACMR
              git ls-files --others --exclude-standard
            } | sort -u
          )

          c_files=()
          cmake_files=()
          for file in "${changed_files[@]}"; do
            if [[ "${file}" =~ \.(c|h)$ ]]; then
              c_files+=("${file}")
            fi
            if [[ "${file}" =~ (^|/)CMakeLists\.txt$ ]]; then
              cmake_files+=("${file}")
            fi
          done

          if (( ${#c_files[@]} > 0 )); then
            clang-format -i "${c_files[@]}"
          fi
          if (( ${#cmake_files[@]} > 0 )); then
            cmake-format -i "${cmake_files[@]}"
          fi

          ./scripts/check-format.sh
          git diff --check

      - name: Run architecture and secret guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-h2-architecture.py
          python3 scripts/check-h3-architecture.py
          python3 scripts/check-h9-architecture.py
          bash scripts/check-credential-logging.sh firmware

      - name: Run focused host tests
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-tests.sh controls
          ./scripts/run-tests.sh storage
          ./scripts/run-tests.sh web
          ./scripts/run-tests.sh startup

      - name: Run focused sanitizers
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-tests.sh --sanitizers controls
          ./scripts/run-tests.sh --sanitizers storage
          ./scripts/run-tests.sh --sanitizers web
          ./scripts/run-tests.sh --sanitizers startup

      - name: Run full host suite
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-tests.sh

      - name: Publish H3-034 to master and retire transport branch
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_MASTER='be727d666347990abc097a9a23e202f85d02c988'
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${EXPECTED_MASTER}"

          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          test "${#changed[@]}" -gt 0
          if printf '%s\n' "${changed[@]}" | grep -q '^\.github/'; then
            echo 'transport-only .github files must not enter the product commit' >&2
            exit 1
          fi
          printf '%s\n' "${changed[@]}"

          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: clarify reset-settings partial completion'
          git push origin HEAD:master
          git push origin --delete h3-034-transport
