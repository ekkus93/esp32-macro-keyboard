# One-shot Phase 1 evidence finalizer; remove after it commits the checkpoint.
# Second master commit triggers evaluation after the workflow exists.
name: Phase 1 Evidence Finalize

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: true
          show-progress: false

      - name: Record verified evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/implementation-v2/PHASE_1_CONTRACTS_2026-08-03.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "**Status:** In progress; exit gate not claimed  \n"
                  "**Date:** 2026-08-03  \n"
                  "**Contract implementation head before this report:**\n"
                  "`ed19a6b68a426d9ece53e3c1a2947e0c6ab7eed4`",
                  "**Status:** Contract implementation and CI repair verified; "
                  "Phase 1 completion not claimed  \n"
                  "**Date:** 2026-08-04  \n"
                  "**Contract implementation head before this report:**\n"
                  "`ed19a6b68a426d9ece53e3c1a2947e0c6ab7eed4`  \n"
                  "**Verified repair head:**\n"
                  "`4760d9f00351decb7813fc8eb77bbf3e6eb61cad`",
              ),
              (
                  "The product-owner decision for the first-run setup-state route has now been\n"
                  "resolved and incorporated into both authoritative documents and the shared\n"
                  "contracts. Phase 1 remains open because the checked-in clean-checkout gates have\n"
                  "not yet been executed successfully in an environment with the pinned toolchain.",
                  "The product-owner decision for the first-run setup-state route has now been\n"
                  "resolved and incorporated into both authoritative documents and the shared\n"
                  "contracts. The checked-in implementation and CI repairs were validated on the\n"
                  "clean pull-request head recorded above. This checkpoint records that evidence\n"
                  "without claiming Phase 1 complete because production v1 routes and serializers\n"
                  "remain scheduled for Phase 2 deletion, and PBKDF2 hardware measurement remains\n"
                  "intentionally deferred.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement target, found {count}: {old[:80]!r}"
                  )
              text = text.replace(old, new)

          marker = "\n## 4. Resolved specification decision\n"
          if text.count(marker) != 1:
              raise SystemExit("expected one section 4 marker")

          evidence = """
          ### 3.4 Authoritative GitHub Actions validation

          The permanent repair head `4760d9f00351decb7813fc8eb77bbf3e6eb61cad`
          was validated in pull request #26 after all temporary repair workflows had been
          removed. The following required workflows all completed successfully on that
          exact SHA:

          - Browser Tests — run `30894944349`;
          - Host Tests — run `30894944491`;
          - Device Test Build — run `30894946915`;
          - Quality — run `30894944360`.

          The Host Tests workflow passed ordinary host tests, frontend tests, frontend and
          native coverage, and the AddressSanitizer/UndefinedBehaviorSanitizer job. The
          Device Test Build workflow passed device-source lint and built the ESP32-S3 test
          firmware with ESP-IDF `v5.5.5`. The Quality workflow passed the reviewed npm
          audit policy and the complete authoritative `check-all.sh` sequence; its failure
          artifact step was skipped because the gate succeeded.

          The final repair sequence also verified that:

          - the isolated device-test app discovers `app_contracts_v2`;
          - the npm lock resolves the reviewed transitive security fixes without expanding
            the audit exception policy;
          - C, CMake, TypeScript, Python, shell, JSON, and Markdown formatting/lint gates
            accept the checked-in files;
          - clang-tidy include ownership, format-string typing, and magic-number checks
            pass;
          - the stack-usage allowlist contains no stale entries;
          - `docs/SPEC_TEST_TRACEABILITY.md` is deterministic and matches the repository
            generator.

          """
          evidence = "\n".join(line[10:] if line.startswith("          ") else line for line in evidence.splitlines()) + "\n"
          text = text.replace(marker, "\n" + evidence + marker)

          section5 = """## 5. Remaining phase-boundary items

          The clean-checkout and pinned-toolchain items previously listed here are closed
          by the authoritative evidence in §3.4.

          The following boundaries remain intentionally open:

          - PBKDF2 iteration-count hardware measurement remains deferred to Phase 4 and
            final hardware acceptance.
          - Production v1 routes and repository serializers still exist and are scheduled
            for Phase 2 deletion. Therefore the stronger production-shape exit claim is
            not made in this checkpoint.

          Phase 1 completion is not claimed here, and Phase 2 production deletion work has
          not begun.
          """
          section5 = "\n".join(line[10:] if line.startswith("          ") else line for line in section5.splitlines()) + "\n"
          start = text.find("## 5. Phase 1 exit items still open\n")
          if start == -1:
              raise SystemExit("section 5 heading not found")
          text = text[:start] + section5
          path.write_text(text, encoding="utf-8")
          PY

          changed="$(git diff --name-only)"
          test "${changed}" = "docs/implementation-v2/PHASE_1_CONTRACTS_2026-08-03.md"
          npx --yes markdownlint-cli2@0.23.2 \
            docs/implementation-v2/PHASE_1_CONTRACTS_2026-08-03.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-v2/PHASE_1_CONTRACTS_2026-08-03.md
          git commit -m "docs: record verified Phase 1 CI evidence"
          git push origin HEAD:master
