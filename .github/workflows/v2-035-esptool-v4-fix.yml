name: V2-035 Esptool v4 Final Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-035-esptool-v4-fix.yml

permissions:
  contents: write

concurrency:
  group: v2-035-esptool-v4-final-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply exact V2-035 esptool v4 edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/generate-flash-manifest.sh",
              'image_info="$(esptool.py image_info "${app_image}")"',
              'image_info="$(esptool.py image_info --version 2 "${app_image}")"',
          )

          replace_once(
              "scripts/run-v2-035-hardware.py",
              '[esptool, "image_info", str(app_image)],',
              '[esptool, "image_info", "--version", "2", str(app_image)],',
          )

          replace_once(
              "tests/scripts/fakes/esptool.py",
              '''if [ "${1:-}" = "image_info" ] && [ -n "${2:-}" ]; then
          \tprintf 'Application Information\\n'
          \tprintf 'ELF file SHA256: %s\\n' "${FAKE_ELF_SHA256:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}"
          \texit 0
          fi
          ''',
              '''if [ "$#" -eq 4 ] && [ "${1:-}" = "image_info" ] &&
          \t[ "${2:-}" = "--version" ] && [ "${3:-}" = "2" ] && [ -n "${4:-}" ]; then
          \tprintf 'Application Information\\n'
          \tprintf 'ELF file SHA256: %s\\n' "${FAKE_ELF_SHA256:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}"
          \texit 0
          fi
          ''',
          )

          replace_once(
              "tests/scripts/test-v2-035-hardware.py",
              '''        MODULE.shutil.which = lambda name: "/fake/esptool.py" if name == "esptool.py" else None
                  MODULE.subprocess.run = lambda *args, **kwargs: subprocess.CompletedProcess(
                      args=args[0], returncode=0, stdout=f"ELF file SHA256: {'a' * 64}\\n", stderr=""
                  )
                  try:
                      manifest = MODULE.load_flash_manifest(manifest_path)
          ''',
              '''        MODULE.shutil.which = lambda name: "/fake/esptool.py" if name == "esptool.py" else None
                  esptool_commands: list[list[str]] = []

                  def fake_run(command, **kwargs):
                      assert command == [
                          "/fake/esptool.py",
                          "image_info",
                          "--version",
                          "2",
                          str(app_image),
                      ]
                      assert kwargs == {
                          "check": False,
                          "capture_output": True,
                          "text": True,
                      }
                      esptool_commands.append(command)
                      return subprocess.CompletedProcess(
                          args=command,
                          returncode=0,
                          stdout=f"ELF file SHA256: {'a' * 64}\\n",
                          stderr="",
                      )

                  MODULE.subprocess.run = fake_run
                  try:
                      manifest = MODULE.load_flash_manifest(manifest_path)
                      assert len(esptool_commands) == 1
          ''',
          )
          PY

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/run-v2-035-hardware.py \
            tests/scripts/test-v2-035-hardware.py
          python3 tests/scripts/test-v2-035-hardware.py
          bash tests/scripts/test-generate-flash-manifest.sh
          bash -n scripts/generate-flash-manifest.sh
          bash -n tests/scripts/fakes/esptool.py
          git diff --check

      - name: Remove one-shot workflow and publish exact scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"

          rm -f .github/workflows/v2-035-esptool-v4-fix.yml

          git add -A -- \
            .github/workflows/v2-035-esptool-v4-fix.yml \
            scripts/generate-flash-manifest.sh \
            scripts/run-v2-035-hardware.py \
            tests/scripts/fakes/esptool.py \
            tests/scripts/test-v2-035-hardware.py

          git diff --cached --name-only | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/v2-035-esptool-v4-fix.yml
          scripts/generate-flash-manifest.sh
          scripts/run-v2-035-hardware.py
          tests/scripts/fakes/esptool.py
          tests/scripts/test-v2-035-hardware.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "Fix V2-035 esptool v4 image-info invocation"
          git push origin HEAD:master
