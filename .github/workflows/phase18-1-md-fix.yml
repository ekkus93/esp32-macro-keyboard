name: Phase 18.1 Markdown Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase18-1-md-fix.yml

permissions:
  contents: write

jobs:
  fix-markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Remove duplicate Phase 18.1 blank line
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md"); s=p.read_text(encoding="utf-8"); old="- [x] validate all objects before mutation.\n\n\nImplemented:"; new="- [x] validate all objects before mutation.\n\nImplemented:"; assert s.count(old) == 1; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
          git rm .github/workflows/phase18-1-md-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md
          git commit -m "docs: fix Phase 18.1 markdown spacing"
          git push origin HEAD:master
