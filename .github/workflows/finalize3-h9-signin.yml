name: Finalize H9 Sign In hardening v3

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/finalize3-h9-signin.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci
      - name: Assemble Sign In fix and repair AppV2 test isolation
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the already-reviewed SignInPage implementation from the
          # original staging workflow, then reuse the structural fixture
          # updates from the recovery workflow. Neither staging file is part
          # of the final product commit.
          awk '
            /cat > webapp\/src\/features\/auth\/v2\/SignInPage\.tsx <<'"'"'TSX'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*TSX$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-h9-signin-session-check.yml > webapp/src/features/auth/v2/SignInPage.tsx
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/recover-h9-signin-session-check.yml > /tmp/recover-signin.py
          python3 /tmp/recover-signin.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path("webapp/tests/v2-app-v2.test.tsx")
          text = path.read_text()

          def patch_test(title: str, old: str, new: str) -> None:
              global text
              anchor = f'  test("{title}"'
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit(f"test not found: {title}")
              end = text.find('\n  test("', start + len(anchor))
              if end < 0:
                  end = len(text)
              section = text[start:end]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one target in {title}, found {count}"
                  )
              section = section.replace(old, new, 1)
              text = text[:start] + section + text[end:]

          patch_test(
              "unprovisioned device opens First-run setup",
              "    await render(<AppV2 />);\n"
              "    await waitUntil(() => bodyIncludes(\"First-run setup\"), \"First-run setup\");",
              "    const view = await render(<AppV2 />);\n"
              "    await waitUntil(() => bodyIncludes(\"First-run setup\"), \"First-run setup\");\n"
              "    await view.unmount();",
          )
          patch_test(
              "device unreachable at the setup check shows a retry screen",
              "    await render(<AppV2 />);\n"
              "    await waitUntil(\n"
              "      () => bodyIncludes(\"Device unreachable\"),\n"
              "      \"device unreachable\",\n"
              "    );",
              "    const view = await render(<AppV2 />);\n"
              "    await waitUntil(\n"
              "      () => bodyIncludes(\"Device unreachable\"),\n"
              "      \"device unreachable\",\n"
              "    );\n"
              "    await view.unmount();",
          )

          # Keep timeout failures actionable if a future lifecycle leak occurs.
          old_timeout = '  throw new Error(`Timed out waiting for: ${description}`);'
          new_timeout = '''  const recentFetches = getFetchCalls()
            .slice(-10)
            .map((call) => `${call.method} ${call.url}`)
            .join(", ");
          throw new Error(
            `Timed out waiting for: ${description}; body=${document.body.textContent ?? ""}; recentFetches=${recentFetches}`,
          );'''
          if text.count(old_timeout) != 1:
              raise SystemExit("waitUntil timeout anchor missing")
          text = text.replace(old_timeout, new_timeout, 1)
          path.write_text(text)
          PY

          git diff --check
      - name: Format changed frontend files
        working-directory: webapp
        run: >-
          npx prettier --write
          src/features/auth/v2/SignInPage.tsx
          tests/v2-sign-in-page.test.tsx
          tests/v2-app-v2.test.tsx
      - name: Typecheck
        working-directory: webapp
        run: npm run typecheck
      - name: Lint
        working-directory: webapp
        run: npm run lint
      - name: Check formatting
        working-directory: webapp
        run: npm run format:check
      - name: Run focused regressions
        working-directory: webapp
        run: npx vitest run tests/v2-sign-in-page.test.tsx tests/v2-app-v2.test.tsx tests/v2-api-client.test.ts
      - name: Build production webapp
        working-directory: webapp
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "master moved from triggering SHA $GITHUB_SHA to $remote_sha; refusing to overwrite" >&2
            exit 1
          fi
          rm -f .github/workflows/apply-h9-signin-session-check.yml \
                .github/workflows/recover-h9-signin-session-check.yml \
                .github/workflows/finalize-h9-signin-session-check.yml \
                .github/workflows/finalize2-h9-signin.yml \
                .github/workflows/finalize3-h9-signin.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(webapp): expose Sign In session-check failures"
          git push origin HEAD:master
