name: Fix Macros test lint regressions

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-macros-test-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Apply narrow lint fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("webapp/tests/v2-macros-page.test.tsx")
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"expected {expected} matches, found {count}: {old!r}"
                  )
              text = text.replace(old, new)

          replace_exact(
              'import type { SendMacroHandle } from "../src/v2/sendClient";',
              'import type { SendMacroCallbacks, SendMacroHandle } from "../src/v2/sendClient";',
              1,
          )
          replace_exact(
              "vi.fn(async () => undefined)",
              "vi.fn(() => Promise.resolve(undefined))",
              4,
          )
          replace_exact(
              "vi.fn(async () => null)",
              "vi.fn(() => Promise.resolve(null))",
              1,
          )
          replace_exact(
              'vi.fn(async () => statusAt("running", 1))',
              'vi.fn(() => Promise.resolve(statusAt("running", 1)))',
              1,
          )
          replace_exact(
              "vi.fn(async () => ({",
              "vi.fn(() => Promise.resolve({",
              2,
          )
          replace_exact(
              "dependencies.sendMacro = vi.fn(async () => {",
              "dependencies.sendMacro = vi.fn(() => {",
              1,
          )

          old_decl = (
              "    let trackerCallbacks:\n"
              '      | Parameters<MacrosPageDependencies["trackSend"]>[1]\n'
              "      | undefined;"
          )
          replace_exact(
              old_decl,
              "    let trackerCallbacks: SendMacroCallbacks | undefined;",
              1,
          )
          replace_exact(
              "dependencies.trackSend = vi.fn((_seed, callbacks) => {",
              "dependencies.trackSend = vi.fn((_seed: SendStatusResponse, callbacks: SendMacroCallbacks) => {",
              1,
          )

          path.write_text(text)
          PY

      - name: Format patched test
        working-directory: webapp
        run: npx prettier --write tests/v2-macros-page.test.tsx

      - name: Lint
        run: npm --prefix webapp run lint

      - name: Typecheck
        run: npm --prefix webapp run typecheck

      - name: Run Macros regression test
        working-directory: webapp
        run: npx vitest run tests/v2-macros-page.test.tsx

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "master moved from triggering SHA $GITHUB_SHA to $remote_sha; refusing to overwrite" >&2
            exit 1
          fi
          rm -f .github/workflows/fix-macros-test-lint.yml
          git add webapp/tests/v2-macros-page.test.tsx .github/workflows/fix-macros-test-lint.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(webapp): satisfy strict lint in tracker regressions"
          git push origin HEAD:master
