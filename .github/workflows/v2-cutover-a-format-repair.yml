name: V2 Cutover A format repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-cutover-a-format-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Install formatter and host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format build-essential cmake libcjson-dev
      - name: Format exact Cutover A files and validate
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i \
            firmware/components/app_core/app_core.c \
            firmware/components/app_core/app_core_ops.h \
            tests/host/test_app_core.c
          clang-format --dry-run --Werror \
            firmware/components/app_core/app_core.c \
            firmware/components/app_core/app_core_ops.h \
            tests/host/test_app_core.c
          ./scripts/run-tests.sh
          git diff --check
      - name: Commit formatter repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            firmware/components/app_core/app_core.c \
            firmware/components/app_core/app_core_ops.h \
            tests/host/test_app_core.c
          git rm .github/workflows/v2-cutover-a-format-repair.yml
          if git diff --cached --quiet; then
            echo "error: formatter repair produced no permanent change" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "Format V2-040 Cutover A sources"
          git push origin HEAD:master
