name: Phase 18.2 Browser Repair

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase18-2-browser-repair.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: phase18-2-browser-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Set up required Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Repair initial browser readiness predicate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("webapp/tests/browser/run-browser-tests.mjs")
          text = path.read_text(encoding="utf-8")
          old = '"document.body.innerText.includes(\'Choose a macro set\')"'
          new = '"document.body?.innerText.includes(\'Choose a macro set\') ?? false"'
          if text.count(old) != 1:
              raise SystemExit("initial browser readiness anchor was not unique")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          cd webapp
          npm ci
          npm exec prettier -- --write tests/browser/run-browser-tests.mjs
          npm exec prettier -- --check tests/browser/run-browser-tests.mjs
          npm run build
          npm run test:browser
          cd ..
          git diff --check

      - name: Verify exact change scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "webapp/tests/browser/run-browser-tests.mjs" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit verified browser repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- webapp/tests/browser/run-browser-tests.mjs
          git commit -m "test: tolerate browser startup without body"
          git push origin HEAD:master

      - name: Publish repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          python3 - "${commit_sha}" <<'PY' > /tmp/phase18-2-status.json
          import json
          import os
          import sys

          body = (
              "Phase 18.2 browser repair workflow finished.\n\n"
              f"Status: `{os.environ['JOB_STATUS']}`\n"
              f"Run ID: `{os.environ['RUN_ID']}`\n"
              f"Checkout commit: `{sys.argv[1]}`\n"
              "The run is authoritative only when status is success and the browser repair commit is present on master."
          )
          print(json.dumps({"body": body}))
          PY
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/24" \
            --input /tmp/phase18-2-status.json \
            > /dev/null
