name: V2-035 Route and Diagnostics Repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-035-route-schema-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply scoped route and diagnostics repair
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/MODULE.expect_failure = None/d' .github/v2-035-route-schema-patch.py
          python3 -m py_compile .github/v2-035-route-schema-patch.py
          python3 .github/v2-035-route-schema-patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/scripts/test-v2-035-hardware.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("\ndef test_recursive_values() -> None:\n")
          end = text.index("\ndef test_complete_validation() -> None:\n", start)
          text = text[:start] + "\n" + text[end:]
          old = "    test_recursive_values()\n"
          if text.count(old) != 1:
              raise SystemExit("expected one obsolete recursive-values test invocation")
          text = text.replace(old, "", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate collector against current V2 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run-v2-035-hardware.py tests/scripts/test-v2-035-hardware.py
          python3 tests/scripts/test-v2-035-hardware.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          routes = {
              (entry["method"], entry["path"])
              for entry in json.loads(
                  Path("contracts/v2/api/routes.json").read_text(encoding="utf-8")
              )["routes"]
          }
          required = {
              ("POST", "/api/v1/auth/login"),
              ("GET", "/api/v1/blob"),
              ("POST", "/api/v1/blob"),
              ("GET", "/api/v1/blob/{blob_id}"),
              ("DELETE", "/api/v1/blob/{blob_id}"),
              ("GET", "/api/v1/diagnostics"),
          }
          missing = required - routes
          if missing:
              raise SystemExit(f"required V2 routes missing from manifest: {sorted(missing)}")

          source = Path("scripts/run-v2-035-hardware.py").read_text(encoding="utf-8")
          for forbidden in ("/api/v1/blobs", '"/api/v1/login"'):
              if forbidden in source:
                  raise SystemExit(f"legacy collector path remains: {forbidden}")
          PY
          git diff --check

      - name: Stage and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/v2-035-route-schema-patch.py
          rm .github/workflows/v2-035-route-schema-repair.yml
          git add --all
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/v2-035-route-schema-patch.py \
            .github/workflows/v2-035-route-schema-repair.yml \
            docs/implementation-v2/V2_035_HARDWARE_EVIDENCE_HARNESS_2026-08-06.md \
            scripts/run-v2-035-hardware.py \
            tests/scripts/test-v2-035-hardware.py | sort)"
          test "${actual}" = "${expected}"

      - name: Commit V2-035 route repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(V2-035): align hardware collector with V2 API"
          git push origin HEAD:master
