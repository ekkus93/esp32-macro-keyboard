name: Apply staged H7 executor patch

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-h7-executor-release-fault.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply validated patch and clean staging
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/staging/h7-release-fault.patch.b64 >/tmp/h7.patch
          printf '%s  %s\n' \
            '4f6fe8a6f99cb751724e5d08239d6a498415a272b962fd88fae678cf25175ad1' \
            '/tmp/h7.patch' | sha256sum --check --strict
          git apply --check /tmp/h7.patch
          git apply /tmp/h7.patch
          git diff --check

          git rm .github/staging/h7-release-fault.patch.b64
          git rm .github/workflows/apply-h7-executor-release-fault.yml

          expected="$(printf '%s\n' \
            '.github/staging/h7-release-fault.patch.b64' \
            '.github/workflows/apply-h7-executor-release-fault.yml' \
            'firmware/components/macro_executor/macro_executor.c' \
            'firmware/components/macro_executor/macro_executor_engine.c' \
            'firmware/components/macro_executor/macro_executor_engine.h' \
            'firmware/components/macro_executor/macro_executor_ops.h' \
            'tests/host/executor_terminal_tests.inc' \
            'tests/host/executor_test_fixture.h' \
            'tests/host/executor_test_fixture.inc' \
            'tests/host/executor_validation_tests.inc' | sort)"
          actual="$(git diff --name-only | sort)"
          test "${actual}" = "${expected}"

          git add firmware/components/macro_executor/macro_executor.c \
            firmware/components/macro_executor/macro_executor_engine.c \
            firmware/components/macro_executor/macro_executor_engine.h \
            firmware/components/macro_executor/macro_executor_ops.h \
            tests/host/executor_terminal_tests.inc \
            tests/host/executor_test_fixture.h \
            tests/host/executor_test_fixture.inc \
            tests/host/executor_validation_tests.inc
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: fail closed on executor release faults"
          git push origin HEAD:master
