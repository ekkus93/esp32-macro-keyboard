name: Validate Phase 16 execution route policy once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase16-http-integration-once.yml"
      - "scripts/apply-phase16-execution-route-policy.py"
      - "scripts/run-phase16-execution-route-policy.py"

permissions:
  contents: write

concurrency:
  group: phase16-execution-route-policy-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply execution route policy
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run-phase16-execution-route-policy.py \
            2>&1 | tee /tmp/phase16-execution-transform.log

      - name: Install host validation dependencies
        if: steps.transform.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang-format clang-tidy cmake jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Apply authoritative formatting
        id: format
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            clang-format -i \
              firmware/components/web_server/web_api_core.c \
              firmware/components/web_server/web_api_core.h \
              firmware/components/web_server/web_api_dispatch.c \
              firmware/components/web_server/web_api_execution.c \
              firmware/components/web_server/web_execution_route_policy.c \
              firmware/components/web_server/web_execution_route_policy.h \
              firmware/components/web_server/web_server_api.c \
              tests/host/test_web_api_core.c \
              tests/host/test_web_api_dispatch.c \
              tests/host/test_web_request_policy.c \
              tests/host/test_web_execution_route_policy.c
            cmake-format -i \
              firmware/components/web_server/CMakeLists.txt \
              tests/host/CMakeLists.txt
          } 2>&1 | tee /tmp/phase16-execution-format.log

      - name: Run focused host and sanitizer tests
        id: focused
        if: steps.transform.outcome == 'success' && steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            ./scripts/run-tests.sh web
            ./scripts/run-tests.sh executor
            ./scripts/run-tests.sh --sanitizers web
            ./scripts/run-tests.sh --sanitizers executor
          } 2>&1 | tee /tmp/phase16-execution-focused.log

      - uses: actions/setup-node@v4
        if: steps.focused.outcome == 'success'
        with:
          node-version-file: .nvmrc

      - name: Install ESP-IDF v5.5.5
        if: steps.focused.outcome == 'success'
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        if: steps.focused.outcome == 'success'
        working-directory: webapp
        run: npm ci

      - name: Run authoritative repository gate
        id: gate
        if: steps.focused.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            . "$HOME/esp/esp-idf-v5.5.5/export.sh"
            rm -f docs/CI_PHASE16_EXECUTION_POLICY_FAILURE.md
            ./scripts/check-all.sh
          } 2>&1 | tee /tmp/phase16-execution-gate.log

      - name: Commit validated execution route policy
        if: >-
          steps.transform.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.focused.outcome == 'success' &&
          steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/web_server/CMakeLists.txt \
            firmware/components/web_server/web_api_core.c \
            firmware/components/web_server/web_api_core.h \
            firmware/components/web_server/web_api_dispatch.c \
            firmware/components/web_server/web_api_execution.c \
            firmware/components/web_server/web_execution_route_policy.c \
            firmware/components/web_server/web_execution_route_policy.h \
            firmware/components/web_server/web_server_api.c \
            tests/host/CMakeLists.txt \
            tests/host/test_web_api_core.c \
            tests/host/test_web_api_dispatch.c \
            tests/host/test_web_request_policy.c \
            tests/host/test_web_execution_route_policy.c
          git add -u docs/CI_PHASE16_EXECUTION_POLICY_FAILURE.md
          git commit -m "fix(web): harden execution route policy"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git push origin HEAD:master

      - name: Record exact failure
        if: >-
          steps.transform.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.focused.outcome == 'failure' ||
          steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git reset --hard origin/master
          git clean -fd
          {
            echo "# Phase 16 execution route policy failure"
            echo
            echo "- Transform: ${{ steps.transform.outcome }}"
            echo "- Format: ${{ steps.format.outcome }}"
            echo "- Focused tests: ${{ steps.focused.outcome }}"
            echo "- Authoritative gate: ${{ steps.gate.outcome }}"
            for log in \
              /tmp/phase16-execution-transform.log \
              /tmp/phase16-execution-format.log \
              /tmp/phase16-execution-focused.log \
              /tmp/phase16-execution-gate.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "## $(basename "$log")"
                echo
                echo '```text'
                grep -n -E \
                  'error:|FAILED|Failure|AddressSanitizer|UndefinedBehaviorSanitizer|expected|mismatch' \
                  "$log" | tail -n 220 || true
                echo
                tail -n 240 "$log"
                echo '```'
              fi
            done
          } > docs/CI_PHASE16_EXECUTION_POLICY_FAILURE.md
          sed -i 's/[[:space:]]\+$//' docs/CI_PHASE16_EXECUTION_POLICY_FAILURE.md
          git add docs/CI_PHASE16_EXECUTION_POLICY_FAILURE.md
          git commit -m "ci: record Phase 16 execution policy failure"
          git push origin HEAD:master
          exit 1
