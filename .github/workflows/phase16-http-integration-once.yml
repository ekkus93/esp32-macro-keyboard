name: Validate Phase 16 finalization once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase16-http-integration-once.yml"
      - "scripts/apply-phase16-finalization.py"
      - "scripts/apply-phase16-request-json.py"
      - "scripts/normalize-phase16-finalization-input.py"
      - "scripts/patch-phase16-finalization-output.py"

permissions:
  contents: write

concurrency:
  group: phase16-finalization-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Phase 16 finalization
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/normalize-phase16-finalization-input.py
            python3 scripts/apply-phase16-request-json.py
            python3 scripts/apply-phase16-finalization.py
            python3 scripts/patch-phase16-finalization-output.py
          } 2>&1 | tee /tmp/phase16-finalization-transform.log

      - name: Remove temporary Phase 16 tooling
        id: cleanup
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*phase16*' -o -name 'inspect-phase16-*' \) -print -delete
            find scripts -maxdepth 1 -type f \
              \( -name '*phase16*' -o -name 'apply-phase16-*' -o -name 'run-phase16-*' \) \
              -print -delete
          } 2>&1 | tee /tmp/phase16-finalization-cleanup.log

      - name: Install host validation dependencies
        id: host_deps
        if: steps.transform.outcome == 'success' && steps.cleanup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              build-essential clang-format clang-tidy cmake jq libcjson-dev python3-venv shellcheck
            python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
            python3 -m venv "${RUNNER_TEMP}/gcovr"
            "${RUNNER_TEMP}/gcovr/bin/python" -m pip install --disable-pip-version-check gcovr==8.6
            go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee /tmp/phase16-finalization-host-deps.log

      - name: Apply authoritative formatting
        id: format
        if: steps.host_deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mapfile -t c_files < <(
              {
                git diff --name-only --diff-filter=ACM
                git ls-files --others --exclude-standard
              } | grep -E '\.(c|h)$' | sort -u || true
            )
            if (( ${#c_files[@]} > 0 )); then
              clang-format -i "${c_files[@]}"
            fi
            mapfile -t cmake_files < <(
              {
                git diff --name-only --diff-filter=ACM
                git ls-files --others --exclude-standard
              } | grep -E '(^|/)CMakeLists\.txt$|\.cmake$' | sort -u || true
            )
            if (( ${#cmake_files[@]} > 0 )); then
              cmake-format -i "${cmake_files[@]}"
            fi
          } 2>&1 | tee /tmp/phase16-finalization-format.log

      - name: Run focused host and sanitizer tests
        id: focused
        if: steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            ./scripts/run-tests.sh web
            ./scripts/run-tests.sh storage
            ./scripts/run-tests.sh executor
            ./scripts/run-tests.sh auth
            ./scripts/run-tests.sh --sanitizers web
            ./scripts/run-tests.sh --sanitizers storage
            ./scripts/run-tests.sh --sanitizers executor
            ./scripts/run-tests.sh --sanitizers auth
          } 2>&1 | tee /tmp/phase16-finalization-focused.log

      - uses: actions/setup-node@v4
        id: node
        if: steps.focused.outcome == 'success'
        continue-on-error: true
        with:
          node-version-file: .nvmrc

      - name: Install ESP-IDF v5.5.5
        id: idf
        if: steps.node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          env -u VIRTUAL_ENV ./scripts/install-esp-idf.sh \
            2>&1 | tee /tmp/phase16-finalization-idf.log

      - name: Install frontend dependencies
        id: frontend
        if: steps.idf.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: webapp
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/phase16-finalization-frontend.log

      - name: Run authoritative repository gate
        id: gate
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            . "$HOME/esp/esp-idf-v5.5.5/export.sh"
            ./scripts/check-all.sh
          } 2>&1 | tee /tmp/phase16-finalization-gate.log

      - name: Run coverage and device-build evidence
        id: evidence
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            . "$HOME/esp/esp-idf-v5.5.5/export.sh"
            PATH="${RUNNER_TEMP}/gcovr/bin:${PATH}" ./scripts/generate-native-coverage.sh
            ./scripts/build-device-tests.sh
          } 2>&1 | tee /tmp/phase16-finalization-evidence.log

      - name: Commit validated Phase 16 finalization
        if: >-
          steps.transform.outcome == 'success' &&
          steps.cleanup.outcome == 'success' &&
          steps.host_deps.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.focused.outcome == 'success' &&
          steps.node.outcome == 'success' &&
          steps.idf.outcome == 'success' &&
          steps.frontend.outcome == 'success' &&
          steps.gate.outcome == 'success' &&
          steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): complete Phase 16 HTTP API"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git push origin HEAD:master

      - name: Record exact failure
        if: >-
          steps.transform.outcome == 'failure' ||
          steps.cleanup.outcome == 'failure' ||
          steps.host_deps.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.focused.outcome == 'failure' ||
          steps.node.outcome == 'failure' ||
          steps.idf.outcome == 'failure' ||
          steps.frontend.outcome == 'failure' ||
          steps.gate.outcome == 'failure' ||
          steps.evidence.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git reset --hard origin/master
          git clean -fd
          {
            echo "# Phase 16 finalization failure"
            echo
            echo "- Transform: ${{ steps.transform.outcome }}"
            echo "- Cleanup: ${{ steps.cleanup.outcome }}"
            echo "- Host dependencies: ${{ steps.host_deps.outcome }}"
            echo "- Format: ${{ steps.format.outcome }}"
            echo "- Focused tests: ${{ steps.focused.outcome }}"
            echo "- Node setup: ${{ steps.node.outcome }}"
            echo "- ESP-IDF install: ${{ steps.idf.outcome }}"
            echo "- Frontend install: ${{ steps.frontend.outcome }}"
            echo "- Authoritative gate: ${{ steps.gate.outcome }}"
            echo "- Coverage/device evidence: ${{ steps.evidence.outcome }}"
            for log in \
              /tmp/phase16-finalization-transform.log \
              /tmp/phase16-finalization-cleanup.log \
              /tmp/phase16-finalization-host-deps.log \
              /tmp/phase16-finalization-format.log \
              /tmp/phase16-finalization-focused.log \
              /tmp/phase16-finalization-idf.log \
              /tmp/phase16-finalization-frontend.log \
              /tmp/phase16-finalization-gate.log \
              /tmp/phase16-finalization-evidence.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "## $(basename "$log")"
                echo
                echo '```text'
                grep -n -E \
                  'error:|ERROR:|FAILED|Failure|AddressSanitizer|UndefinedBehaviorSanitizer|expected|mismatch' \
                  "$log" | tail -n 260 || true
                echo
                tail -n 280 "$log"
                echo '```'
              fi
            done
          } > docs/CI_PHASE16_FINALIZATION_FAILURE.md
          sed -i 's/[[:space:]]\+$//' docs/CI_PHASE16_FINALIZATION_FAILURE.md
          git add docs/CI_PHASE16_FINALIZATION_FAILURE.md
          git commit -m "ci: record Phase 16 finalization failure"
          git push origin HEAD:master
          exit 1
