name: Validate Phase 16 HTTP integration once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase16-http-integration-once.yml"

permissions:
  contents: write

concurrency:
  group: phase16-http-integration-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply deterministic Phase 16 transforms
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/apply-phase16-http-integration.py
            python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/components/web_server/web_server_common.c")
          text = path.read_text(encoding="utf-8")
          marker = "static app_error_code_t validate_session_adapter"
          adapter = '''static app_error_code_t get_header_adapter(void *context, const char *name,
                                                         char *buffer, size_t buffer_size) {
              return web_server_get_header(context, name, buffer, buffer_size);
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit("web_server_common.c: validation adapter marker mismatch")
          if "static app_error_code_t get_header_adapter" in text:
              raise SystemExit("web_server_common.c: header adapter already present")
          text = text.replace(marker, adapter + marker, 1)
          cast_call = (
              "return web_adapter_authorize_mutation("
              "(web_adapter_get_header_fn)web_server_get_header,\n"
              "                                          validate_session_adapter, request,"
          )
          typed_call = (
              "return web_adapter_authorize_mutation(get_header_adapter, "
              "validate_session_adapter, request,"
          )
          if text.count(cast_call) != 1:
              raise SystemExit("web_server_common.c: cast call mismatch")
          path.write_text(text.replace(cast_call, typed_call, 1), encoding="utf-8")
          PY
            python3 scripts/run-phase16-clang-tidy-cleanup.py
          } 2>&1 | tee /tmp/phase16-transform.log

      - uses: actions/setup-node@v4
        if: steps.transform.outcome == 'success'
        with:
          node-version-file: .nvmrc

      - name: Install validation dependencies
        if: steps.transform.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            jq \
            libcjson-dev \
            shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        if: steps.transform.outcome == 'success'
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        if: steps.transform.outcome == 'success'
        working-directory: webapp
        run: npm ci

      - name: Apply authoritative formatting
        id: format
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mapfile -t web_sources < <(
              find firmware/components/web_server \
                -type f \( -name '*.c' -o -name '*.h' \) -print | sort
            )
            clang-format -i \
              "${web_sources[@]}" \
              firmware/components/macro_executor/macro_executor_engine.c \
              firmware/components/app_core/app_core_sequence.c \
              tests/host/test_web_api_json.c \
              tests/host/test_web_api_response.c
            cmake-format -i firmware/components/web_server/CMakeLists.txt tests/host/CMakeLists.txt
          } 2>&1 | tee /tmp/phase16-format.log

      - name: Run focused host tests
        id: focused
        if: steps.transform.outcome == 'success' && steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            ./scripts/run-tests.sh web
            ./scripts/run-tests.sh executor
            ./scripts/run-tests.sh --sanitizers web
            ./scripts/run-tests.sh --sanitizers executor
          } 2>&1 | tee /tmp/phase16-focused.log

      - name: Run authoritative repository gate
        id: gate
        if: >-
          steps.transform.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.focused.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            . "$HOME/esp/esp-idf-v5.5.5/export.sh"
            rm -f docs/CI_PHASE16_CLEANUP_FAILURE.md
            ./scripts/check-all.sh
          } 2>&1 | tee /tmp/phase16-gate.log

      - name: Commit validated integration
        if: >-
          steps.transform.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.focused.outcome == 'success' &&
          steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/app_core/app_core_sequence.c \
            firmware/components/macro_executor/macro_executor_engine.c \
            firmware/components/web_server \
            tests/host/CMakeLists.txt \
            tests/host/test_web_api_json.c \
            tests/host/test_web_api_response.c
          git commit -m "feat(web): integrate Phase 16 HTTP API"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git push origin HEAD:master

      - name: Record exact failure
        if: >-
          steps.transform.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.focused.outcome == 'failure' ||
          steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git reset --hard origin/master
          git clean -fd
          {
            echo "# Phase 16 cleanup failure"
            echo
            echo "- Transform: ${{ steps.transform.outcome }}"
            echo "- Format: ${{ steps.format.outcome }}"
            echo "- Focused tests: ${{ steps.focused.outcome }}"
            echo "- Authoritative gate: ${{ steps.gate.outcome }}"
            for log in /tmp/phase16-transform.log /tmp/phase16-format.log /tmp/phase16-focused.log /tmp/phase16-gate.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "## $(basename "$log")"
                echo
                echo '```text'
                grep -n -E 'error:|FAILED|Failure|AddressSanitizer|UndefinedBehaviorSanitizer|Process completed|expected one|mismatch' "$log" | tail -n 160 || true
                echo
                tail -n 180 "$log"
                echo '```'
              fi
            done
          } > docs/CI_PHASE16_CLEANUP_FAILURE.md
          sed -i 's/[[:space:]]\+$//' docs/CI_PHASE16_CLEANUP_FAILURE.md
          git add docs/CI_PHASE16_CLEANUP_FAILURE.md
          git commit -m "ci: record Phase 16 cleanup failure"
          git push origin HEAD:master
          exit 1
