name: Validate Phase 16 policy hardening once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase16-http-integration-once.yml"
      - "scripts/apply-phase16-policy-hardening.py"

permissions:
  contents: write

concurrency:
  group: phase16-policy-hardening-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply deterministic policy hardening
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply-phase16-policy-hardening.py 2>&1 | tee /tmp/phase16-policy-transform.log

      - uses: actions/setup-node@v4
        if: steps.transform.outcome == 'success'
        with:
          node-version-file: .nvmrc

      - name: Install validation dependencies
        if: steps.transform.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            jq \
            libcjson-dev \
            shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        if: steps.transform.outcome == 'success'
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        if: steps.transform.outcome == 'success'
        working-directory: webapp
        run: npm ci

      - name: Apply authoritative formatting
        id: format
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          clang-format -i \
            firmware/components/auth/include/auth.h \
            firmware/components/auth/auth.c \
            firmware/components/auth/auth_core.h \
            firmware/components/auth/auth_core_session.c \
            firmware/components/web_server/web_api_core.c \
            firmware/components/web_server/web_request_policy.c \
            firmware/components/web_server/web_server_api.c \
            tests/host/test_web_api_core.c \
            tests/host/test_web_request_policy.c \
            tests/host/auth_existing_tests.inc \
            2>&1 | tee /tmp/phase16-policy-format.log

      - name: Run focused host tests
        id: focused
        if: steps.transform.outcome == 'success' && steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            ./scripts/run-tests.sh auth
            ./scripts/run-tests.sh web
            ./scripts/run-tests.sh --sanitizers auth
            ./scripts/run-tests.sh --sanitizers web
          } 2>&1 | tee /tmp/phase16-policy-focused.log

      - name: Run authoritative repository gate
        id: gate
        if: >-
          steps.transform.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.focused.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            . "$HOME/esp/esp-idf-v5.5.5/export.sh"
            rm -f docs/CI_PHASE16_POLICY_FAILURE.md
            ./scripts/check-all.sh
          } 2>&1 | tee /tmp/phase16-policy-gate.log

      - name: Commit validated policy hardening
        if: >-
          steps.transform.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.focused.outcome == 'success' &&
          steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/auth/include/auth.h \
            firmware/components/auth/auth.c \
            firmware/components/auth/auth_core.h \
            firmware/components/auth/auth_core_session.c \
            firmware/components/web_server/web_api_core.c \
            firmware/components/web_server/web_request_policy.c \
            firmware/components/web_server/web_server_api.c \
            tests/host/test_web_api_core.c \
            tests/host/test_web_request_policy.c \
            tests/host/auth_existing_tests.inc
          git commit -m "fix(web): harden Phase 16 request policy"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git push origin HEAD:master

      - name: Record exact failure
        if: >-
          steps.transform.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.focused.outcome == 'failure' ||
          steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git reset --hard origin/master
          git clean -fd
          {
            echo "# Phase 16 policy hardening failure"
            echo
            echo "- Transform: ${{ steps.transform.outcome }}"
            echo "- Format: ${{ steps.format.outcome }}"
            echo "- Focused tests: ${{ steps.focused.outcome }}"
            echo "- Authoritative gate: ${{ steps.gate.outcome }}"
            for log in /tmp/phase16-policy-transform.log /tmp/phase16-policy-format.log /tmp/phase16-policy-focused.log /tmp/phase16-policy-gate.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "## $(basename "$log")"
                echo
                echo '```text'
                grep -n -E 'error:|FAILED|Failure|AddressSanitizer|UndefinedBehaviorSanitizer|expected one|mismatch' "$log" | tail -n 160 || true
                echo
                tail -n 180 "$log"
                echo '```'
              fi
            done
          } > docs/CI_PHASE16_POLICY_FAILURE.md
          sed -i 's/[[:space:]]\+$//' docs/CI_PHASE16_POLICY_FAILURE.md
          git add docs/CI_PHASE16_POLICY_FAILURE.md
          git commit -m "ci: record Phase 16 policy hardening failure"
          git push origin HEAD:master
          exit 1
