name: Code review fixes once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/code-review-fixes-once.yml
      - scripts/code-review-fixes.payload.b64

permissions:
  contents: write

concurrency:
  group: code-review-fixes-once
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install host validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Apply, validate, and publish fixes
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/code-review-fixes.log) 2>&1
          stage="initialization"

          record_failure() {
            status="$1"
            set +e
            git reset --hard origin/master
            git clean -fdx
            mkdir -p docs/review-source
            {
              printf '# Code-review fixes validation failure\n\n'
              printf '**Stage:** `%s`\n\n' "${stage}"
              printf '**Exit status:** `%s`\n\n' "${status}"
              printf 'The production changes were not published. The one-shot workflow and verified payload remain on `master` for deterministic correction.\n\n'
              printf '## Log tail\n\n```text\n'
              tail -n 300 /tmp/code-review-fixes.log
              printf '\n```\n'
            } > docs/review-source/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_FAILURE.md
            git add docs/review-source/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_FAILURE.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci(code-review-fixes): record validation failure"
            git push origin HEAD:master
            exit "${status}"
          }
          trap 'record_failure $?' ERR

          stage="payload verification"
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          payload_path = Path("scripts/code-review-fixes.payload.b64")
          encoded = payload_path.read_text(encoding="utf-8").strip()
          expected_payload = "0db203d0982a7149251bd3f57b31694e63bbf851974144b6aea4524485495ce7"
          expected_source = "83b8f0fb2a6c7ccb57124848ac605c1e31b94d4e9262379a5216d08adc0d76ec"
          if hashlib.sha256(encoded.encode()).hexdigest() != expected_payload:
              raise SystemExit("payload SHA-256 mismatch")
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(source).hexdigest() != expected_source:
              raise SystemExit("transform source SHA-256 mismatch")
          root_anchor = b"ROOT = Path(__file__).resolve().parents[1]"
          if source.count(root_anchor) != 1:
              raise SystemExit("transform root anchor mismatch")
          source = source.replace(root_anchor, b"ROOT = Path.cwd()", 1)
          Path("/tmp/apply-code-review-fixes.py").write_bytes(source)
          PY
          python3 -m py_compile /tmp/apply-code-review-fixes.py

          stage="deterministic source transform"
          python3 /tmp/apply-code-review-fixes.py

          stage="post-transform scope correction"
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("webapp/tests/api-execution-submit.test.ts")
          text = test_path.read_text(encoding="utf-8")
          text = text.replace(
              'import { ApiError, setCsrfToken } from "../src/api/client";',
              'import { setCsrfToken } from "../src/api/client";',
          )
          text = text.replace(").rejects.toMatchObject<ApiError>({", ").rejects.toMatchObject({")
          test_path.write_text(text, encoding="utf-8")

          todo_path = Path("docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_TODO_2026-07-28.md")
          todo = todo_path.read_text(encoding="utf-8")
          for task in (
              "- [x] Ensure confirmation page constructs the chosen request shape exactly.",
              "- [x] Ensure procedure context is included only when sending from a procedure",
              "- [x] Ensure standalone macro execution does not include an empty or partial",
          ):
              todo = todo.replace(task, task.replace("- [x]", "- [ ]"), 1)
          note = (
              "> **Phase 17.7 ownership:** the typed request model, exact nested parser, "
              "runtime accepted-response guard, and API submission function are complete. "
              "Wiring the actual confirmation screen remains unchecked because full Phase "
              "17.7 UI is explicitly out of scope for this fix pass.\n\n"
          )
          section_start = todo.index("## 3. Resolve execution submission API contract mismatch")
          acceptance = todo.index("### Acceptance criteria", section_start)
          todo = todo[:acceptance] + note + todo[acceptance:]
          todo_path.write_text(todo, encoding="utf-8")
          PY

          stage="intentional dependency upgrades"
          cd webapp
          npm install --save-dev --save-exact \
            @eslint/js@10.8.0 \
            @vitest/coverage-v8@3.2.7 \
            eslint@10.8.0 \
            eslint-plugin-react-hooks@latest \
            eslint-plugin-react-refresh@latest \
            markdownlint-cli2@0.23.2 \
            typescript-eslint@8.65.0 \
            vite@7.3.6 \
            vitest@3.2.7
          cd ..

          stage="source formatting"
          clang-format -i \
            firmware/components/storage/storage_atomic.c \
            firmware/components/web_server/web_api_json.c \
            firmware/components/web_server/web_api_procedures.c \
            tests/host/test_storage_atomic.c \
            tests/host/test_web_api_json.c \
            tests/host/test_web_api_repository_handlers.c
          shfmt -w \
            scripts/check-docs.sh \
            scripts/check-schema-byte-limits.sh \
            scripts/check-scripts.sh \
            scripts/check-webapp.sh \
            tests/scripts/test-check-schema-byte-limits.sh
          cd webapp
          npm run format:write
          cd ..

          stage="audit report regeneration"
          cd webapp
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_status=$?
          set -e
          cd ..
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          report = json.loads(Path("/tmp/npm-audit.json").read_text(encoding="utf-8"))
          counts = report.get("metadata", {}).get("vulnerabilities", {})
          findings = report.get("vulnerabilities", {})
          lines = [
              "# Frontend npm audit diagnostic",
              "",
              f"**Generated:** {date.today().isoformat()}",
              "",
              "**Scope:** the exact committed `webapp/package-lock.json` after the intentional",
              "dependency-hardening update. The deployed ESP32 serves compiled static assets;",
              "`node_modules` and the development servers are not shipped to the device.",
              "",
              "## Summary",
              "",
              f"- Info: {counts.get('info', 0)}",
              f"- Low: {counts.get('low', 0)}",
              f"- Moderate: {counts.get('moderate', 0)}",
              f"- High: {counts.get('high', 0)}",
              f"- Critical: {counts.get('critical', 0)}",
              f"- Total: {counts.get('total', 0)}",
              "",
              "## Findings",
              "",
          ]
          if not findings:
              lines.extend(["No npm audit findings remain.", ""])
          for name in sorted(findings):
              item = findings[name]
              lines.extend([
                  f"### `{name}`",
                  "",
                  f"- Severity: `{item.get('severity')}`",
                  f"- Direct dependency: `{str(bool(item.get('isDirect'))).lower()}`",
                  f"- Affected range: `{item.get('range')}`",
                  f"- Fix available: `{json.dumps(item.get('fixAvailable'), sort_keys=True)}`",
                  "",
              ])
          lines.extend([
              "## Policy",
              "",
              "The pinned Quality CI runs `npm run audit:ci` and rejects high or critical",
              "advisories. The network-dependent audit is intentionally outside the normal",
              "offline-capable `scripts/check-all.sh` development path.",
              "",
          ])
          Path("docs/review-source/ESP32_MACRO_KEYBOARD_NPM_AUDIT_2026-07-28.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          PY
          cd webapp
          npm run audit:ci
          cd ..
          printf 'Raw npm audit status before threshold filtering: %s\n' "${audit_status}"

          stage="temporary tooling cleanup"
          rm -f docs/review-source/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_FAILURE.md
          git rm .github/workflows/code-review-fixes-once.yml
          git rm scripts/code-review-fixes.payload.b64
          rm -f /tmp/apply-code-review-fixes.py /tmp/npm-audit.json

          stage="authoritative repository gate"
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh

          stage="publication"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            printf 'error: validated transform produced no production changes\n' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden procedure, storage, and release gates"
          git push origin HEAD:master
          trap - ERR
