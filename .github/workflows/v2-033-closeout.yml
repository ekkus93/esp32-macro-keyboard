name: V2-033 Closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-033-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark verified V2-033 criteria complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO_V2.md")
          text = path.read_text()
          old = """## V2-033 — Boot cleanup and degraded states

          - [ ] Remove only interrupted `.tmp` files during boot recovery.
          - [ ] Never remove a final `.gz` because React cannot decode it.
          - [ ] Expose mount failure as an explicit degraded or failed storage state.
          - [ ] Ensure mount failure never triggers formatting.
          - [ ] Report temporary and invalid files in diagnostics.
          """
          new = """## V2-033 — Boot cleanup and degraded states

          - [x] Remove only interrupted `.tmp` files during boot recovery.
          - [x] Never remove a final `.gz` because React cannot decode it.
          - [x] Expose mount failure as an explicit degraded or failed storage state.
          - [x] Ensure mount failure never triggers formatting.
          - [x] Report temporary and invalid files in diagnostics.
          """
          if text.count(old) != 1:
              raise SystemExit("expected exactly one unchanged V2-033 checklist block")
          path.write_text(text.replace(old, new))
          PY

      - name: Verify scope and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-033-closeout.yml
          git diff --check
          expected_paths="$(printf '%s\n' \
            .github/workflows/v2-033-closeout.yml \
            docs/TODO_V2.md | sort)"
          test "$(git diff --name-only | sort)" = "${expected_paths}"
          git diff -- docs/TODO_V2.md

      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs(V2-033): mark boot recovery complete"
          git push origin HEAD:master
