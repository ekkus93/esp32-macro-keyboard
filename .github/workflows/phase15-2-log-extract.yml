---
name: Phase 15.2 Quality log extract

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Download completed Quality job log
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/90094125059/logs" \
            --output "${RUNNER_TEMP}/quality.log"

      - name: Extract failure diagnostics
        run: |
          diagnostics="${RUNNER_TEMP}/diagnostics.log"
          grep -E \
            '(^|[[:space:]])(error:|FAIL:|FAILED)|run-clang-tidy failed|would reformat|markdownlint|yamllint|Process completed with exit code' \
            "${RUNNER_TEMP}/quality.log" >"${diagnostics}" || true
          if [[ -s "${diagnostics}" ]]; then
            tail -n 300 "${diagnostics}"
          else
            tail -n 300 "${RUNNER_TEMP}/quality.log"
            exit 1
          fi
