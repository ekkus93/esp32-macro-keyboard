name: Recover Sign In session-check visibility hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/recover-h9-signin-session-check.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Recover staged Sign In source and patch regressions structurally
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /cat > webapp\/src\/features\/auth\/v2\/SignInPage\.tsx <<'"'"'TSX'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*TSX$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-h9-signin-session-check.yml > webapp/src/features/auth/v2/SignInPage.tsx

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("webapp/tests/v2-sign-in-page.test.tsx")
          text = path.read_text()
          old_import = "  buttonWithText,\n  flushReact,"
          new_import = "  buttonWithText,\n  click,\n  flushReact,"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected Sign In render-helper import layout")
          text = text.replace(old_import, new_import, 1)

          pattern = re.compile(
              r'(?ms)^  test\("falls back to the form when the session check fails unexpectedly", async \(\) => \{\n.*?^  \}\);$'
          )
          replacement = "\n".join([
              '  test("shows a retryable error when the session check fails unexpectedly", async () => {',
              '    planSessionCheck(500, {',
              '      error: { code: "internal_error", message: "Unexpected failure." },',
              '    });',
              '    const view = await render(',
              '      <SignInPage',
              '        onAuthenticated={() => {',
              '          /* not exercised in this test */',
              '        }}',
              '      />,',
              '    );',
              '    await flushReact();',
              '',
              '    expect(requiredElement("[role=\'alert\']", HTMLElement).textContent).toBe(',
              '      "internal_error: Unexpected failure.",',
              '    );',
              '    expect(document.body.textContent).not.toContain("Administrator password");',
              '',
              '    planUnauthenticatedSessionCheck();',
              '    await click(buttonWithText("Retry"));',
              '    await flushReact();',
              '    expect(document.body.textContent).toContain("Administrator password");',
              '    expect(document.body.textContent).not.toContain("Unexpected failure.");',
              '    await view.unmount();',
              '  });',
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one legacy Sign In failure test, found {count}")
          path.write_text(text)

          app_path = Path("webapp/tests/v2-app-v2.test.tsx")
          app_text = app_path.read_text()
          function_anchor = "async function signIn(options: SignInOptions = {}): Promise<RenderResult> {"
          render_anchor = "  const view = await render(<AppV2 />);"
          start = app_text.find(function_anchor)
          if start < 0:
              raise SystemExit("signIn helper not found")
          render_index = app_text.find(render_anchor, start)
          if render_index < 0:
              raise SystemExit("signIn helper render anchor not found")
          next_function = app_text.find("\nasync function ", start + len(function_anchor))
          if next_function >= 0 and render_index >= next_function:
              raise SystemExit("render anchor escaped signIn helper")

          session_plan = "\n".join([
              '  planFetch((call) => {',
              '    expect(call.url).toBe("/api/v1/auth/session");',
              '    expect(call.method).toBe("GET");',
              '    return jsonResponse(',
              '      { error: { code: "unauthorized", message: "Sign in required." } },',
              '      401,',
              '    );',
              '  });',
              '',
          ])
          if "/api/v1/auth/session" in app_text[start:render_index]:
              raise SystemExit("signIn helper already plans auth/session")
          app_text = app_text[:render_index] + session_plan + app_text[render_index:]

          def insert_before_in_test(source: str, title: str, marker: str, insertion: str) -> str:
              test_anchor = f'  test("{title}"'
              test_start = source.find(test_anchor)
              if test_start < 0:
                  raise SystemExit(f"test not found: {title}")
              test_end = source.find('\n  test("', test_start + len(test_anchor))
              if test_end < 0:
                  test_end = len(source)
              marker_index = source.find(marker, test_start, test_end)
              if marker_index < 0:
                  raise SystemExit(f"marker not found in test: {title}")
              return source[:marker_index] + insertion + source[marker_index:]

          nested_session_plan = "\n".join(
              ("  " + line) if line else line
              for line in session_plan.rstrip("\n").split("\n")
          ) + "\n"

          app_text = insert_before_in_test(
              app_text,
              "session expiry drops back to Sign In without discarding the working copy",
              "    await tick(5_000);",
              nested_session_plan,
          )
          app_text = insert_before_in_test(
              app_text,
              "Sign out (V2-103's fifth warning trigger) warns first because signIn() leaves the working copy dirty; Discard changes proceeds, ends the session, and a fresh sign-in recovers cleanly",
              '    await click(buttonWithText("Discard changes"));',
              nested_session_plan,
          )
          app_text = insert_before_in_test(
              app_text,
              "Restart shows a real reconnecting screen, then Sign In once the device answers unauthorized, resuming the same working copy",
              "    await tick(1000);",
              nested_session_plan,
          )
          app_path.write_text(app_text)
          PY
          git diff --check

      - name: Format changed frontend files
        working-directory: webapp
        run: >-
          npx prettier --write
          src/features/auth/v2/SignInPage.tsx
          tests/v2-sign-in-page.test.tsx
          tests/v2-app-v2.test.tsx

      - name: Typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Lint
        working-directory: webapp
        run: npm run lint

      - name: Check formatting
        working-directory: webapp
        run: npm run format:check

      - name: Run focused Sign In regressions
        working-directory: webapp
        run: npx vitest run tests/v2-sign-in-page.test.tsx tests/v2-app-v2.test.tsx

      - name: Build production webapp
        working-directory: webapp
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "master moved from triggering SHA $GITHUB_SHA to $remote_sha; refusing to overwrite" >&2
            exit 1
          fi
          rm -f .github/workflows/apply-h9-signin-session-check.yml \
                .github/workflows/recover-h9-signin-session-check.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(webapp): expose Sign In session-check failures"
          git push origin HEAD:master
