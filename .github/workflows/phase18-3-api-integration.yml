name: Phase 18.3 API Integration

on:
  push:
    branches:
      - master
    paths:
      - .github/phase18-3-api-integration-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-3-api-master
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build libcjson-dev

      - name: Apply API integration
        shell: bash
        run: |
          set -o pipefail
          python3 tools/phase18_3_api_integration_impl.py 2>&1 \
            | tee "${RUNNER_TEMP}/phase18-3-api.log"

      - name: Validate API integration
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            cmake -S tests/host -B /tmp/esp32-p183-api -G Ninja
            cmake --build /tmp/esp32-p183-api \
              --target web_api_set_export_tests web_api_core_tests storage_package_replace_tests
            ctest --test-dir /tmp/esp32-p183-api --output-on-failure \
              -R '^(web_api_set_export|web_api_core|storage_package_replace)$'
            ./scripts/run-tests.sh web storage
          } 2>&1 | tee -a "${RUNNER_TEMP}/phase18-3-api.log"

      - name: Record API integration failure
        if: failure()
        shell: bash
        run: |
          {
            echo '# Phase 18.3 API integration failure'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/phase18-3-api.log" 2>/dev/null \
              || echo 'No captured log was available.'
            echo '```'
            echo
            echo '## Pending diff'
            echo
            echo '```diff'
            git diff -- . ':!docs/PHASE18_3_API_INTEGRATION_FAILURE.md'
            echo '```'
          } > docs/PHASE18_3_API_INTEGRATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_API_INTEGRATION_FAILURE.md
          git commit -m "ci: record Phase 18.3 API integration failure"
          git push origin HEAD:master

      - name: Commit validated API integration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/web_server/web_api_sets.c \
            firmware/components/web_server/web_api_core.c \
            firmware/components/web_server/web_server_api.c \
            tests/host/test_web_api_core.c \
            tests/host/test_web_api_set_export.c \
            tests/host/cmake/extra_tests.cmake
          git commit -m "feat(web): expose transactional set replacement"
          git push origin HEAD:master
