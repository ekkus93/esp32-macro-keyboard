name: One-shot clang-format repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-shot-clang-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master

      - name: Install clang-format
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format

      - name: Format first-party firmware sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(
            find firmware/main firmware/components firmware/test_app/main \
              -type f \( -name '*.c' -o -name '*.h' \) -print0 | sort -z
          )
          clang-format -i "${sources[@]}"
          rm -- .github/workflows/one-shot-clang-format.yml

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: apply clang-format to firmware sources"
          git push origin HEAD:master
