name: V2-040 Format Materializer

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v2-040-format-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install formatter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Format V2-040 setup contract sources
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i \
            firmware/components/app_contracts_v2/include/setup_contract_v2.h \
            firmware/components/app_contracts_v2/setup_contract_v2.c \
            tests/v2_contracts/test_setup_contract.c
          clang-format --dry-run --Werror \
            firmware/components/app_contracts_v2/include/setup_contract_v2.h \
            firmware/components/app_contracts_v2/setup_contract_v2.c \
            tests/v2_contracts/test_setup_contract.c
          git diff --check

      - name: Validate native V2 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-v2-contracts.sh --native-only

      - name: Commit formatter-only repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/app_contracts_v2/include/setup_contract_v2.h \
            firmware/components/app_contracts_v2/setup_contract_v2.c \
            tests/v2_contracts/test_setup_contract.c
          git rm .github/workflows/v2-040-format-materialize.yml
          expected=$(printf '%s\n' \
            '.github/workflows/v2-040-format-materialize.yml' \
            'firmware/components/app_contracts_v2/include/setup_contract_v2.h' \
            'firmware/components/app_contracts_v2/setup_contract_v2.c' \
            'tests/v2_contracts/test_setup_contract.c')
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git commit -m "Format V2-040 setup contract"
          git push origin HEAD:master
