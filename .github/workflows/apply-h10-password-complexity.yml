name: Apply H10 password complexity fix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-h10-password-complexity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELPER_B64: ""
      OLD_FN_B64: ""
      NEW_FN_B64: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply validated source refactor
        shell: bash
        run: |
          set -euo pipefail
          target="firmware/components/web_server/web_settings.c"
          test "$(git hash-object "${target}")" = "eef2baaf04bd58844cc8bd4f07b1d1caa7c71203"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("firmware/components/web_server/web_settings.c")
          text = path.read_text()
          old_fn = base64.b64decode(os.environ["OLD_FN_B64"]).decode()
          helper = base64.b64decode(os.environ["HELPER_B64"]).decode()
          new_fn = base64.b64decode(os.environ["NEW_FN_B64"]).decode()
          if not text.endswith(old_fn):
              raise SystemExit("authoritative password handler suffix did not match")
          path.write_text(text[:-len(old_fn)] + helper + new_fn)
          PY

          git diff --check
          test "$(git hash-object "${target}")" = "ba7b8a0bcf614c09352b79d8fc2beed9232f5a12"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git rm .github/workflows/apply-h10-password-complexity.yml
          git commit -m "fix: reduce password change handler complexity"
          git push origin HEAD:master
