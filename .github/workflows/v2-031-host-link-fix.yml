name: V2-031 Host Link Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add one-shot V2-031 host link fix'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Add missing filesystem implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/host/CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          old = (
              "    ../../firmware/components/storage/storage_blob_core.c\n"
              "    ../../firmware/components/storage/storage_blob_upload_core.c\n"
              ")\n"
              "target_include_directories(\n"
              "    storage_blob_upload_tests\n"
          )
          new = (
              "    ../../firmware/components/storage/storage_blob_core.c\n"
              "    ../../firmware/components/storage/storage_blob_upload_core.c\n"
              "    ../../firmware/components/storage/storage_fs_ops.c\n"
              ")\n"
              "target_include_directories(\n"
              "    storage_blob_upload_tests\n"
          )
          if text.count(old) != 1:
              raise SystemExit("upload target link block did not match exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/v2-031-host-link-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/host/CMakeLists.txt .github/workflows/v2-031-host-link-fix.yml
          git diff --cached --check
          git commit -m "Link V2-031 host filesystem operations"
          git push origin HEAD:master
