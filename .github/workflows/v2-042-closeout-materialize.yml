name: V2-042 Closeout Materializer

on:
  push:
    paths:
      - .github/workflows/v2-042-closeout-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Update V2-042 evidence and checklist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/TODO_V2.md")
          todo = todo_path.read_text(encoding="utf-8")
          old_block = """## V2-042 — Sessions and rate limiting

          - [ ] Generate session tokens with 32 random bytes of entropy.
          - [ ] Store at most eight sessions in bounded RAM.
          - [ ] Set `HttpOnly`, `SameSite=Strict`, and `Path=/` on the cookie.
          - [ ] Enforce 24-hour idle and seven-day absolute expiry.
          - [ ] Define deterministic behavior when the ninth session is created.
          - [ ] Enforce five failed logins within 60 seconds followed by a five-minute
                lockout.
          - [ ] Ensure rate-limit state is bounded and does not become a denial-of-service
                memory leak.
          - [ ] Test login, logout, expiry, lockout, session replacement, reboot, and cookie
                attributes.
          """
          new_block = old_block.replace("- [ ]", "- [x]")
          if todo.count(old_block) != 1:
              raise SystemExit("expected exactly one unchecked V2-042 block")
          todo_path.write_text(todo.replace(old_block, new_block), encoding="utf-8")

          report_path = Path("docs/implementation-v2/V2_042_SESSIONS_AND_RATE_LIMITING_2026-08-07.md")
          report = report_path.read_text(encoding="utf-8")
          report = report.replace(
              "**Status:** Software implementation candidate; final exact-SHA CI pending  ",
              "**Status:** Software implementation complete; physical Phase 4 evidence remains deferred  ",
              1,
          )
          marker = """A subsequent source review found a separate production failure window: with all eight slots full, LRU replacement cleared the selected session before random token generation. If entropy acquisition then failed, the new login failed while the old session was lost. Session creation now restores the pre-operation session table on any creation failure, and a regression proves the invariant.

          ## Commit trail
          """
          replacement = """A subsequent source review found a separate production failure window: with all eight slots full, LRU replacement cleared the selected session before random token generation. If entropy acquisition then failed, the new login failed while the old session was lost. Session creation now restores the pre-operation session table on any creation failure, and a regression proves the invariant.

          Quality then found two additional first-party defects without any gate suppression. On `d03835da56f90fb93cebac956bfb0edd90ea4402`, run `31198448498` rejected one non-canonical `clang-format` line in `auth_core_session.c`. The formatter-only repair was `ae7fc0875502b33f7e26d8b4b6944c0c092ebc0b`. On that SHA, Quality run `31199760339` progressed through formatting and rejected `allocate_entry(auth_core_t *, uint32_t, uint64_t)` under `bugprone-easily-swappable-parameters`. The internal helper now accepts the source address by pointer, making the adjacent argument types non-swappable without changing rate-limit semantics. That repair is `cd32bc8cf9a1fca313d2da7c0af7ae821e537b94`.

          ## Commit trail
          """
          if report.count(marker) != 1:
              raise SystemExit("V2-042 Ralph-loop marker drifted")
          report = report.replace(marker, replacement)

          trail_marker = """- `58dba47d30c001fece913c78a2c6775070998d6d` and `b101e4af7cbc8d20a89800a987d097f7d30a363a` — authoritative gate integration.

          ## Validation boundary
          """
          trail_replacement = """- `58dba47d30c001fece913c78a2c6775070998d6d` and `b101e4af7cbc8d20a89800a987d097f7d30a363a` — authoritative gate integration;
          - `d03835da56f90fb93cebac956bfb0edd90ea4402` — pin exact 32-byte token entropy and table-size drift protection;
          - `ae7fc0875502b33f7e26d8b4b6944c0c092ebc0b` — formatter-required session-core layout;
          - `cd32bc8cf9a1fca313d2da7c0af7ae821e537b94` — remove the Clang-Tidy swappable-integer helper API.

          ## Validation boundary
          """
          if report.count(trail_marker) != 1:
              raise SystemExit("V2-042 commit-trail marker drifted")
          report = report.replace(trail_marker, trail_replacement)

          validation_start = report.index("## Validation boundary\n")
          hardware_start = report.index("## Hardware-deferred boundary\n")
          final_validation = """## Validation boundary

          The final implementation code SHA `cd32bc8cf9a1fca313d2da7c0af7ae821e537b94` passed all four permanent workflows on that exact commit:

          - Browser Tests run `31200659221`: success;
          - Host Tests run `31200659173`: all five jobs success, including native tests, ASan/UBSan, native coverage, frontend tests, and frontend coverage;
          - Device Test Build run `31200659077`: success, including device-test source lint, ESP-IDF v5.5.5 installation, and ESP32-S3 device-test firmware compilation;
          - Quality run `31200658651`, job `92939572842`: success, including `Run authoritative checks`; the failed-quality artifact step was correctly skipped.

          No older or partial SHA is used as completion evidence. This closeout commit changes documentation/checklist state only; its own permanent CI must also pass before the Ralph-loop cycle is treated as settled.

          """
          report = report[:validation_start] + final_validation + report[hardware_start:]
          report = report.replace(
              "This is a software-completion candidate for V2-042 only. Until the final exact-SHA permanent CI gate passes, **V2-042 remains unchecked**. All hardware-dependent tasks elsewhere remain explicitly deferred.",
              "V2-042's software requirements are complete and the eight task items are checked. The Phase 4 exit gate remains open because the PBKDF2 hardware benchmark and other physical Phase 4 evidence are deliberately deferred. No hardware-dependent task is claimed complete.",
              1,
          )
          report_path.write_text(report, encoding="utf-8")
          PY

          python3 scripts/check-v2-auth-policy.py
          git diff --check
          git diff -- docs/TODO_V2.md docs/implementation-v2/V2_042_SESSIONS_AND_RATE_LIMITING_2026-08-07.md

      - name: Commit permanent closeout and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-042-closeout-materialize.yml
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add docs/TODO_V2.md docs/implementation-v2/V2_042_SESSIONS_AND_RATE_LIMITING_2026-08-07.md .github/workflows/v2-042-closeout-materialize.yml
          git diff --cached --check
          git commit -m "Close V2-042 software task"
          git push origin HEAD:master
