name: Phase 18.3 Normalized Fixture Capture

on:
  push:
    branches:
      - master
    paths:
      - .github/phase18-3-normalized-test-capture-trigger.txt

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
      - name: Generate normalized fixture
        shell: bash
        run: |
          python3 tools/phase18_3_package_replace_impl.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/host/test_storage_package_replace.c')
          text = path.read_text()
          text = text.replace(
              'storage_procedure_read(&procedure_identity, &procedure)',
              'storage_procedure_read(&procedure_identity.set_id, &procedure_identity.procedure_id, &procedure)',
              1,
          )
          text = text.replace(
              '        .scope = MACRO_SCOPE_SET,\n        .set_id = id,',
              '        .scope = MACRO_SCOPE_SET,\n        .has_set_id = true,\n        .set_id = id,',
              1,
          )
          path.write_text(text)
          PY
      - name: Publish fixture
        shell: bash
        run: |
          {
            echo '# Phase 18.3 normalized generated test'
            echo
            echo '```c'
            nl -ba tests/host/test_storage_package_replace.c
            echo '```'
          } > docs/PHASE18_3_NORMALIZED_TEST_DEBUG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_NORMALIZED_TEST_DEBUG.md
          git commit -m "ci: capture Phase 18.3 normalized fixture"
          git push origin HEAD:master
