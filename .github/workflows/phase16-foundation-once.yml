name: Validate Phase 16 HTTP foundation once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase16-foundation-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev \
            python3-pip
          python3 -m pip install --user cmakelang==0.6.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Register Phase 16 host tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/host/CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          marker = "# Phase 16 HTTP API foundation tests."
          if marker in text:
              raise SystemExit("Phase 16 host targets are already registered")
          addition = r'''

          # Phase 16 HTTP API foundation tests.
          add_executable(
              web_api_core_tests
              test_web_api_core.c
              ../../firmware/components/macro_model/app_error.c
              ../../firmware/components/macro_model/app_uuid.c
              ../../firmware/components/web_server/web_api_core.c
          )
          target_include_directories(
              web_api_core_tests
              PRIVATE ../../firmware/components/macro_model/include
                      ../../firmware/components/macro_parser/include
                      ../../firmware/components/macro_executor/include
                      ../../firmware/components/web_server
          )
          target_link_libraries(web_api_core_tests PRIVATE test_support)
          target_compile_options(web_api_core_tests PRIVATE ${STRICT_WARNINGS})
          add_test(NAME web_api_core COMMAND web_api_core_tests)
          set_tests_properties(web_api_core PROPERTIES LABELS "web")

          add_executable(
              web_request_policy_tests
              test_web_request_policy.c
              ../../firmware/components/macro_model/app_error.c
              ../../firmware/components/macro_model/app_uuid.c
              ../../firmware/components/web_server/web_api_core.c
              ../../firmware/components/web_server/web_request_policy.c
              ../../firmware/components/web_server/web_cookie.c
              ../../firmware/components/web_server/web_origin.c
          )
          target_include_directories(
              web_request_policy_tests
              PRIVATE ../../firmware/components/macro_model/include
                      ../../firmware/components/macro_parser/include
                      ../../firmware/components/macro_executor/include
                      ../../firmware/components/auth/include
                      ../../firmware/components/web_server
          )
          target_link_libraries(web_request_policy_tests PRIVATE test_support)
          target_compile_options(web_request_policy_tests PRIVATE ${STRICT_WARNINGS})
          add_test(NAME web_request_policy COMMAND web_request_policy_tests)
          set_tests_properties(web_request_policy PROPERTIES LABELS "web")

          add_executable(
              web_execution_submit_tests
              test_web_execution_submit.c
              ../../firmware/components/macro_model/app_error.c
              ../../firmware/components/macro_model/app_uuid.c
              ../../firmware/components/macro_model/macro_model.c
              ../../firmware/components/web_server/web_execution_submit.c
          )
          target_include_directories(
              web_execution_submit_tests
              PRIVATE ../../firmware/components/macro_model/include
                      ../../firmware/components/macro_parser/include
                      ../../firmware/components/macro_executor/include
                      ../../firmware/components/storage/include
                      ../../firmware/components/web_server
          )
          target_link_libraries(web_execution_submit_tests PRIVATE test_support)
          target_compile_options(web_execution_submit_tests PRIVATE ${STRICT_WARNINGS})
          add_test(NAME web_execution_submit COMMAND web_execution_submit_tests)
          set_tests_properties(web_execution_submit PROPERTIES LABELS "web")
          '''
          path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
          PY
          cmake-format -i tests/host/CMakeLists.txt

      - name: Run web host tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-tests.sh web 2>&1 | tee /tmp/phase16-web.log

      - name: Run web sanitizers
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-tests.sh --sanitizers web 2>&1 | tee /tmp/phase16-web-sanitizers.log

      - name: Commit validated host registration
        if: success()
        run: |
          set -euo pipefail
          rm -f docs/CI_PHASE16_FOUNDATION_FAILURE.md
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/host/CMakeLists.txt
          git commit -m "test(web): register Phase 16 foundation suites"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Publish exact failure tail
        if: failure()
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          {
            echo "# Phase 16 foundation validation failure"
            echo
            echo "## Normal web tests"
            echo
            echo '```text'
            if [[ -f /tmp/phase16-web.log ]]; then
              tail -n 250 /tmp/phase16-web.log
            fi
            echo '```'
            echo
            echo "## Sanitizer web tests"
            echo
            echo '```text'
            if [[ -f /tmp/phase16-web-sanitizers.log ]]; then
              tail -n 400 /tmp/phase16-web-sanitizers.log
            fi
            echo '```'
          } > docs/CI_PHASE16_FOUNDATION_FAILURE.md
          sed -i 's/[[:space:]]\+$//' docs/CI_PHASE16_FOUNDATION_FAILURE.md
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_PHASE16_FOUNDATION_FAILURE.md
          git commit -m "ci: record Phase 16 foundation failure"
          git push origin HEAD:master
          exit 1

# Retry after the transferred-plan fixture ownership fix.
