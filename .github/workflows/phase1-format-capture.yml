# One-shot formatting capture; remove before merging.
# This second commit intentionally triggers the branch-local workflow.
name: Phase 1 Format Capture

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          persist-credentials: false
          show-progress: false

      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format
          clang-format --version

      - name: Format failing Phase 1 files
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i \
            firmware/components/app_contracts_v2/device_settings_v2.c \
            firmware/components/app_contracts_v2/include/device_settings_v2.h \
            firmware/components/macro_parser/include/macro_parser.h \
            firmware/components/macro_parser/macro_parser_v2.c \
            tests/v2_contracts/test_device_settings.c \
            tests/v2_contracts/test_macro_conformance.c \
            tests/v2_contracts/test_setup_route_policy.c
          clang-format --dry-run --Werror \
            firmware/components/app_contracts_v2/device_settings_v2.c \
            firmware/components/app_contracts_v2/include/device_settings_v2.h \
            firmware/components/macro_parser/include/macro_parser.h \
            firmware/components/macro_parser/macro_parser_v2.c \
            tests/v2_contracts/test_device_settings.c \
            tests/v2_contracts/test_macro_conformance.c \
            tests/v2_contracts/test_setup_route_policy.c
          tar -czf "${RUNNER_TEMP}/phase1-formatted.tar.gz" \
            firmware/components/app_contracts_v2/device_settings_v2.c \
            firmware/components/app_contracts_v2/include/device_settings_v2.h \
            firmware/components/macro_parser/include/macro_parser.h \
            firmware/components/macro_parser/macro_parser_v2.c \
            tests/v2_contracts/test_device_settings.c \
            tests/v2_contracts/test_macro_conformance.c \
            tests/v2_contracts/test_setup_route_policy.c

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-formatted-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-formatted.tar.gz
          if-no-files-found: error
          retention-days: 1
