# One-shot formatting application; remove before merging.
name: Phase 1 Format Capture

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          show-progress: false

      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format
          clang-format --version

      - name: Format failing Phase 1 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            firmware/components/app_contracts_v2/device_settings_v2.c
            firmware/components/app_contracts_v2/include/device_settings_v2.h
            firmware/components/macro_parser/include/macro_parser.h
            firmware/components/macro_parser/macro_parser_v2.c
            tests/v2_contracts/test_device_settings.c
            tests/v2_contracts/test_macro_conformance.c
            tests/v2_contracts/test_setup_route_policy.c
          )
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
          mapfile -t changed_files < <(git diff --name-only)
          if [[ ${#changed_files[@]} -ne ${#files[@]} ]]; then
            printf 'Expected %d formatted files, found %d:\n' "${#files[@]}" "${#changed_files[@]}"
            printf '  %s\n' "${changed_files[@]}"
            exit 1
          fi
          for file in "${files[@]}"; do
            if ! printf '%s\n' "${changed_files[@]}" | grep -Fxq "$file"; then
              printf 'Missing expected formatted file: %s\n' "$file"
              exit 1
            fi
          done

      - name: Commit authoritative formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/app_contracts_v2/device_settings_v2.c \
            firmware/components/app_contracts_v2/include/device_settings_v2.h \
            firmware/components/macro_parser/include/macro_parser.h \
            firmware/components/macro_parser/macro_parser_v2.c \
            tests/v2_contracts/test_device_settings.c \
            tests/v2_contracts/test_macro_conformance.c \
            tests/v2_contracts/test_setup_route_policy.c
          git commit -m "Format Phase 1 contract sources"
          git push origin HEAD:phase1-ci-repair
