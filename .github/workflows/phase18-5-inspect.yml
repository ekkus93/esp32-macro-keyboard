name: Phase 18.5 finalizer

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase18-5-inspect.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master

      - name: Record completion and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md")
          text = todo.read_text()
          heading = "### 18.5 Secret scanner tests"
          start = text.index(heading)
          end = text.index("\n## 19.", start)
          section = text[start:end]
          for label in (
              "set export;",
              "full backup;",
              "diagnostics;",
              "logs;",
              "frontend persisted state.",
          ):
              section = section.replace(f"- [ ] {label}", f"- [x] {label}")
          note = (
              "\n**Implemented:** `scripts/check-secret-sentinel.py` scans generated artifacts for "
              "raw, JSON-escaped, URL-encoded, base64, base64url, and hexadecimal forms without "
              "printing secret material. `tests/scripts/test-secret-sentinel.py` generates a fresh "
              "sentinel and exercises set-export, full-backup, diagnostics, application-log, and "
              "frontend-persisted-state boundaries, including deliberate leak failures. Production "
              "set-export and full-backup host tests also keep a sentinel resident in the test process "
              "and assert it is absent from serialized output.\n"
          )
          if "**Implemented:** `scripts/check-secret-sentinel.py`" not in section:
              section += note
          todo.write_text(text[:start] + section + text[end:])

          progress = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md")
          progress_text = progress.read_text()
          entry = """

## Phase 18.5 — secret sentinel scanner

**Status:** Complete for software validation; physical-device validation remains deferred by operator direction.

**Implementation commit:** `5ae1aeb208716dc72679d3bf36bf4e56d4e5b627`

Implemented:

- reusable fail-closed scanner for raw, JSON-escaped, URL-encoded, base64, base64url, and hexadecimal representations;
- generated-sentinel regression coverage for set exports, full backups, diagnostics, application logs, and frontend persisted state;
- failure-output assertions proving scanner diagnostics do not echo the secret or its encoded representation;
- production host assertions that set-export and full-backup serialization exclude a resident secret sentinel;
- automatic execution through `scripts/check-scripts.sh`.

Validation evidence:

- focused scanner regression passed in the implementation workflow before commit;
- permanent Host Tests matrix run `30621753634` passed all five jobs on the implementation workflow commit, including Host Tests, Host ASan and UBSan, Native Coverage, Frontend Tests, and Frontend Coverage;
- Quality validation is required on the final clean Phase 18.5 SHA;
- physical device tests are intentionally deferred and are not claimed as passed.

Deviations:

- none for Phase 18.5 software scope;
- hardware/device validation remains unchecked by explicit operator instruction.
"""
          if "## Phase 18.5 — secret sentinel scanner" not in progress_text:
              progress.write_text(progress_text.rstrip() + entry + "\n")
          PY
          rm -f docs/PHASE18_5_INSPECTION.txt docs/PHASE18_5_IMPLEMENTATION_SURFACES.txt
          rm -f .github/workflows/phase18-5-inspect.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: complete Phase 18.5 secret sentinel tests"
          git push origin HEAD:master
