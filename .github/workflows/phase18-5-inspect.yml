name: Phase 18.5 inspection

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase18-5-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master

      - name: Collect Phase 18.5 surfaces
        shell: bash
        run: |
          set -euo pipefail
          report=docs/PHASE18_5_INSPECTION.txt
          {
            echo '=== FILES ==='
            find tests webapp/src firmware/components scripts -type f | sort
            echo
            echo '=== SURFACES ==='
            grep -RInE 'localStorage|sessionStorage|persist|diagnostic|credential|password|secret|token|cookie|log_event|export_set|export_backup' \
              tests webapp/src firmware/components scripts || true
          } > "$report"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git diff --cached --check
          git commit -m "docs: capture Phase 18.5 inspection surfaces"
          git push origin HEAD:master
