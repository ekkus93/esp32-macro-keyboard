name: Phase 18.5 inspection

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase18-5-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master

      - name: Capture implementation surfaces
        shell: bash
        run: |
          set -euo pipefail
          report=docs/PHASE18_5_IMPLEMENTATION_SURFACES.txt
          : > "$report"
          files=(
            tests/host/test_storage_package_export.c
            tests/host/test_storage_package_backup.c
            tests/host/test_app_core.c
            tests/host/test_web_api_admin_boundary.c
            scripts/check-credential-logging.sh
            tests/scripts/test-check-credential-logging.sh
            scripts/check-scripts.sh
            webapp/package.json
          )
          while IFS= read -r path; do files+=("$path"); done < <(find webapp -type f \( -name '*test*' -o -name '*spec*' \) | sort)
          for path in "${files[@]}"; do
            [[ -f "$path" ]] || continue
            printf '\n===== %s =====\n' "$path" >> "$report"
            cat "$path" >> "$report"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git diff --cached --check
          git commit -m "docs: capture Phase 18.5 implementation surfaces"
          git push origin HEAD:master
