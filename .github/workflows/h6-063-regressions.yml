name: H6-063 Regression Validator

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/h6-063-regressions.yml"

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang-format cmake libcjson-dev

      - name: Apply H6-063 regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_h6_063_patch.py code
          clang-format -i tests/host/test_web_server_async_results.c
          git diff --check

      - name: Run web host tests
        shell: bash
        run: ./scripts/run-tests.sh web

      - name: Run web host tests with ASan and UBSan
        shell: bash
        run: ./scripts/run-tests.sh --sanitizers web

      - name: Commit validated H6-063 regressions
        shell: bash
        run: |
          set -euo pipefail
          git add tests/host/test_web_server_async_results.c tests/host/CMakeLists.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(web): close H6-063 async regressions"
          git rev-parse HEAD > "$RUNNER_TEMP/h6-063-product-sha"
          git push origin HEAD:master

      - name: Record H6-063 evidence and close H6
        shell: bash
        run: |
          set -euo pipefail
          export PRODUCT_SHA="$(cat "$RUNNER_TEMP/h6-063-product-sha")"
          python3 scripts/tmp_h6_063_patch.py docs
          git rm .github/workflows/h6-063-regressions.yml scripts/tmp_h6_063_patch.py
          git add docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md docs/implementation-v2/H6_063_ASYNC_REGRESSION_MATRIX_2026-08-11.md
          git diff --cached --check
          git commit -m "docs: record H6-063 and close H6"
          git push origin HEAD:master
