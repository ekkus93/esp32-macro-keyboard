name: H6-063 Regression Validator

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/h6-063-regressions.yml"

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang-format cmake libcjson-dev

      - name: Add H6-063 bounded-stop and responsiveness regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/host/test_web_server_async_results.c")
          text = path.read_text()

          text = text.replace(
              "/* Worker-capable host regression for H6-062.\n",
              "/* Worker-capable host regression for H6-062/H6-063.\n",
              1,
