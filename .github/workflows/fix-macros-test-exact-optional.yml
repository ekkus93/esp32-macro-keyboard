name: Apply Macros test exact-optional fix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-macros-test-exact-optional.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply exact optional-property fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("webapp/tests/v2-macros-page.test.tsx")
          text = path.read_text(encoding="utf-8")
          old = """    <MacrosPage\n      dependencies={options.dependencies}\n      initialSend={options.initialSend ?? null}\n"""
          new = """    <MacrosPage\n      {...(options.dependencies === undefined\n        ? {}\n        : { dependencies: options.dependencies })}\n      initialSend={options.initialSend ?? null}\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one render-helper anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- webapp/tests/v2-macros-page.test.tsx
          git rm .github/workflows/fix-macros-test-exact-optional.yml
          git add webapp/tests/v2-macros-page.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(webapp): omit undefined macro dependencies prop"
          git push origin HEAD:master
