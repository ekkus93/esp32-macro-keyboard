name: H9 Targeted Correction 4

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/h9-fix4.yml"

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install host-test dependency
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev

      - name: Apply H9 corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_h9_patch.py
          python3 scripts/tmp_h9_patch2.py
          python3 scripts/tmp_h9_patch3.py
          python3 scripts/tmp_h9_patch4.py
          clang-format -i \
            firmware/components/app_core/app_core.c \
            firmware/components/app_core/app_core_sequence.c \
            firmware/components/web_server/web_server_lifecycle.c \
            firmware/components/web_server/web_server_adapter_lifecycle.c \
            firmware/components/web_server/web_send.h \
            firmware/components/web_server/web_send.c \
            firmware/components/web_server/web_server_send.c \
            tests/host/test_web_server_adapter_stream_lifecycle.inc \
            tests/host/test_web_send.c \
            tests/host/test_web_server_send_route.c \
            tests/host/support/test_assert.c \
            tests/host/support/test_assert.h
          npm --prefix webapp ci --ignore-scripts --no-audit --no-fund
          (cd webapp && npx prettier --write tests/v2-browser-storage-prohibition.test.tsx)
          git diff --check

      - name: Validate H9 guards
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-credential-logging.sh firmware
          bash tests/scripts/test-check-credential-logging.sh
          python3 scripts/check-h9-architecture.py
          python3 scripts/check-v2-phase2-architecture.py
          bash scripts/check-scripts.sh
          git diff --check

      - name: Validate host behavior
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-tests.sh web
          ./scripts/run-tests.sh startup
          ./scripts/run-tests.sh --sanitizers web
          ./scripts/run-tests.sh --sanitizers startup

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix webapp run format:check
          npm --prefix webapp run typecheck
          npm --prefix webapp run lint
          npm --prefix webapp run stylelint
          npm --prefix webapp run test
          npm --prefix webapp run build
          git diff --check

      - name: Commit H9 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/app_core/app_core.c \
            firmware/components/app_core/app_core_sequence.c \
            firmware/components/web_server/web_server_lifecycle.c \
            firmware/components/web_server/web_server_adapter_lifecycle.c \
            firmware/components/web_server/web_send.h \
            firmware/components/web_server/web_send.c \
            firmware/components/web_server/web_server_send.c \
            tests/host/CMakeLists.txt \
            tests/host/test_web_server_adapter_stream_lifecycle.inc \
            tests/host/test_web_send.c \
            tests/host/test_web_server_send_route.c \
            tests/host/support/test_assert.c \
            tests/host/support/test_assert.h \
            scripts/check-credential-logging.sh \
            tests/scripts/test-check-credential-logging.sh \
            scripts/check-h9-architecture.py \
            scripts/check-scripts.sh \
            webapp/tests/v2-browser-storage-prohibition.test.tsx
          git diff --cached --check
          git commit -m "fix: close H9 silent safety gaps"
          git push origin HEAD:master
