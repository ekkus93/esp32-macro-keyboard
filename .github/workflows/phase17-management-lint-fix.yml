name: Phase 17 management lint corrections

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.repository == 'ekkus93/esp32-macro-keyboard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/code-review-fixes-readable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install pinned frontend tooling
        working-directory: webapp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove impossible acknowledgement checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("webapp/src/features/settings/SettingsPage.tsx")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''          const accepted = await restartDevice();
                    if (!accepted.restartScheduled) {
                      throw new Error(
                        "The device did not confirm the scheduled restart.",
                      );
                    }
          ''',
                  '''          await restartDevice();
          ''',
              ),
              (
                  '''          const accepted = await factoryResetDevice();
                    if (!accepted.factoryReset || !accepted.restartScheduled) {
                      throw new Error(
                        "The device returned an incomplete factory-reset acknowledgement.",
                      );
                    }
          ''',
                  '''          await factoryResetDevice();
          ''',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected one acknowledgement block, found {text.count(old)}")
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit("expected acknowledgement block not found")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply project lint fixes and formatting
        working-directory: webapp
        run: |
          npx eslint --fix tests/set-management.test.tsx
          npx prettier --write \
            eslint.config.js \
            package.json \
            src/features/settings/PackageOperationsPage.tsx \
            src/features/settings/SettingsPage.tsx \
            tests/app-routing.test.tsx \
            tests/browser/run-browser-tests.mjs \
            tests/management-api.test.ts \
            tests/management-screens.test.tsx \
            tests/set-management.test.tsx

      - name: Verify exact scope and frontend static gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          (
            cd webapp
            npm run typecheck
            npm run lint
            npm run stylelint
            npm run format:check
          )
          readonly allowed_file="${RUNNER_TEMP}/allowed-files.txt"
          cat > "${allowed_file}" <<'EOF'
          webapp/eslint.config.js
          webapp/package.json
          webapp/src/features/settings/PackageOperationsPage.tsx
          webapp/src/features/settings/SettingsPage.tsx
          webapp/tests/app-routing.test.tsx
          webapp/tests/browser/run-browser-tests.mjs
          webapp/tests/management-api.test.ts
          webapp/tests/management-screens.test.tsx
          webapp/tests/set-management.test.tsx
          EOF
          while IFS= read -r changed; do
            grep -Fx -- "${changed}" "${allowed_file}" >/dev/null || {
              printf 'error: unexpected lint-fix file: %s\n' "${changed}" >&2
              exit 1
            }
          done < <(git diff --name-only)

      - name: Commit reviewed lint corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Lint corrections already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- webapp
          git commit -m "style(web): satisfy management static gates"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
