name: V2-033 Runner

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-033-run.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libcjson-dev clang-format

      - name: Extract and run implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/v2-033-implement.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/v2-033-implement.py').write_text(script + '\n')
          PY
          python3 /tmp/v2-033-implement.py

          clang-format -i \
            firmware/components/storage/include/storage_blob.h \
            firmware/components/storage/storage_blob_internal.h \
            firmware/components/storage/storage_blob_recovery.c \
            firmware/components/storage/storage_blob_core.c \
            firmware/components/storage/storage_blob.c \
            firmware/components/storage/storage_mount_topology.c \
            firmware/components/web_server/include/web_diagnostics.h \
            firmware/components/web_server/web_server_diagnostics.c \
            firmware/components/web_server/web_server_adapter_json.c \
            tests/host/test_storage_mount.c \
            tests/host/test_storage_blob.c \
            tests/host/test_web_server_adapter_diagnostics_json.inc

      - name: Run host validation
        run: |
          set -o pipefail
          ./scripts/run-tests.sh

      - name: Verify scope and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-033-implement.yml
          rm .github/workflows/v2-033-run.yml
          git diff --check
          git status --short

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Implement V2-033 boot recovery and diagnostics"
          git push origin HEAD:master
