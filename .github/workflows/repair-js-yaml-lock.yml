name: Repair js-yaml lockfile

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/repair-js-yaml-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Update patched js-yaml lock entry
        working-directory: webapp
        shell: bash
        run: |
          set -euo pipefail
          npm update js-yaml --package-lock-only --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const entry = lock.packages['node_modules/js-yaml'];
          if (!entry || entry.version !== '4.3.1') {
            throw new Error(`expected node_modules/js-yaml 4.3.1, got ${entry?.version}`);
          }
          NODE
          npm ci
          npm run audit:ci

      - name: Commit lockfile repair
        shell: bash
        run: |
          set -euo pipefail
          git add webapp/package-lock.json
          if git diff --cached --quiet; then
            echo 'Expected package-lock.json to change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update js-yaml to 4.3.1'
          git push origin HEAD:master
