name: Fix storage quality once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-storage-quality-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install host lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user \
            cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Apply storage quality fixes
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/fix.py
          python3 /tmp/fix.py
          clang-format -i \
            firmware/components/storage/storage_paths.c \
            firmware/components/storage/storage_json.c \
            firmware/components/storage/storage_repository_order.h \
            firmware/components/storage/storage_repository_order.c \
            firmware/components/storage/storage_repository_procedures.c \
            firmware/components/storage/storage_repository_macros.c \
            firmware/components/storage/storage_repository_objects_json.c \
            firmware/components/storage/storage_repository_objects_json.h \
            firmware/components/storage/storage_atomic_validators.c \
            tests/host/test_storage_object_json.c
          rm -- ".github/workflows/fix-storage-quality-once.yml"

      - name: Run authoritative checks
        shell: bash
        run: |
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh

      - name: Commit directly to master
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(storage): resolve authoritative quality findings"
          git push origin HEAD:master
