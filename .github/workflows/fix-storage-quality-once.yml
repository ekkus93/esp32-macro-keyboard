name: Fix storage quality once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-storage-quality-once.yml"
      - "scripts/fix-storage-quality-once.py"

permissions:
  contents: write

concurrency:
  group: fix-storage-quality-once
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install host lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user \
            cmakelang==0.6.13 yamllint==1.38.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Apply and format storage fixes
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/fix-storage-quality-once.py 2>&1 | tee /tmp/apply.log
          status=${PIPESTATUS[0]}
          if [[ "${status}" -eq 0 ]]; then
            clang-format -i \
              firmware/components/storage/storage_paths.c \
              firmware/components/storage/storage_json.c \
              firmware/components/storage/storage_repository_order.h \
              firmware/components/storage/storage_repository_order.c \
              firmware/components/storage/storage_repository_procedures.c \
              firmware/components/storage/storage_repository_macros.c \
              firmware/components/storage/storage_repository_objects_json.c \
              firmware/components/storage/storage_repository_objects_json.h \
              firmware/components/storage/storage_atomic_validators.c \
              tests/host/test_storage_object_json.c \
              2>&1 | tee -a /tmp/apply.log
            status=${PIPESTATUS[0]}
          fi
          if [[ "${status}" -eq 0 ]]; then
            rm -f \
              .github/workflows/fix-storage-quality-once.yml \
              scripts/fix-storage-quality-once.py \
              docs/CI_STORAGE_QUALITY_FAILURE.md
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Run authoritative checks
        id: quality
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          ./scripts/check-all.sh 2>&1 | tee /tmp/check-all.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Commit passing fix directly to master
        if: steps.apply.outcome == 'success' && steps.quality.outcome == 'success'
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(storage): resolve authoritative quality findings"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Publish failure diagnostic
        if: >-
          always() &&
          (steps.apply.outcome != 'success' || steps.quality.outcome != 'success')
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --hard origin/master
          mkdir -p docs
          {
            echo "# Storage quality fixer failure"
            echo
            echo "Apply outcome: ${{ steps.apply.outcome }}"
            echo "Apply status: ${{ steps.apply.outputs.status }}"
            echo "Quality outcome: ${{ steps.quality.outcome }}"
            echo "Quality status: ${{ steps.quality.outputs.status }}"
            echo
            echo "## Apply log"
            echo
            echo '```text'
            tail -n 300 /tmp/apply.log 2>/dev/null || true
            echo '```'
            echo
            echo "## Authoritative-check log"
            echo
            echo '```text'
            tail -n 500 /tmp/check-all.log 2>/dev/null || true
            echo '```'
          } > docs/CI_STORAGE_QUALITY_FAILURE.md
          git add docs/CI_STORAGE_QUALITY_FAILURE.md
          git commit -m "ci: record storage quality fixer failure"
          git push origin HEAD:master
          exit 1
