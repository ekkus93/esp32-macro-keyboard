# One-shot CMake environment diagnostic; remove before merging.
name: Phase 1 CMake Format

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          persist-credentials: false
          show-progress: false

      - name: Install Quality toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user cmakelang==0.6.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./scripts/install-esp-idf.sh

      - name: Compare CMake tools before and after ESP-IDF activation
        shell: bash
        run: |
          set -uo pipefail
          files=(
            firmware/components/app_contracts_v2/CMakeLists.txt
            tests/v2_contracts/CMakeLists.txt
          )

          echo '=== Before ESP-IDF activation ==='
          printf 'PATH=%s\n' "$PATH"
          command -v cmake-format || true
          command -v cmake-lint || true
          cmake-format --version || true
          cmake-format --check "${files[@]}"
          echo "pre-activation format status: $?"
          cmake-lint "${files[@]}"
          echo "pre-activation lint status: $?"

          . "$HOME/esp/esp-idf-v5.5.5/export.sh"

          echo '=== After ESP-IDF activation ==='
          printf 'PATH=%s\n' "$PATH"
          command -v cmake-format || true
          command -v cmake-lint || true
          cmake-format --version || true
          cmake-format --check "${files[@]}"
          echo "post-activation format status: $?"
          cmake-lint "${files[@]}"
          echo "post-activation lint status: $?"

          echo '=== Explicit pinned executables after activation ==='
          "$HOME/.local/bin/cmake-format" --version || true
          "$HOME/.local/bin/cmake-format" --check "${files[@]}"
          echo "explicit format status: $?"
          "$HOME/.local/bin/cmake-lint" "${files[@]}"
          echo "explicit lint status: $?"
          exit 1
