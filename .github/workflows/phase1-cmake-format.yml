# One-shot exact CMake check diagnostic; remove before merging.
name: Phase 1 CMake Format

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          persist-credentials: false
          show-progress: false

      - name: Install Quality toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format jq shellcheck
          python3 -m pip install --user cmakelang==0.6.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./scripts/install-esp-idf.sh

      - name: Reproduce exact CMake check
        shell: bash
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/cmake-exact-check.txt"
          . "$HOME/esp/esp-idf-v5.5.5/export.sh" >/tmp/idf-export.out 2>&1

          mapfile -t cmake_files < <(find firmware tests \
            -type d \( -name managed_components -o -name 'build*' \) -prune -o \
            -type f -name 'CMakeLists.txt' -print | sort)

          {
            printf 'cmake_format=%s\n' "$(command -v cmake-format || true)"
            cmake-format --version 2>&1 || true
            printf 'file_count=%d\n' "${#cmake_files[@]}"
            printf 'file=%s\n' "${cmake_files[@]}"

            cmake-format --check "${cmake_files[@]}" >/tmp/all-format.out 2>&1
            printf 'all_format_status=%s\n' "$?"
            cat /tmp/all-format.out

            cmake-lint "${cmake_files[@]}" >/tmp/all-lint.out 2>&1
            printf 'all_lint_status=%s\n' "$?"
            cat /tmp/all-lint.out

            target_files=(
              firmware/components/app_contracts_v2/CMakeLists.txt
              tests/v2_contracts/CMakeLists.txt
            )
            cmake-format --check "${target_files[@]}" >/tmp/target-format.out 2>&1
            printf 'target_format_status=%s\n' "$?"
            cat /tmp/target-format.out
          } > "$report"
          cat "$report"

      - name: Upload compact diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-cmake-exact-${{ github.run_id }}
          path: ${{ runner.temp }}/cmake-exact-check.txt
          if-no-files-found: error
          retention-days: 1
