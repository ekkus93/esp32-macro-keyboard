# One-shot CMake diagnostic; remove before merging.
name: Phase 1 CMake Format

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase1-ci-repair
          persist-credentials: false
          show-progress: false

      - name: Install pinned CMake tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user cmakelang==0.6.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Diagnose CMake checks
        shell: bash
        run: |
          set -uo pipefail
          files=(
            firmware/components/app_contracts_v2/CMakeLists.txt
            tests/v2_contracts/CMakeLists.txt
          )
          for file in "${files[@]}"; do
            echo "=== ${file}: cmake-format --check ==="
            "$HOME/.local/bin/cmake-format" --check "$file"
            echo "cmake-format status: $?"

            echo "=== ${file}: rendered diff ==="
            "$HOME/.local/bin/cmake-format" "$file" > "${RUNNER_TEMP}/formatted.cmake"
            diff -u "$file" "${RUNNER_TEMP}/formatted.cmake"
            echo "rendered diff status: $?"

            echo "=== ${file}: cmake-lint ==="
            "$HOME/.local/bin/cmake-lint" "$file"
            echo "cmake-lint status: $?"
          done
          exit 1
