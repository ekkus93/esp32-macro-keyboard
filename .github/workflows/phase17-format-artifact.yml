name: Phase 17 formatting artifact

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/code-review-fixes-readable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format the two reported files
        working-directory: webapp
        run: >-
          npx prettier --write
          src/features/execution/ConfirmExecutionPage.tsx
          tests/routing-confirmation.test.ts

      - name: Stage formatting artifact
        shell: bash
        run: |
          set -euo pipefail
          readonly output="artifacts/phase17-format/webapp"
          mkdir -p "${output}/src/features/execution" "${output}/tests"
          cp -- webapp/src/features/execution/ConfirmExecutionPage.tsx \
            "${output}/src/features/execution/"
          cp -- webapp/tests/routing-confirmation.test.ts "${output}/tests/"

      - name: Upload formatting artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase17-format-${{ github.event.pull_request.head.sha }}
          path: artifacts/phase17-format/
          if-no-files-found: error
          retention-days: 1
