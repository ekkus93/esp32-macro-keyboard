name: Code review fixes audit once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/code-review-fixes-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: webapp
        run: npm ci
      - name: Persist npm audit findings without masking status
        shell: bash
        run: |
          set -euo pipefail
          cd webapp
          set +e
          npm audit --json > audit.json
          status=$?
          set -e
          cd ..
          mkdir -p docs/review-source
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          report = json.loads(Path("webapp/audit.json").read_text(encoding="utf-8"))
          metadata = report.get("metadata", {})
          counts = metadata.get("vulnerabilities", {})
          vulnerabilities = report.get("vulnerabilities", {})
          lines = [
              "# Frontend npm audit diagnostic",
              "",
              f"**Generated:** {date.today().isoformat()}",
              "",
              "**Scope:** the exact committed `webapp/package-lock.json`; this is a diagnostic",
              "input for the code-review fixes Ralph loop, not an accepted-risk waiver.",
              "",
              "## Summary",
              "",
              f"- Info: {counts.get('info', 0)}",
              f"- Low: {counts.get('low', 0)}",
              f"- Moderate: {counts.get('moderate', 0)}",
              f"- High: {counts.get('high', 0)}",
              f"- Critical: {counts.get('critical', 0)}",
              f"- Total: {counts.get('total', 0)}",
              "",
              "## Findings",
              "",
          ]
          for name in sorted(vulnerabilities):
              item = vulnerabilities[name]
              lines.extend([
                  f"### `{name}`",
                  "",
                  f"- Severity: `{item.get('severity')}`",
                  f"- Direct dependency: `{str(bool(item.get('isDirect'))).lower()}`",
                  f"- Affected range: `{item.get('range')}`",
                  f"- Installed nodes: `{', '.join(item.get('nodes', []))}`",
                  f"- Fix available: `{json.dumps(item.get('fixAvailable'), sort_keys=True)}`",
                  "- Via:",
              ])
              for entry in item.get("via", []):
                  if isinstance(entry, dict):
                      title = entry.get("title") or entry.get("name") or entry.get("source")
                      lines.append(
                          f"  - `{entry.get('severity')}` — {title}; range `{entry.get('range')}`; "
                          f"source `{entry.get('source')}`"
                      )
                  else:
                      lines.append(f"  - transitive through `{entry}`")
              lines.append("")
          lines.extend([
              "## Policy",
              "",
              "This report must be regenerated after intentional dependency updates. Do not use",
              "`npm audit fix --force` as a substitute for reviewing compatibility and the",
              "resulting lockfile diff.",
              "",
          ])
          Path("docs/review-source/ESP32_MACRO_KEYBOARD_NPM_AUDIT_2026-07-28.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          PY
          rm -f webapp/audit.json
          git rm .github/workflows/code-review-fixes-audit-once.yml
          git add docs/review-source/ESP32_MACRO_KEYBOARD_NPM_AUDIT_2026-07-28.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record frontend audit findings"
          git push origin HEAD:master
          exit "${status}"
