name: H2 software closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/h2-software-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '8343bd6e3f2fcf1392d334ece422c8bb7c42711c'
          test "$(git hash-object tests/host/test_web_change_password_transaction.c)" = \
            'b670ecf15b1d12f44d698ebe3618ef0fc810831e'

          git fetch origin h2-lockout-proof h2-checklist-finalizer
          git show origin/h2-lockout-proof:.github/h2-lockout-proof.patch > /tmp/h2-lockout.patch
          git apply --check /tmp/h2-lockout.patch
          git apply /tmp/h2-lockout.patch

          : > /tmp/h2-checklist.patch
          for part in part-00.patch part-01.patch part-02.patch; do
            git show "origin/h2-checklist-finalizer:.github/h2-checklist/${part}" >> /tmp/h2-checklist.patch
          done
          printf '%s  %s\n' \
            'ae4b25b671c5acedd06c399f6674141eaecc74571d38f4693df5c82ae4b9573b' \
            /tmp/h2-checklist.patch | sha256sum -c -
          git apply --check /tmp/h2-checklist.patch
          git apply /tmp/h2-checklist.patch

          python3 - <<'PY'
          from pathlib import Path

          todo = Path('docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md')
          text = todo.read_text()
          old = '- Evidence (2026-08-11): the real-auth-core integration test proves old password rejection, immediate new-password acceptance, invalidation of both pre-existing sessions, and normal idle/absolute TTL for a newly created session after the success path.'
          new = '- Evidence (2026-08-11): the real-auth-core integration test proves old password rejection, immediate new-password acceptance, invalidation of both pre-existing sessions, normal idle/absolute TTL, and the normal five-failure/300-second login lockout after the success path.'
          assert old in text
          text = text.replace(old, new, 1)
          todo.write_text(text)

          evidence = Path('docs/implementation-v2/H2_PASSWORD_CHANGE_ATOMICITY_2026-08-11.md')
          text = evidence.read_text()
          old = '- a newly created session works and retains the normal idle and absolute expiry values.'
          new = '- a newly created session works and retains the normal idle and absolute expiry values;\n- immediately afterward the normal five-failure login threshold produces the expected 300-second lockout.'
          assert old in text
          evidence.write_text(text.replace(old, new, 1))

          section = todo.read_text().split('## Phase H2 — Password-change atomicity and authentication coherence', 1)[1].split('\n---\n\n## Phase H3', 1)[0]
          pre_hw, hw = section.split('### H2-024 — Hardware validation', 1)
          assert '- [ ]' not in pre_hw
          assert hw.count('- [ ]') == 5, hw
          assert '- [ ] Host/sanitizer/hardware evidence is committed.' in hw
          PY

          grep -F 'AUTH_RATE_LIMIT_FAILURE_MAX' tests/host/test_web_change_password_transaction.c
          grep -F 'TEST_CHECK_EQ_U64(300U, retry_after_seconds);' tests/host/test_web_change_password_transaction.c
          python3 scripts/check-h2-architecture.py
          git diff --check

          rm -f .github/workflows/h2-software-closeout.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test/docs: complete H2 software evidence'
          git push origin HEAD:master
