name: Inspect Phase 15 patch log once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-phase15-patch-log-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download patch job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/90224412993/logs" \
            --output /tmp/patch-job.log
          mkdir -p docs
          {
            echo "# Phase 15 generator patch failure tail"
            echo
            echo '```text'
            tail -n 160 /tmp/patch-job.log
            echo '```'
          } > docs/CI_PHASE15_PATCH_FAILURE.md
      - name: Publish log and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-phase15-patch-log-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: capture Phase 15 generator patch failure"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
