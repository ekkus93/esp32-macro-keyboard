name: H9 Final Mechanical Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/h9-final-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run permanent H9 guards
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-credential-logging.sh firmware
          bash tests/scripts/test-check-credential-logging.sh
          python3 scripts/check-h9-architecture.py
          python3 scripts/check-v2-phase2-architecture.py

      - name: Final mechanical classification inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("firmware/components"), Path("firmware/main"), Path("webapp/src")]
          production = []
          for root in roots:
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix in {".c", ".h", ".ts", ".tsx", ".js", ".jsx"}:
                      production.append(p)

          def emit(title, predicate):
              print(f"\n===== {title} =====")
              count = 0
              for p in sorted(production):
                  for n, line in enumerate(p.read_text(errors="replace").splitlines(), 1):
                      if predicate(line):
                          print(f"{p}:{n}:{line.strip()}")
                          count += 1
              print(f"COUNT={count}")

          emit("EMPTY_CATCH", lambda s: bool(re.search(r"catch\s*(?:\([^)]*\))?\s*\{\s*\}", s)))
          emit("PROMISE_EMPTY_CATCH", lambda s: bool(re.search(r"\.catch\s*\(\s*\(.*?\)\s*=>\s*\{\s*\}\s*\)", s)))
          emit("VOID_DISCARD", lambda s: "(void)" in s)
          emit("BEST_EFFORT", lambda s: "best-effort" in s.lower() or "best effort" in s.lower())
          emit("FALLBACK", lambda s: "fallback" in s.lower())
          emit("STALE_RETRY", lambda s: any(x in s.lower() for x in ("stale", "consecutive failure", "retry", "poll failure", "polling")))
          emit("CLEANUP_REPLACEMENT", lambda s: "cleanup" in s.lower() and any(x in s.lower() for x in ("error", "result", "primary", "replace", "overwrite")))
          emit("SENSITIVE_OUTPUT", lambda s: (
              any(x in s for x in ("ESP_LOG", "printf(", "fprintf(", "console."))
              and any(x in s.lower() for x in ("password", "passphrase", "setup_code", "setup code", "session_token", "session token", "salt", "verifier"))
          ))

          # Final fail-closed invariants for classes that must have zero hits.
          empty_catches = []
          for p in production:
              text = p.read_text(errors="replace")
              if re.search(r"catch\s*(?:\([^)]*\))?\s*\{\s*\}", text):
                  empty_catches.append(str(p))
              if re.search(r"\.catch\s*\(\s*\(.*?\)\s*=>\s*\{\s*\}\s*\)", text, re.DOTALL):
                  empty_catches.append(str(p))
          if empty_catches:
              raise SystemExit(f"unclassified empty catch remains: {sorted(set(empty_catches))}")
          PY
