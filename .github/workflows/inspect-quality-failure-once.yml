name: Inspect quality failure once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-quality-failure-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download failed quality job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/90217849602/logs" \
            --output /tmp/quality-job.log
          mkdir -p docs
          {
            echo "# Quality run 30341464821 failure tail"
            echo
            echo '```text'
            tail -n 1200 /tmp/quality-job.log
            echo '```'
          } > docs/CI_QUALITY_30341464821_FAILURE.md
      - name: Publish diagnostic and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-quality-failure-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: capture quality run 30341464821 failure"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
