name: Phase 18.2 Repair

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase18-2-repair.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: phase18-2-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Set up required Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install test and format dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang-format \
            cmake \
            libcjson-dev
          cd webapp
          npm ci

      - name: Repair exact Phase 18.2 regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repository_handlers = Path("tests/host/test_web_api_repository_handlers.c")
          text = repository_handlers.read_text(encoding="utf-8")
          obsolete_route = "        WEB_API_ROUTE_SET_EXPORT,\n"
          if text.count(obsolete_route) != 1:
              raise SystemExit("obsolete export-boundary route anchor was not unique")
          repository_handlers.write_text(
              text.replace(obsolete_route, ""), encoding="utf-8"
          )

          export_test = Path("tests/host/test_web_api_set_export.c")
          text = export_test.read_text(encoding="utf-8")
          opening = "int main(void) {\n    reset_store();"
          opening_replacement = (
              "int main(void) {\n"
              "    TEST_CHECK_APP_ERROR(APP_ERROR_NONE, storage_repository_lock_init());\n"
              "    reset_store();"
          )
          closing = (
              "    test_temp_dir_remove_path(STORAGE_DATA_MOUNT);\n"
              "    return 0;"
          )
          closing_replacement = (
              "    test_temp_dir_remove_path(STORAGE_DATA_MOUNT);\n"
              "    TEST_CHECK_APP_ERROR(APP_ERROR_NONE, storage_repository_lock_deinit());\n"
              "    return 0;"
          )
          if text.count(opening) != 1 or text.count(closing) != 1:
              raise SystemExit("set-export lock lifecycle anchors were not unique")
          export_test.write_text(
              text.replace(opening, opening_replacement).replace(
                  closing, closing_replacement
              ),
              encoding="utf-8",
          )
          PY

          clang-format -i \
            tests/host/test_web_api_repository_handlers.c \
            tests/host/test_web_api_set_export.c
          cd webapp
          npm exec prettier -- --write \
            src/features/settings/PackageOperationsPage.tsx \
            tests/management-screens.test.tsx
          npm exec prettier -- --check \
            src/features/settings/PackageOperationsPage.tsx \
            tests/management-screens.test.tsx
          cd ..
          git diff --check

      - name: Run host tests
        run: |
          set -euo pipefail
          ./scripts/run-tests.sh

      - name: Verify exact change scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed='^(tests/host/test_web_api_repository_handlers\.c|tests/host/test_web_api_set_export\.c|webapp/src/features/settings/PackageOperationsPage\.tsx|webapp/tests/management-screens\.test\.tsx)$'
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'no repair changes were produced' >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            if [[ ! "${path}" =~ ${allowed} ]]; then
              printf 'unexpected changed path: %s\n' "${path}" >&2
              exit 1
            fi
          done

      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tests/host/test_web_api_repository_handlers.c \
            tests/host/test_web_api_set_export.c \
            webapp/src/features/settings/PackageOperationsPage.tsx \
            webapp/tests/management-screens.test.tsx
          git commit -m "test: repair Phase 18.2 export gates"
          git push origin HEAD:master

      - name: Publish repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          python3 - "${commit_sha}" <<'PY' > /tmp/phase18-2-status.json
          import json
          import os
          import sys

          body = (
              "Phase 18.2 repair workflow finished.\n\n"
              f"Status: `{os.environ['JOB_STATUS']}`\n"
              f"Run ID: `{os.environ['RUN_ID']}`\n"
              f"Checkout commit: `{sys.argv[1]}`\n"
              "The run is authoritative only when status is success and the repair commit is present on master."
          )
          print(json.dumps({"body": body}))
          PY
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/24" \
            --input /tmp/phase18-2-status.json \
            > /dev/null
