name: Phase 18.3 Prepared Recovery Runner

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase18-3-set-tree-run.yml
      - .github/phase18-3-prepared-trigger.txt

permissions:
  contents: write

concurrency:
  group: phase18-3-prepared-recovery
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libcjson-dev

      - name: Apply prepared-phase recovery
        shell: bash
        run: |
          set -o pipefail
          python3 tools/phase18_3_prepared_impl.py 2>&1 \
            | tee "${RUNNER_TEMP}/phase18-3-prepared.log"

      - name: Validate prepared recovery
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            cmake -S tests/host -B build/phase18-3-prepared -G Ninja
            cmake --build build/phase18-3-prepared \
              --target storage_transaction_tests
            ctest --test-dir build/phase18-3-prepared --output-on-failure \
              -R '^storage_transaction$'
            ./scripts/run-tests.sh storage
          } 2>&1 | tee -a "${RUNNER_TEMP}/phase18-3-prepared.log"

      - name: Record failed implementation run
        if: failure()
        shell: bash
        run: |
          {
            echo '# Phase 18.3 prepared recovery automation failure'
            echo
            echo 'The implementation job failed before committing production code.'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/phase18-3-prepared.log" 2>/dev/null \
              || echo 'No captured log was available.'
            echo '```'
          } > docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_CORE_AUTOMATION_FAILURE.md
          git commit -m "ci: record Phase 18.3 prepared recovery failure"
          git push origin HEAD:master

      - name: Commit validated implementation
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/storage/storage_transaction_replace.c \
            tests/host/test_storage_transactions.c
          git commit -m "feat(storage): recover incomplete replacement staging"
          git push origin HEAD:master
