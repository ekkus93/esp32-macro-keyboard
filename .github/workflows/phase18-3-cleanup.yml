name: Phase 18.3 Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/phase18-3-cleanup-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-3-cleanup-master
  cancel-in-progress: false

jobs:
  validate-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build libcjson-dev lcov

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Remove Phase 18.3 scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/host-tests.yml')
          text = path.read_text()
          start_marker = '  phase18-3-set-tree:\n'
          end_marker = '  host-tests:\n'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
          write_permissions = 'permissions:\n  contents: write\n'
          read_permissions = 'permissions:\n  contents: read\n'
          if write_permissions in text:
              text = text.replace(write_permissions, read_permissions, 1)
          path.write_text(text)
          PY
          shopt -s nullglob
          paths=(
            .github/workflows/phase18-3-*.yml
            .github/phase18-3-*.txt
            tools/phase18_3_*
            docs/PHASE18_3_*
          )
          if ((${#paths[@]} > 0)); then
            git rm -f -- "${paths[@]}"
          fi

      - name: Validate clean repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m json.tool docs/schemas/macro-set-package.schema.json >/dev/null
          ./scripts/run-tests.sh
          ./scripts/run-tests.sh --sanitizers
          cd webapp
          npm run typecheck
          npm run lint
          npm run stylelint
          npm test
          npm run build
          npm run format:check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add .github/workflows/host-tests.yml
          git commit -m "chore: remove Phase 18.3 implementation scaffolding"
          git pull --rebase origin master
          git push origin HEAD:master
