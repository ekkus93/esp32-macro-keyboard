name: H0 ledger finalizer

on:
  push:
    paths:
      - .github/workflows/h0-ledger-finalizer.yml

permissions:
  contents: write

concurrency:
  group: h0-ledger-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify H0 reconciliation
        shell: bash
        run: |
          set -euo pipefail

          patch_file='docs/implementation-v2/H0_TODO_V2_RECONCILIATION_2026-08-11.patch'
          todo_file='docs/TODO_V2.md'
          hardening_file='docs/ESP32_MACRO_KEYBOARD_POST_V2_CORRECTNESS_HARDENING_TODO_2026-08-10.md'
          evidence_file='docs/implementation-v2/H0_POST_V2_HARDENING_RECONCILIATION_2026-08-11.md'
          workflow_file='.github/workflows/h0-ledger-finalizer.yml'

          test -f "${patch_file}"
          git apply --check "${patch_file}"
          git apply "${patch_file}"

          todo_sha="$(git hash-object "${todo_file}")"
          test "${todo_sha}" = 'ec4ba612b99c264412a4c37a7528a438f607a7a3'

          git checkout 08392ebc24e025f9efdc4aac1aa79b1d04749f8e -- "${hardening_file}"
          hardening_sha="$(git hash-object "${hardening_file}")"
          test "${hardening_sha}" = '41379431218490b5518599b4e81b293d5aace89b'

          git checkout 3fa4688caa7fbe2178510eabe39893572a2db3f0 -- "${evidence_file}"
          evidence_sha="$(git hash-object "${evidence_file}")"
          test "${evidence_sha}" = '7926a18fbc922db08bc1d71f6763c43c3b05093f'

          rm -f -- "${patch_file}" "${workflow_file}"

          git diff --check
          git add -A

          test "$(git hash-object "${todo_file}")" = 'ec4ba612b99c264412a4c37a7528a438f607a7a3'
          test "$(git hash-object "${hardening_file}")" = '41379431218490b5518599b4e81b293d5aace89b'
          test "$(git hash-object "${evidence_file}")" = '7926a18fbc922db08bc1d71f6763c43c3b05093f'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize H0 reconciliation'
          git push origin HEAD:master
