name: V2 Cutover A quality diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/v2-cutover-a-quality-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Install host lint tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy jq libcjson-dev shellcheck
          python3 -m pip install --user cmakelang==0.6.13 yamllint==1.38.0
          export GOTOOLCHAIN=go1.25.12
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF v5.5.5
        run: ./scripts/install-esp-idf.sh

      - name: Install V2-034 LittleFS dependency
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          python3 -m pip install littlefs-python==0.15.0

      - name: Capture authoritative failure and self-remove
        shell: bash
        run: |
          set -uo pipefail
          . "$HOME/esp/esp-idf-v5.5.5/export.sh"
          set +e
          ./scripts/check-all.sh > /tmp/v2-cutover-a-quality.log 2>&1
          status=$?
          set -e
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'exit_status=%s\n\n' "$status"
            cat /tmp/v2-cutover-a-quality.log
          } > docs/implementation-v2/V2_040_CUTOVER_A_QUALITY_DIAGNOSTIC.txt
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add docs/implementation-v2/V2_040_CUTOVER_A_QUALITY_DIAGNOSTIC.txt
          git rm .github/workflows/v2-cutover-a-quality-diagnostic.yml
          git diff --cached --check
          git commit -m "Capture Cutover A quality failure"
          git push origin HEAD:master
