name: Phase 17.7 documentation sync

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.repository == 'ekkus93/esp32-macro-keyboard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/code-review-fixes-readable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact documentation updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"{path}: expected one old block, found {text.count(old)}")
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if new in text:
                  return
              raise SystemExit(f"{path}: neither expected old nor new block exists")

          todo = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md")
          progress = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md")
          review_progress = Path("docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_PROGRESS_2026-07-29.md")

          replace_once(
              todo,
              """- [ ] active set is loaded;
          - [ ] macro is loaded and validated;
          - [ ] revision is current;
          - [ ] USB state is `ready`;
          - [ ] executor is not busy;
          - [ ] physical confirmation policy can be satisfied.""",
              """- [x] active set is loaded;
          - [x] macro is loaded and validated;
          - [x] revision is current;
          - [x] USB state is `ready`;
          - [x] executor is not busy;
          - [x] physical confirmation policy can be satisfied.""",
          )
          replace_once(
              todo,
              """}
          ```

          ### 17.8 Correct result labeling""",
              """}
          ```

          **Implemented:** confirmation routes accept either exactly one macro ID or a
          complete procedure/step context. The page loads and validates the persisted
          set-local or global macro, verifies the exact procedure macro step, and shows
          the server-owned source, revision, action count, duration, and key timings.
          Navigation never executes. Explicit Send performs a second preflight of the
          active set, settings, macro, validation result, procedure context, USB state,
          and executor state. Drift fails closed. When configured, the page visibly waits
          for the device button using a bounded 25-second client timeout around the
          firmware's 20-second confirmation window. Submission uses nested
          `sourceContext`; execution polling retains the accepted execution ID and refuses
          to display or cancel a different current execution. Tests cover malformed and
          partial routes, preview-only navigation, USB blocking, global-macro fallback,
          preflight drift, physical-confirmation state, exact nested submission, timeout,
          and execution-identity mismatch.

          ### 17.8 Correct result labeling""",
          )

          replace_once(
              progress,
              "| 17 | Replace frontend mock behavior | in progress (17.1-17.6, 17.8, and settings complete) |",
              "| 17 | Replace frontend mock behavior | in progress (17.1-17.8 and settings complete; 17.9-17.10 open) |",
          )
          replace_once(
              progress,
              """## Completed tasks (commit evidence)

          - Phase 17.6 procedure workflow""",
              """## Completed tasks (commit evidence)

          - Phase 17.7 execution confirmation and submission — complete in the commit
            containing this progress update. Standalone macro sends and procedure
            Send/Resend actions now navigate to a strict preview route and never execute
            on navigation. The page loads persisted set-local or global macro data,
            compile-only validation, exact optional procedure context, active settings,
            USB state, and executor state. Explicit Send performs a second fail-closed
            preflight and submits the typed nested `sourceContext` contract. Physical
            confirmation is visible to the operator and uses a 25-second client timeout
            around the firmware's 20-second wait. The accepted execution ID is retained;
            polling refuses to display or cancel a different execution. Regression
            coverage includes route strictness, preview-only behavior, USB blocking,
            global fallback, stale preflight data, exact submission, timeout handling,
            and identity mismatch. Host Tests run 30447946686 passed all native,
            sanitizer, coverage, and 113 frontend tests; Device Test Build run
            30447946598 passed.

          - Phase 17.6 procedure workflow""",
          )

          replace_once(
              review_progress,
              """## Intentionally deferred scope

          ### Phase 17.7 confirmation UI

          The typed execution request, serializer, and response guard are ready. The
          actual confirmation screen is not implemented in this fix pass because the
          source TODO explicitly excludes full Phase 17.7 UI implementation. That phase
          must construct the same nested request and omit `sourceContext` for standalone
          execution.

          ### Phase 18 executable import validation""",
              """### Phase 17.7 execution confirmation and submission

          - Standalone macro Send and procedure Send/Resend open a strict preview route;
            navigation never starts an execution.
          - The page loads and revalidates persisted set-local or global macro data,
            server-owned metrics, exact procedure context, active settings, USB state,
            and executor state.
          - Explicit Send fails closed on active-set, revision, source, validation,
            procedure-step, USB, or executor drift.
          - Physical confirmation is shown as an explicit device-button wait, with a
            bounded 25-second request timeout around the firmware's 20-second window.
          - Submission uses exact nested `sourceContext`, retains the accepted execution
            ID, and refuses to display or cancel a different current execution.
          - Route, timeout, preview, global fallback, stale-data, submission, and identity
            regression tests are committed.

          Final implementation commit before documentation sync: `9fb7130`.

          ## Intentionally deferred scope

          ### Phase 18 executable import validation""",
          )
          replace_once(
              review_progress,
              """## Validation status

          Targeted Host Tests passed for the procedure authority and atomic-write fixes.
          The final branch gate is the read-only Quality workflow running
          `./scripts/check-all.sh` from the committed dependency graph. This section must
          be updated with the final workflow conclusions before the TODO is closed.""",
              """## Validation status

          - Host Tests run `30447946686`: passed, including native tests, ASan/UBSan,
            native coverage, frontend coverage, and 113 frontend tests.
          - Device Test Build run `30447946598`: passed for ESP32-S3 test firmware.
          - Quality run `30447946652`: validates the read-only authoritative
            `./scripts/check-all.sh` path for the implementation tree; the final
            documentation-only commit is revalidated after this evidence sync.""",
          )
          PY

      - name: Verify exact documentation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ./scripts/check-docs.sh
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_PROGRESS_2026-07-29.md
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'error: unexpected documentation diff: %s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit exact documentation evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_PROGRESS_2026-07-29.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/staged-files.txt"
          printf '%s\n' \
            docs/ESP32_MACRO_KEYBOARD_CODE_REVIEW_FIXES_PROGRESS_2026-07-29.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md \
            | sort > "${RUNNER_TEMP}/expected-files.txt"
          cmp --silent "${RUNNER_TEMP}/staged-files.txt" "${RUNNER_TEMP}/expected-files.txt"
          git commit -m "docs: complete Phase 17.7 evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
