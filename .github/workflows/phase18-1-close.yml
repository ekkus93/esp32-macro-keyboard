name: Phase 18.1 Closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase18-1-close.yml

permissions:
  contents: write

jobs:
  close-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install package-test dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libcjson-dev

      - name: Verify and synchronize Phase 18.1 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md")
          progress_path = Path("docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md")
          api_path = Path("docs/API.md")
          source_path = Path("firmware/components/storage/storage_package.c")
          test_path = Path("tests/host/test_storage_package.c")

          source = source_path.read_text()
          tests = test_path.read_text()

          required_source = (
              "if (length > APP_IMPORT_PACKAGE_MAX_BYTES)",
              "parse_package_document(data, length, &document)",
              "count_package_arrays(&document, &summary)",
              "validate_package_objects(&document, &summary)",
          )
          for marker in required_source:
              assert marker in source, marker

          mutation_markers = (
              "storage_set_create(",
              "storage_set_update(",
              "storage_set_delete(",
              "storage_macro_create(",
              "storage_macro_update(",
              "storage_macro_delete(",
              "storage_procedure_create(",
              "storage_procedure_update(",
              "storage_procedure_delete(",
              "storage_progress_write(",
              "storage_progress_delete(",
          )
          for marker in mutation_markers:
              assert marker not in source, marker

          required_tests = (
              '"future":true',
              '"progress":[]}x',
              "APP_IMPORT_PACKAGE_MAX_BYTES + 1U",
              "test_object_and_reference_validation",
          )
          for marker in required_tests:
              assert marker in tests, marker

          todo = todo_path.read_text()
          old_section = """### 18.1 Implement bounded package reader

- [ ] enforce `APP_IMPORT_PACKAGE_MAX_BYTES`;
- [ ] stream or use bounded allocation;
- [ ] reject trailing data;
- [ ] reject unknown schema fields;
- [ ] validate all objects before mutation.
"""
          new_section = """### 18.1 Implement bounded package reader

- [x] enforce `APP_IMPORT_PACKAGE_MAX_BYTES`;
- [x] stream or use bounded allocation;
- [x] reject trailing data;
- [x] reject unknown schema fields;
- [x] validate all objects before mutation.

Implemented: `storage_package_validate()` is a zero-copy package reader over the
bounded request buffer. It rejects packages above `APP_IMPORT_PACKAGE_MAX_BYTES`
before parsing; scans JSON with an iterative, depth-bounded state machine; allocates
only count-bounded validation metadata; requires the complete input to contain one
package document with no non-whitespace trailing bytes; rejects duplicate, unknown,
or future fields; and validates every set, macro, procedure, progress object, and
cross-object reference before returning success. The validation component has no
repository mutation dependency, so Phase 18.3 remains the first code permitted to
activate imported state.
"""
          assert todo.count(old_section) == 1
          todo_path.write_text(todo.replace(old_section, new_section))

          progress = progress_path.read_text()
          old_status = "| 18 | Import / export / backup / restore | in progress (§18.2 complete; §18.1 and §18.3–18.5 remain) |"
          new_status = "| 18 | Import / export / backup / restore | in progress (§18.1–18.2 complete; §18.3–18.5 remain) |"
          assert progress.count(old_status) == 1
          progress = progress.replace(old_status, new_status)
          anchor = "## Completed tasks (commit evidence)\n\n"
          entry = """- Phase 18.1 bounded package reader — complete in `39b264e`, `974d339`,
  `e262137`, `3e03294`, `60856a8`, and `ce81a76`, with iterative parser hardening
  in `3670557`. `storage_package_validate()` enforces the import byte ceiling before
  parsing, scans without recursion, uses only count-bounded metadata allocations,
  rejects trailing data and unknown/duplicate fields, validates every object and
  reference, and remains structurally isolated from repository mutation APIs. The
  dedicated `tests/scripts/test-storage-package.sh` gate compiles and runs the
  production parser and its host regression matrix automatically.

"""
          assert progress.count(anchor) == 1
          assert "- Phase 18.1 bounded package reader — complete" not in progress
          progress_path.write_text(progress.replace(anchor, anchor + entry))

          api = api_path.read_text()
          old_api = """Export and import currently return explicit `503 Service Unavailable`;
they cannot report false success before the Phase 18 package service exists.
"""
          new_api = """Set export returns the raw, validated Phase 18 package with its exact byte
length. Set import remains an explicit `503 Service Unavailable` boundary until
Phase 18.3 supplies transactional activation; the Phase 18.1 reader and validator
never mutate repository state.
"""
          assert api.count(old_api) == 1
          api_path.write_text(api.replace(old_api, new_api))
          PY

          bash tests/scripts/test-storage-package.sh

      - name: Commit verified closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase18-1-close.yml
          git add \
            docs/API.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_PROGRESS.md \
            docs/ESP32_MACRO_KEYBOARD_RUNTIME_INTEGRITY_AND_PRODUCT_COMPLETION_FIX1_TODO.md
          git commit -m "docs: close Phase 18.1 bounded package reader"
          git push origin HEAD:master
