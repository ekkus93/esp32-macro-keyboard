name: Phase 18.3 Package Replacement

on:
  push:
    branches:
      - master
    paths:
      - .github/phase18-3-package-replace-trigger*.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-3-package-replace-master
  cancel-in-progress: false

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libcjson-dev

      - name: Detect pending service
        id: state
        shell: bash
        run: |
          if [[ -f firmware/components/storage/storage_package_replace.c ]]; then
            echo 'needed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'needed=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Materialize production package replacement service
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/phase18_3_package_replace_impl.py 2>&1 \
            | tee "${RUNNER_TEMP}/phase18-3-package-replace.log"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/host/test_storage_package_replace.c")
          text = path.read_text()
          changes = [
              (
                  "storage_procedure_read(&procedure_identity, &procedure)",
                  "storage_procedure_read(&procedure_identity.set_id, "
                  "&procedure_identity.procedure_id, &procedure)",
              ),
              (
                  "    const storage_macro_location_t location = {\n"
                  "        .scope = MACRO_SCOPE_SET,\n"
                  "        .set_id = id,\n"
                  "    };",
                  "    const storage_macro_location_t location = {\n"
                  "        .scope = MACRO_SCOPE_SET,\n"
                  "        .has_set_id = true,\n"
                  "        .set_id = id,\n"
                  "    };",
              ),
          ]
          for old, new in changes:
              if text.count(old) != 1:
                  raise SystemExit(f"package replacement test anchor changed: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Validate package replacement implementation
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            cmake -S tests/host -B build/phase18-3-package-replace -G Ninja
            cmake --build build/phase18-3-package-replace \
              --target storage_package_replace_tests storage_transaction_tests storage_set_tree_tests
            ctest --test-dir build/phase18-3-package-replace --output-on-failure \
              -R '^(storage_package_replace|storage_transaction|storage_set_tree)$'
            ./scripts/run-tests.sh storage
          } 2>&1 | tee -a "${RUNNER_TEMP}/phase18-3-package-replace.log"

      - name: Record failed validation
        if: failure()
        shell: bash
        run: |
          {
            echo '# Phase 18.3 package replacement failure'
            echo
            echo 'The production package replacement validation failed.'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/phase18-3-package-replace.log" 2>/dev/null \
              || echo 'No captured log was available.'
            echo '```'
          } > docs/PHASE18_3_PACKAGE_REPLACE_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_PACKAGE_REPLACE_FAILURE.md
          git commit -m "ci: record Phase 18.3 package replacement failure"
          git push origin HEAD:master

      - name: Commit validated production code
        if: success() && steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/storage/CMakeLists.txt \
            firmware/components/storage/include/storage_package.h \
            firmware/components/storage/storage_package_replace.c \
            tests/host/CMakeLists.txt \
            tests/host/test_storage_package_replace.c
          git commit -m "feat(storage): activate transactional package replacement"
          git push origin HEAD:master
