name: Phase 18.3 Package Replacement

on:
  push:
    branches:
      - master
    paths:
      - .github/phase18-3-package-replace-trigger*.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-3-package-replace-master
  cancel-in-progress: false

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libcjson-dev

      - name: Detect pending service
        id: state
        shell: bash
        run: |
          if [[ -f firmware/components/storage/storage_package_replace.c ]]; then
            echo 'needed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'needed=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Materialize production package replacement service
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/phase18_3_package_replace_impl.py 2>&1 \
            | tee "${RUNNER_TEMP}/phase18-3-package-replace.log"
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("tests/host/test_storage_package_replace.c")
          test_text = test_path.read_text()
          old = "storage_procedure_read(&procedure_identity, &procedure)"
          new = (
              "storage_procedure_read(&procedure_identity.set_id, "
              "&procedure_identity.procedure_id, &procedure)"
          )
          if test_text.count(old) != 1:
              raise SystemExit("package replacement procedure-read test anchor changed")
          test_path.write_text(test_text.replace(old, new, 1))

          service_path = Path("firmware/components/storage/storage_package_replace.c")
          service = service_path.read_text()
          entry_marker = "static app_error_code_t replace_locked"
          if service.count(entry_marker) != 1:
              raise SystemExit("package replacement locked entry changed")
          prefix, tail = service.split(entry_marker, 1)
          trace_replacements = [
              (
                  "    app_error_code_t result = storage_set_read_locked(target_set_id, &current);\n",
                  "    app_error_code_t result = storage_set_read_locked(target_set_id, &current);\n"
                  "    fprintf(stderr, \"PHASE18_3_DIAGNOSTIC current=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = verify_global_dependencies(document->arrays[PACKAGE_REPLACE_GLOBAL_MACROS]);\n",
                  "        result = verify_global_dependencies(document->arrays[PACKAGE_REPLACE_GLOBAL_MACROS]);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC globals=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = app_uuid_generate(&transaction_id);\n",
                  "        result = app_uuid_generate(&transaction_id);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC uuid=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = initialize_manifest(&transaction_id, &current, &document->replacement, staging,\n"
                  "                                     &manifest);\n",
                  "        result = initialize_manifest(&transaction_id, &current, &document->replacement, staging,\n"
                  "                                     &manifest);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC manifest-init=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = storage_transaction_write_manifest(&manifest);\n"
                  "        manifest_written = result == APP_ERROR_NONE;\n",
                  "        result = storage_transaction_write_manifest(&manifest);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC manifest-prepared=%d\\n\", (int)result);\n"
                  "        manifest_written = result == APP_ERROR_NONE;\n",
              ),
              (
                  "        result = create_staging(&transaction_id, staging, sizeof(staging));\n",
                  "        result = create_staging(&transaction_id, staging, sizeof(staging));\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC staging-create=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = materialize_staging(document, staging);\n",
                  "        result = materialize_staging(document, staging);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC staging-materialize=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = storage_set_tree_validate(staging, target_set_id,\n"
                  "                                           document->replacement.revision);\n",
                  "        result = storage_set_tree_validate(staging, target_set_id,\n"
                  "                                           document->replacement.revision);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC staging-validate=%d\\n\", (int)result);\n",
              ),
              (
                  "        manifest.phase = STORAGE_TRANSACTION_STAGED;\n"
                  "        result = storage_transaction_write_manifest(&manifest);\n",
                  "        manifest.phase = STORAGE_TRANSACTION_STAGED;\n"
                  "        result = storage_transaction_write_manifest(&manifest);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC manifest-staged=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = recover_replace(&manifest);\n",
                  "        result = recover_replace(&manifest);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC recover=%d\\n\", (int)result);\n",
              ),
          ]
          for before, after in trace_replacements:
              if tail.count(before) != 1:
                  raise SystemExit(f"package replacement trace anchor changed: {before!r}")
              tail = tail.replace(before, after, 1)
          service = prefix + entry_marker + tail

          outer_replacements = [
              (
                  "    if (result != APP_ERROR_NONE) {\n        return result;\n    }\n"
                  "    package_replace_document_t document = {0};",
                  "    fprintf(stderr, \"PHASE18_3_DIAGNOSTIC validate=%d\\n\", (int)result);\n"
                  "    if (result != APP_ERROR_NONE) {\n        return result;\n    }\n"
                  "    package_replace_document_t document = {0};",
              ),
              (
                  "    result = open_document(data, length, &document);\n",
                  "    result = open_document(data, length, &document);\n"
                  "    fprintf(stderr, \"PHASE18_3_DIAGNOSTIC open=%d\\n\", (int)result);\n",
              ),
              (
                  "        result = replace_locked(target_set_id, expected_revision, &document, out_set);\n",
                  "        result = replace_locked(target_set_id, expected_revision, &document, out_set);\n"
                  "        fprintf(stderr, \"PHASE18_3_DIAGNOSTIC replace=%d\\n\", (int)result);\n",
              ),
          ]
          for before, after in outer_replacements:
              if service.count(before) != 1:
                  raise SystemExit("package replacement outer diagnostic anchor changed")
              service = service.replace(before, after, 1)
          service_path.write_text(service)
          PY

      - name: Validate package replacement implementation
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            cmake -S tests/host -B build/phase18-3-package-replace -G Ninja
            cmake --build build/phase18-3-package-replace \
              --target storage_package_replace_tests storage_transaction_tests storage_set_tree_tests
            ctest --test-dir build/phase18-3-package-replace --output-on-failure \
              -R '^(storage_package_replace|storage_transaction|storage_set_tree)$'
            ./scripts/run-tests.sh storage
          } 2>&1 | tee -a "${RUNNER_TEMP}/phase18-3-package-replace.log"

      - name: Record failed validation
        if: failure()
        shell: bash
        run: |
          {
            echo '# Phase 18.3 package replacement failure'
            echo
            echo 'The production package replacement validation failed.'
            echo
            echo '## Validation log'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/phase18-3-package-replace.log" 2>/dev/null \
              || echo 'No captured log was available.'
            echo '```'
            echo
            echo '## Test fixture around the failure'
            echo
            echo '```c'
            nl -ba tests/host/test_storage_package_replace.c | sed -n '1,290p'
            echo '```'
            echo
            echo '## Replacement service entry and validators'
            echo
            echo '```c'
            nl -ba firmware/components/storage/storage_package_replace.c | sed -n '1,220p'
            nl -ba firmware/components/storage/storage_package_replace.c | sed -n '520,720p'
            echo '```'
          } > docs/PHASE18_3_PACKAGE_REPLACE_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE18_3_PACKAGE_REPLACE_FAILURE.md
          git commit -m "ci: record Phase 18.3 package replacement failure"
          git push origin HEAD:master

      - name: Commit validated production code
        if: success() && steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/PHASE18_3_DIAGNOSTIC/d' firmware/components/storage/storage_package_replace.c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/components/storage/CMakeLists.txt \
            firmware/components/storage/include/storage_package.h \
            firmware/components/storage/storage_package_replace.c \
            tests/host/CMakeLists.txt \
            tests/host/test_storage_package_replace.c
          git commit -m "feat(storage): activate transactional package replacement"
          git push origin HEAD:master
