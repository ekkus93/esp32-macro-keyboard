name: Apply H10 swappable parameter fix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-h10-swappable-params-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply and validate source fix
        shell: bash
        run: |
          set -euo pipefail
          target="firmware/components/web_server/web_settings.c"
          expected_before="d2da118627d4a5d8a3cf957031009cdbafcc9884"
          test "$(git hash-object "${target}")" = "${expected_before}"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/components/web_server/web_settings.c")
          text = path.read_text()
          old_signature = '''static web_change_password_outcome_t change_password_verify_current(
              const web_settings_ops_t *ops, app_v2_string_view_t current_password_view,
              app_v2_string_view_t new_password_view, app_v2_device_settings_t *current) {'''
          new_signature = '''static web_change_password_outcome_t change_password_verify_current(
              const web_settings_ops_t *ops, app_v2_string_view_t current_password_view,
              app_v2_device_settings_t *current, app_v2_string_view_t new_password_view) {'''
          old_call = '''    outcome =
              change_password_verify_current(ops, current_password_view, new_password_view, &current);'''
          new_call = '''    outcome =
              change_password_verify_current(ops, current_password_view, &current, new_password_view);'''

          if text.count(old_signature) != 1:
              raise SystemExit("expected exactly one helper signature")
          if text.count(old_call) != 1:
              raise SystemExit("expected exactly one helper call")
          text = text.replace(old_signature, new_signature).replace(old_call, new_call)
          path.write_text(text)
          PY

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libcjson-dev clang-format
          clang-format -i "${target}"
          clang-format --dry-run --Werror "${target}"
          git diff --check

          ./scripts/run-tests.sh web
          ./scripts/run-tests.sh --sanitizers web

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git rm .github/workflows/apply-h10-swappable-params-fix.yml
          git commit -m "fix: disambiguate password verification parameters"
          git push origin HEAD:master
